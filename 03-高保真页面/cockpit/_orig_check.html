<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071522">
  <title>智能网联汽车监管及运营平台 · 可视化驾驶舱</title>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./cockpit.css">
  <link rel="stylesheet" href="../common/video-workbench.css">
</head>
<body>
  <main class="cockpit-root" data-layout="standard" data-seam="off" data-page="home">
    <header class="cockpit-header">
      <div class="brand-lockup">
        <h1>智能网联汽车监管及运营平台</h1>
      </div>
      <div class="header-meta"><div class="clock-block"><strong id="current-time">--:--:--</strong></div></div>
    </header>

    <section class="cockpit-grid" aria-label="驾驶舱首页">
      <aside class="analysis-column left-column" aria-label="左侧运营概况">
        <section class="module module-resource" id="road-resource-module" tabindex="0" role="button" aria-pressed="false" aria-label="选择开放道路资源地图视图">
          <div class="module-heading"><span></span><h2>开放道路资源</h2><button class="module-link road-list-trigger" type="button" id="road-list-trigger" aria-label="查看道路列表" title="查看道路列表">&gt;&gt;</button></div>
          <div class="metric-grid metric-grid-3" data-metric-group="road-resource">
            <button class="metric-tile road-filter is-selected" type="button" data-road-filter="all" aria-pressed="true">
              <span>路段总数</span><strong id="road-total-count">128</strong><small>段 · 全部</small>
            </button>
            <button class="metric-tile road-filter" type="button" data-road-filter="open" aria-pressed="false">
              <span>开放路段</span><strong id="road-open-count">125</strong><small>段 · 可用</small>
            </button>
            <button class="metric-tile road-filter" type="button" data-road-filter="paused" aria-pressed="false">
              <span>暂停路段</span><strong id="road-paused-count">3</strong><small>段 · 关注</small>
            </button>
          </div>
        </section>

        <section class="module module-chart">
          <div class="module-heading"><span></span><h2>测试示范申请</h2><button class="module-link application-list-trigger" type="button" id="application-list-trigger" aria-label="查看申请列表" title="查看申请列表">&gt;&gt;</button><div class="range-tabs" data-range="application"><button type="button">本月</button><button type="button" class="is-active">本年</button><button type="button">全部</button></div></div>
          <div class="metric-grid metric-grid-3 compact" data-metric-group="application">
            <button class="metric-tile is-selected" type="button" data-chart="application" data-key="road-test" data-value="125" aria-pressed="true"><span>道路测试</span><strong>125</strong><small>项</small></button>
            <button class="metric-tile" type="button" data-chart="application" data-key="demo-apply" data-value="3" aria-pressed="false"><span>示范应用</span><strong>3</strong><small>项</small></button>
            <button class="metric-tile" type="button" data-chart="application" data-key="commercial" data-value="3" aria-pressed="false"><span>商业化试点</span><strong>3</strong><small>项</small></button>
          </div>
          <div class="donut-wrap">
            <div class="donut-chart" id="application-donut" style="--donut: conic-gradient(#00cfe8 0 40%, #1677ff 40% 66.67%, #fa8c16 66.67% 86.67%, #9254de 86.67% 100%);"><div class="donut-hole"><strong id="application-total">131</strong><span id="application-total-label">申请总量</span></div></div>
            <div class="legend-list" id="application-legend"></div>
          </div>
        </section>

        <section class="module module-chart vehicle-module is-selected" id="vehicle-monitor-module" tabindex="0" role="button" aria-pressed="true" aria-label="选择车辆实时监控地图视图">
          <div class="module-heading"><span></span><h2>车辆实时监控</h2><button class="module-link vehicle-list-trigger" type="button" id="vehicle-list-trigger" aria-label="查看车辆列表" title="查看车辆列表">&gt;&gt;</button><em class="live-label">实时</em></div>
          <div class="metric-grid metric-grid-3 compact" data-metric-group="vehicle">
            <button class="metric-tile is-selected" type="button" data-chart="vehicle" data-key="all" data-value="128" aria-pressed="true"><span>车辆总数</span><strong>128</strong><small>辆</small></button>
            <button class="metric-tile" type="button" data-chart="vehicle" data-key="online" data-value="125" aria-pressed="false"><span>在线车辆</span><strong>125</strong><small>辆</small></button>
            <button class="metric-tile" type="button" data-chart="vehicle" data-key="mileage" data-value="3" aria-pressed="false"><span>累计里程</span><strong>3</strong><small>万km</small></button>
          </div>
          <div class="donut-wrap vehicle-donut-wrap">
            <div class="donut-chart" id="vehicle-donut" style="--donut: conic-gradient(#00cfe8 0 30.77%, #fa8c16 30.77% 76.92%, #ff6b9b 76.92% 100%);"><div class="donut-hole"><strong id="vehicle-total">128</strong><span id="vehicle-total-label">车辆总数</span></div></div>
            <div class="legend-list" id="vehicle-legend"></div>
          </div>
        </section>
      </aside>

      <section class="main-stage" aria-label="地图主舞台">
        <div class="map-stage" id="map-stage">
          <div class="leaflet-map" id="cockpit-map" role="application" aria-label="襄阳市行政区与测试车辆分布地图"></div>
          <button type="button" class="map-layer-control" id="map-layer-btn" aria-label="地图图层" title="地图图层">⌗</button>
          <div class="map-legend" id="map-legend"><span><i class="legend-online"></i>在线车辆</span><span><i class="legend-warning"></i>预警车辆</span><span><i class="legend-alarm"></i>告警车辆</span></div>
          <div class="map-layer-popover" id="map-layer-popover" aria-hidden="true"><strong>地图图层</strong><label><input type="checkbox" data-layer="district" checked> 行政区边界</label><label><input type="checkbox" data-layer="vehicle" checked> 测试车辆</label><label><input type="checkbox" data-layer="incident" checked> 异常事件</label><label><input type="checkbox" data-layer="accident" checked> 事故点位</label><label><input type="checkbox" data-layer="route" checked> 实时轨迹</label><label><input type="checkbox" data-layer="road" checked> 开放道路</label></div>
          <aside class="cockpit-video-panel" id="cockpit-video-panel" aria-hidden="true" aria-label="车辆视频面板">
            <header class="cockpit-video-header"><div><span class="cockpit-panel-kicker">实时视频</span><strong id="cockpit-video-title">未选择车辆</strong></div><button type="button" class="cockpit-panel-close" id="cockpit-video-close" aria-label="关闭视频面板" title="关闭视频面板">×</button></header>
            <div class="cockpit-video-body" id="cockpit-video-pane"></div>
          </aside>
          <section class="cockpit-trajectory-panel" id="cockpit-trajectory-panel" aria-hidden="true" aria-label="车辆轨迹回放"></section>
        </div>
      </section>

      <aside class="analysis-column right-column" aria-label="右侧事件分析">
        <section class="module module-chart incident-module" id="incident-module" tabindex="0" role="button" aria-pressed="false" aria-label="选择异常事件地图视图">
          <div class="module-heading"><span></span><h2>异常事件统计</h2><button class="module-link incident-list-trigger" type="button" id="incident-list-trigger" aria-label="查看异常事件列表" title="查看异常事件列表">&gt;&gt;</button><div class="range-tabs" data-range="incident"><button type="button">本月</button><button type="button" class="is-active">本年</button><button type="button">全部</button></div></div>
          <div class="metric-grid metric-grid-3 compact" data-metric-group="incident">
            <button class="metric-tile is-selected" type="button" data-chart="incident" data-key="total" data-value="54" aria-pressed="true"><span>事件总数</span><strong>54</strong><small>起</small></button>
            <button class="metric-tile" type="button" data-chart="incident" data-key="warning" data-value="45" aria-pressed="false"><span>预警事件</span><strong>45</strong><small>起</small></button>
            <button class="metric-tile" type="button" data-chart="incident" data-key="alarm" data-value="9" aria-pressed="false"><span>告警事件</span><strong>9</strong><small>起</small></button>
          </div>
          <div class="incident-selection-hint" id="incident-selection-hint">点击模块查看区域异常事件聚合</div>
          <div class="donut-wrap incident-donut-wrap">
            <div class="donut-chart" id="incident-donut" style="--donut: conic-gradient(#fadb14 0 29.63%, #fa8c16 29.63% 74.07%, #ff6b9b 74.07% 100%);"><div class="donut-hole"><strong id="incident-total">54</strong><span id="incident-total-label">事件总数</span></div></div>
            <div class="legend-list" id="incident-legend"></div>
          </div>
          <div class="incident-events" aria-label="实时异常事件">
            <div class="module-heading"><span></span><h2>实时事件</h2></div>
            <div class="event-table" role="table" aria-label="实时异常事件列表"><div class="event-row event-head" role="row"><span>车牌号</span><span>事件类型</span><span>时间</span></div><div class="event-list-viewport" id="event-list" tabindex="0" aria-label="实时事件轮播，聚焦时暂停"></div></div>
          </div>
        </section>

        <section class="module accident-module" id="accident-module" tabindex="0" role="button" aria-pressed="false" aria-label="选择事故统计地图视图">
          <div class="module-heading"><span></span><h2>事故统计</h2><button class="module-link accident-list-trigger" type="button" id="accident-list-trigger" aria-label="查看事故列表" title="查看事故列表">&gt;&gt;</button><div class="range-tabs" data-range="accident"><button type="button">本月</button><button type="button" class="is-active">本年</button><button type="button">全部</button></div></div>
          <div class="accident-chart" id="accident-chart" aria-label="本年事故趋势图"></div>
        </section>
      </aside>
    </section>

    <div class="cockpit-overlay" id="overlay-root" aria-hidden="true"><div class="overlay-shade" data-overlay-close></div><section class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><div><span class="modal-kicker" id="modal-kicker">区域下钻</span><h2 id="modal-title">--</h2></div><div class="modal-header-actions"><button class="modal-close" type="button" data-overlay-close aria-label="关闭">×</button></div></header><div class="modal-body" id="modal-body"></div><footer><button type="button" class="ghost-button" data-overlay-close>返回驾驶舱</button><button type="button" class="primary-button" id="modal-action">查看车辆清单</button></footer></section></div>
  </main>
  <script src="./vendor/leaflet/leaflet.js"></script>
  <script src="../common/time-clock.js"></script>
  <script src="../common/vehicle-data.js"></script>
  <script src="../common/video-workbench.js"></script>
  <script src="./cockpit.js"></script>
</body>
</html>
