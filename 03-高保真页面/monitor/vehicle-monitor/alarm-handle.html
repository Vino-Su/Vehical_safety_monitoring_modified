  if(!record.approvalLogs&&record.logs){record.approvalLogs=record.logs.map(function(log){return {node:log.node||log.title||'事件处理',handler:log.handler||log.actor||'平台监测服务',time:log.time||'',opinion:log.opinion||'',result:log.result||log.status||record.status};});}
  if(!record.approvalLogs)record.approvalLogs=[];
  delete record.response;
  delete record.logs;
  return record;
}
function getRecords(){try{var stored=sessionStorage.getItem(STORE_KEY);return (stored?JSON.parse(stored):clone(SEED_EVENTS)).map(normalizeRecord);}catch(e){return clone(SEED_EVENTS).map(normalizeRecord);}}
function saveRecords(){sessionStorage.setItem(STORE_KEY,JSON.stringify(allEvents));}
function findEvent(id){return allEvents.find(function(item){return item.id===id;});}
function statusTag(status){var map={'待处理':'ant-tag-warning','待审核':'ant-tag-processing','已完成':'ant-tag-success','已退回':'ant-tag-error'};return '<span class="ant-tag '+(map[status]||'ant-tag-default')+'">'+escapeHtml(status)+'</span>';}
function categoryTag(category){return '<span class="ant-tag '+(category==='预警'?'ant-tag-processing':'ant-tag-warning')+'">'+escapeHtml(category)+'</span>';}
var EVENT_RULES={'车辆运行异常预警':'车辆运行指标达到已配置的速度、加速度或路线偏离阈值','车辆碰撞事件预警':'车辆冲击加速度、速度变化或姿态变化达到碰撞识别阈值','车载终端异常预警':'车载终端数据链路或关键设备状态命中已配置异常规则','临牌有效期告警':'数据生成时间不在临牌有效期内，且车辆为自动驾驶模式、车速不为 0','电子围栏越界告警':'车辆为自动驾驶模式且定位不在授权围栏内，档位为 D/S/R、车速不为 0','测试时段合规性告警':'数据生成时间不在允许测试时段内，且车辆为自动驾驶模式、车速不为 0','安全员到岗状态告警':'车辆处于排班上岗时段、自动驾驶模式且车速不为 0，安全员未到岗'};
function conclusionText(v){return v||'—';}
function eventTypeOptions(){var types={};allEvents.forEach(function(e){types[e.type]=true;});var select=document.getElementById('typeFilter');Object.keys(types).forEach(function(type){var opt=document.createElement('option');opt.value=type;opt.textContent=type;select.appendChild(opt);});}
var activeStatus='';
function matchBaseFilters(e){var keyword=document.getElementById('eventKeyword').value.trim().toLowerCase();var plate=document.getElementById('plateKeyword').value.trim().toLowerCase();var type=document.getElementById('typeFilter').value;var start=document.getElementById('occurredStart').value;var end=document.getElementById('occurredEnd').value;return (!keyword||e.id.toLowerCase().indexOf(keyword)>-1)&&(!plate||e.plate.toLowerCase().indexOf(plate)>-1)&&(!type||e.type===type)&&(!start||e.occurredAt.substring(0,10)>=start)&&(!end||e.occurredAt.substring(0,10)<=end);}
function filteredRecords(){return allEvents.filter(function(e){return matchBaseFilters(e)&&(!activeStatus||e.status===activeStatus);}).sort(function(a,b){return b.occurredAt.localeCompare(a.occurredAt);});}
function selectStatusCard(status){activeStatus=status;document.querySelectorAll('#statusCards .summary-card').forEach(function(card){card.classList.toggle('active',card.getAttribute('data-status')===status);});searchEvents();}
function renderSummary(){var counts={'待处理':0,'待审核':0,'已退回':0,'已完成':0};var total=0;allEvents.forEach(function(e){if(matchBaseFilters(e)){total++;counts[e.status]=(counts[e.status]||0)+1;}});document.getElementById('countAll').textContent=total;document.getElementById('countPending').textContent=counts['待处理'];document.getElementById('countReview').textContent=counts['待审核'];document.getElementById('countReturned').textContent=counts['已退回'];document.getElementById('countCompleted').textContent=counts['已完成'];}
 function renderTable(){var data=filteredRecords();var page=pager?pager.getCurrentPage():1;var pageSize=pager?pager.getPageSize():10;var start=(page-1)*pageSize;var visible=data.slice(start,start+pageSize);var html='';if(!visible.length){html='<tr><td colspan="9"><div class="text-center text-[#00000040] py-10">暂无符合条件的异常事件</div></td></tr>';}else{visible.forEach(function(e){var action=e.status==='待处理'||e.status==='已退回'?'<button class="ant-btn-link" onclick="openHandleForm(\''+e.id+'\')">处置</button>':'';html+='<tr><td class="col-code">'+escapeHtml(e.id)+'</td><td>'+categoryTag(e.category)+'</td><td>'+escapeHtml(e.plate)+'</td><td class="col-code" style="font-size:12px">'+escapeHtml(e.vin)+'</td><td>'+escapeHtml(e.enterprise)+'</td><td title="'+escapeHtml(e.content)+'">'+escapeHtml(e.content)+'</td><td class="col-code">'+escapeHtml(e.occurredAt)+'</td><td>'+statusTag(e.status)+'</td><td class="col-action"><div class="inline-flex items-center gap-3"><button class="ant-btn-link" onclick="openDetail(\''+e.id+'\')">查看</button>'+action+'</div></td></tr>';});}document.getElementById('eventRows').innerHTML=html;if(pager)pager.setTotal(data.length);if(window.initFixedTable)window.initFixedTable();}
function searchEvents(){renderSummary();if(pager)pager.reset();else renderTable();}
function resetFilters(){document.getElementById('eventKeyword').value='';document.getElementById('plateKeyword').value='';document.getElementById('typeFilter').value='';document.getElementById('occurredStart').value='';document.getElementById('occurredEnd').value='';selectStatusCard('');}
function toDetailRows(items){return items.map(function(item){return '<div class="desc-item"><div class="desc-label">'+escapeHtml(item.label)+'</div><div class="desc-value">'+escapeHtml(item.value)+'</div></div>';}).join('');}
function getTriggerValue(e,label){var item=(e.trigger||[]).find(function(entry){return entry.label===label;});return item?item.value:'—';}
function getRealtimeSnapshot(e){if(e.type==='车载终端异常预警')return [{label:'数据最后上报时间',value:getTriggerValue(e,'最后通信时间')}];var speed=getTriggerValue(e,'当前车速');if(speed==='—')speed=getTriggerValue(e,'碰撞前车速');var snapshot=[];if(e.category==='告警')snapshot.push({label:'数据采集时间',value:getTriggerValue(e,'数据生成时间')==='—'?e.occurredAt:getTriggerValue(e,'数据生成时间')});snapshot.push({label:'车辆速度',value:speed},{label:'车辆驾驶模式',value:getTriggerValue(e,'驾驶模式')},{label:'车辆纵向加速度',value:e.type==='车辆碰撞事件预警'?'8.5 m/s²':'0.6 m/s²'},{label:'车辆横向加速度',value:e.type==='车辆碰撞事件预警'?'1.2 m/s²':'0.3 m/s²'},{label:'档位',value:getTriggerValue(e,'档位')==='—'?'D档':getTriggerValue(e,'档位')});return snapshot;}
function getEnterpriseHandlingRows(e){var handling=e.enterpriseHandling||{};var attachments=Array.isArray(handling.attachments)?handling.attachments.join('、'):handling.attachments;return toDetailRows([{label:'处置结论',value:handling.conclusion||'-'},{label:'处置说明',value:handling.description||'-'},{label:'附件',value:attachments||'-'},{label:'提交人',value:handling.submitter||'-'},{label:'提交时间',value:handling.submittedAt||'-'}]);}
function getTimelineHtml(e){var logs=e.approvalLogs||[];if(!logs.length)return '<div style="padding:4px 0;font-size:14px;color:#00000073">暂无审批流程记录</div>';return '<div class="space-y-3">'+logs.map(function(log,index){var result=log.result||'待处理';var state=result==='已完成'?{color:'#52c41a',dot:'✓',tag:'ant-tag-success'}:result==='已退回'?{color:'#ff4d4f',dot:'✗',tag:'ant-tag-error'}:result==='待审核'?{color:'#1677ff',dot:'●',tag:'ant-tag-processing'}:{color:'#faad14',dot:'●',tag:'ant-tag-warning'};var connector=index<logs.length-1?'border-left:2px solid '+state.color+';margin-left:5px;padding-left:12px':'margin-left:17px;padding-left:0';return '<div class="relative pb-3" style="'+connector+'"><div class="absolute w-3 h-3 rounded-full flex items-center justify-center text-[8px] text-white font-bold mt-1" style="left:-7px;top:0;background:'+state.color+'">'+state.dot+'</div><div class="min-w-0"><div class="flex items-center justify-between mb-2"><span class="text-sm font-medium text-[#000000d9]">'+escapeHtml(log.node)+'</span><span class="ant-tag '+state.tag+' text-[10px]">'+escapeHtml(result)+'</span></div><div class="text-xs text-[#00000073] space-y-1"><div><span class="text-[#00000040]">处理人：</span>'+escapeHtml(log.handler)+'</div><div><span class="text-[#00000040]">处理时间：</span>'+escapeHtml(log.time)+'</div>'+(log.opinion?'<div class="whitespace-pre-line mt-1.5 p-2 bg-[#fafafa] rounded"><span class="text-[#00000040]">处理意见：</span>'+escapeHtml(log.opinion)+'</div>':'')+'</div></div></div>';}).join('')+'</div>';}
function renderEventInfo(e){var triggerItems=[{label:'命中规则',value:EVENT_RULES[e.type]||'—'}].concat(e.trigger||[]);return '<div class="desc-section"><div class="desc-section-title">基础信息</div><div class="desc-grid"><div class="desc-item"><div class="desc-label">事件编号</div><div class="desc-value">'+escapeHtml(e.id)+'</div></div><div class="desc-item"><div class="desc-label">事件分类</div><div class="desc-value">'+categoryTag(e.category)+'</div></div><div class="desc-item"><div class="desc-label">事件类型</div><div class="desc-value">'+escapeHtml(e.type)+'</div></div><div class="desc-item"><div class="desc-label">临牌号</div><div class="desc-value">'+escapeHtml(e.plate)+'</div></div><div class="desc-item"><div class="desc-label">VIN码</div><div class="desc-value" style="font-size:12px">'+escapeHtml(e.vin)+'</div></div><div class="desc-item"><div class="desc-label">所属企业</div><div class="desc-value">'+escapeHtml(e.enterprise)+'</div></div><div class="desc-item"><div class="desc-label">发生时间</div><div class="desc-value">'+escapeHtml(e.occurredAt)+'</div></div><div class="desc-item"><div class="desc-label">处理状态</div><div class="desc-value">'+statusTag(e.status)+'</div></div><div class="desc-item full"><div class="desc-label">事件描述</div><div class="desc-value">'+escapeHtml(e.content)+'</div></div></div></div><div class="desc-section"><div class="desc-section-title">触发条件</div><div class="desc-grid">'+toDetailRows(triggerItems)+'</div></div><div class="desc-section"><div class="desc-section-title">实时快照</div><div class="desc-grid">'+toDetailRows(getRealtimeSnapshot(e))+'</div></div>';}
function renderEventDescriptions(e){return renderEventInfo(e)+'<div class="desc-section"><div class="desc-section-title">企业处置信息</div><div class="desc-grid"><div class="desc-item"><div class="desc-label">当前处理状态</div><div class="desc-value">'+statusTag(e.status)+'</div></div>'+getEnterpriseHandlingRows(e)+'</div></div><div class="desc-section"><div class="desc-section-title">审批流程日志</div>'+getTimelineHtml(e)+'</div>';}
function renderHandleEventSummary(e){return '<div class="ant-descriptions"><div class="ant-descriptions-row"><div class="ant-descriptions-label">事件编号</div><div class="ant-descriptions-value">'+escapeHtml(e.id)+'</div><div class="ant-descriptions-label">当前状态</div><div class="ant-descriptions-value">'+statusTag(e.status)+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">事件类型</div><div class="ant-descriptions-value">'+escapeHtml(e.type)+'</div><div class="ant-descriptions-label">事件分类</div><div class="ant-descriptions-value">'+categoryTag(e.category)+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">临牌号</div><div class="ant-descriptions-value">'+escapeHtml(e.plate)+'</div><div class="ant-descriptions-label">VIN码</div><div class="ant-descriptions-value">'+escapeHtml(e.vin)+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">发生时间</div><div class="ant-descriptions-value">'+escapeHtml(e.occurredAt)+'</div><div class="ant-descriptions-label">所属企业</div><div class="ant-descriptions-value">'+escapeHtml(e.enterprise)+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">事件描述</div><div class="ant-descriptions-value">'+escapeHtml(e.content)+'</div></div></div>';}
function renderResponse(e){var r=e.enterpriseHandling;if(!r)return '<div class="detail-note">企业暂未提交处理说明。</div>';var files=(r.attachments||[]).length?(r.attachments||[]).map(function(f){return '<a href="javascript:void(0)" class="text-[#1677ff] mr-3">'+escapeHtml(f)+'</a>';}).join(''):'<span class="text-[#00000040]">未上传附件</span>';return '<div class="ant-descriptions"><div class="ant-descriptions-row"><div class="ant-descriptions-label">处理结论</div><div class="ant-descriptions-value">'+escapeHtml(conclusionText(r.conclusion))+'</div><div class="ant-descriptions-label">责任人</div><div class="ant-descriptions-value">'+escapeHtml(r.handler||'—')+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">联系方式</div><div class="ant-descriptions-value">'+escapeHtml(r.contact||'—')+'</div><div class="ant-descriptions-label">提交时间</div><div class="ant-descriptions-value">'+escapeHtml(r.submittedAt||'—')+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">处置附件</div><div class="ant-descriptions-value">'+files+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">原因分析</div><div class="ant-descriptions-value">'+escapeHtml(r.reason||'—')+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">即时措施</div><div class="ant-descriptions-value">'+escapeHtml(r.measures||'—')+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">整改措施</div><div class="ant-descriptions-value">'+escapeHtml(r.rectification||'—')+'</div></div></div>';}
function returnOpinion(e){var logs=e.approvalLogs||[];for(var i=logs.length-1;i>=0;i--){if(logs[i].result==='已退回')return logs[i].opinion;}return e.returnReason||'请补充处理材料。';}
function openDetail(id){var e=findEvent(id);if(!e)return;openModal('事件详情 - '+id,renderEventDescriptions(e),{width:'800px',fullscreen:true,footer:'<button class="ant-btn" onclick="closeModal()">关闭</button>',onOpen:function(){addEventModalHeaderActions(id);}});}
function getEventWindow(e){var occurredAt=new Date(e.occurredAt.replace(' ','T'));var startAt=new Date(occurredAt.getTime()-20000);var endAt=new Date(occurredAt.getTime()+10000);var pad=function(value){return String(value).padStart(2,'0');};var format=function(value){return value.getFullYear()+'-'+pad(value.getMonth()+1)+'-'+pad(value.getDate())+' '+pad(value.getHours())+':'+pad(value.getMinutes())+':'+pad(value.getSeconds());};return {start:format(startAt),end:format(endAt)};}
function openEventData(id){var e=findEvent(id);if(!e)return;var range=getEventWindow(e);var params=new URLSearchParams({tab:'realtime',plate:e.plate,vin:e.vin,start:range.start,end:range.end});window.location.href='../../data-analysis/query/vehicle-query.html?'+params.toString();}
function openEventReplay(id){var e=findEvent(id);if(!e)return;var range=getEventWindow(e);var params=new URLSearchParams({eventId:id,plate:e.plate,vin:e.vin,category:e.category,type:e.type,time:e.occurredAt,start:range.start,end:range.end});window.location.href='monitor-map.html?'+params.toString();}
 function addEventModalHeaderActions(id){var headerActions=document.querySelector('#modal-mask .ant-modal-header-right');if(!headerActions||headerActions.querySelector('[data-event-header-actions]'))return;var actions=document.createElement('span');actions.setAttribute('data-event-header-actions','true');actions.className='event-header-actions';actions.innerHTML='<button type="button" class="event-header-action" onclick="openEventData(\''+id+'\')">更多数据</button><button type="button" class="event-header-action" onclick="openEventReplay(\''+id+'\')">回放</button>';headerActions.insertBefore(actions,headerActions.firstChild);}
function formValue(r,key){return escapeHtml((r&&r[key])||'');}
 function openHandleForm(id){var e=findEvent(id);if(!e||!(e.status==='待处理'||e.status==='已退回'))return;var r=e.enterpriseHandling||{};attachedFiles=Array.isArray(r.attachments)?r.attachments.slice():(r.attachments?[r.attachments]:[]);var returned=e.status==='已退回';var returnHtml=returned?'<div class="return-notice"><strong>第三方退回意见：</strong>'+escapeHtml(returnOpinion(e))+'</div>':'';var footer='<div class="event-action-footer-content"><div class="event-action-fields"><div class="event-action-field"><label for="handleConclusion">处置结论 <span class="required">*</span></label><div class="event-action-control"><select class="ant-input" id="handleConclusion"><option value="">请选择</option><option '+(r.conclusion==='已确认'?'selected':'')+'>已确认</option><option '+(r.conclusion==='误报'?'selected':'')+'>误报</option><option '+(r.conclusion==='无需处置'?'selected':'')+'>无需处置</option><option '+(r.conclusion==='其他'?'selected':'')+'>其他</option></select><div class="form-error" id="errConclusion">请选择处置结论</div></div></div><div class="event-action-field"><label for="handleDescription">处置说明 <span class="required">*</span></label><div class="event-action-control"><textarea class="ant-input" id="handleDescription" placeholder="请填写事件核查结果和已采取的处置措施">'+formValue(r,'description')+'</textarea><div class="form-error" id="errDescription">请填写处置说明</div></div></div><div class="event-action-field"><label>附件</label><div class="event-action-control"><button type="button" class="ant-btn" onclick="addMockFile()">选择附件上传</button><div id="attachmentList" class="event-attachment-list"></div></div></div></div><div class="event-action-buttons"><button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="submitHandle(\''+e.id+'\')">提交审核</button></div></div>';openModal(returned?'补充异常事件处置':'事件处置',returnHtml+renderEventInfo(e),{wide:true,fullscreen:true,maxHeight:'85vh',footer:footer,footerClass:'event-action-footer',onOpen:function(){renderAttachments();addEventModalHeaderActions(id);}});}
function renderAttachments(){var list=document.getElementById('attachmentList');if(!list)return;list.innerHTML=attachedFiles.length?attachedFiles.map(function(file,index){return '<span class="attachment-chip">'+escapeHtml(file)+'<button type="button" aria-label="移除附件" onclick="removeAttachment('+index+')">×</button></span>';}).join(''):'<span class="text-xs text-[#00000040]">-</span>';}
function addMockFile(){var sequence=attachedFiles.length+1;attachedFiles.push(sequence===1?'现场处置说明.pdf':'处置佐证材料'+sequence+'.jpg');renderAttachments();}
function removeAttachment(index){attachedFiles.splice(index,1);renderAttachments();}
function getResponseFromForm(){return {conclusion:document.getElementById('handleConclusion').value,description:document.getElementById('handleDescription').value.trim(),attachments:attachedFiles.slice(),submitter:'',submittedAt:''};}
function clearFormErrors(){document.querySelectorAll('.form-error').forEach(function(el){el.style.display='none';});}
function validateForm(response){clearFormErrors();var invalid=[];var checks=[['conclusion','errConclusion'],['description','errDescription']];checks.forEach(function(item){if(!response[item[0]]){invalid.push(item[0]);var el=document.getElementById(item[1]);if(el)el.style.display='block';}});return invalid.length===0;}
function appendLog(e,node,handler,time,opinion,result){e.approvalLogs=e.approvalLogs||[];e.approvalLogs.push({node:node,handler:handler,time:time,opinion:opinion,result:result});}
 function submitHandle(id){var e=findEvent(id);if(!e)return;var r=getResponseFromForm();if(!validateForm(r))return;r.submittedAt=now();r.submitter='王工（'+e.enterprise+'）';e.enterpriseHandling=r;e.status='待审核';e.updatedAt=r.submittedAt;e.returnReason='';var wasReturned=(e.approvalLogs||[]).some(function(l){return l.result==='已退回';});appendLog(e,wasReturned?'企业补充后重新提交':'企业提交处置','王工（'+e.enterprise+'）',e.updatedAt,'已提交事件处置'+(r.attachments.length?'及'+r.attachments.length+'份附件':'')+'，等待第三方机构审核。','待审核');saveRecords();renderSummary();renderTable();closeModal();showWorkflowToast('处置已提交，等待第三方机构审核');}
document.addEventListener('DOMContentLoaded',function(){allEvents=getRecords();eventTypeOptions();pager=new Pagination({container:'eventPagination',pageSize:10,pageSizeOptions:[10,20,50,100],onPageChange:function(){renderTable();},onPageSizeChange:function(){renderTable();}});renderSummary();renderTable();});
</script>
