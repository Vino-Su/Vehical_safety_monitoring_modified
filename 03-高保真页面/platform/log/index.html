var logPager;
var selectedLogIds = {};

function renderLogTable() {
  var cp = logPager ? logPager.getCurrentPage() : 1;
  var ps = logPager ? logPager.getPageSize() : 10;
  var start = (cp - 1) * ps;
  var end = start + ps;
  var pageData = logData.slice(start, end);
  var tbody = document.getElementById('logTableBody');
  tbody.innerHTML = pageData.map(function(item) {
    var statusClass = item.status === '成功' ? 'ant-tag-success' : 'ant-tag-error';
    return '<tr>' +
      '<td style="text-align:center"><input type="checkbox" class="ant-checkbox log-row-cb" data-log-id="' + item.id + '" ' + (selectedLogIds[item.id] ? 'checked' : '') + ' onchange="updateLogSelection(this)"></td>' +
      '<td style="text-align:center">' + item.id + '</td>' +
      '<td>' + item.module + '</td>' +
      '<td style="text-align:center">' + item.operationType + '</td>' +
      '<td style="text-align:center"><span class="ant-tag ant-tag-processing">' + item.method + '</span></td>' +
      '<td style="text-align:center">' + item.operator + '</td>' +
      '<td>' + item.ip + '</td>' +
      '<td style="text-align:center"><span class="ant-tag ' + statusClass + '">' + item.status + '</span></td>' +
      '<td style="text-align:center">' + item.duration + '</td>' +
      '<td>' + item.time + '</td>' +
      '<td style="text-align:center"><button class="ant-btn-link" onclick="openDetailModal()">查看</button><button class="ant-btn-link danger" onclick="openDeleteModal()">删除</button></td>' +
    '</tr>';
  }).join('');
  if (logPager) logPager.setTotal(logData.length);
  syncLogSelectAllState();
}

function toggleLogSelectAll(el) {
  document.querySelectorAll('#logTableBody .log-row-cb').forEach(function(cb) {
    cb.checked = el.checked;
    selectedLogIds[cb.dataset.logId] = el.checked;
  });
}

function updateLogSelection(el) {
  selectedLogIds[el.dataset.logId] = el.checked;
  syncLogSelectAllState();
}

function syncLogSelectAllState() {
  var rowCbs = document.querySelectorAll('#logTableBody .log-row-cb');
  var checkedCount = document.querySelectorAll('#logTableBody .log-row-cb:checked').length;
  var selectAll = document.getElementById('logSelectAll');
  if (!selectAll) return;
  selectAll.checked = rowCbs.length > 0 && checkedCount === rowCbs.length;
  selectAll.indeterminate = checkedCount > 0 && checkedCount < rowCbs.length;
}

logPager = new Pagination({
  container: 'paginationBar',
  pageSize: 10,
  pageSizeOptions: [10, 20, 50, 100],
  onPageChange: function(page, size) { renderLogTable(); },
  onPageSizeChange: function(size) { renderLogTable(); }
});
renderLogTable();
function openDetailModal(){
  openModal('操作日志详情',
    '<div class="ant-descriptions">' +
      '<div class="ant-descriptions-row"><div class="ant-descriptions-label">模块名称</div><div class="ant-descriptions-value">车辆数据查询</div><div class="ant-descriptions-label">操作类型</div><div class="ant-descriptions-value">导出</div></div>' +
      '<div class="ant-descriptions-row"><div class="ant-descriptions-label">请求方法</div><div class="ant-descriptions-value">GET</div><div class="ant-descriptions-label">操作人员</div><div class="ant-descriptions-value">admin</div></div>' +
      '<div class="ant-descriptions-row"><div class="ant-descriptions-label">IP地址</div><div class="ant-descriptions-value">192.168.1.36</div><div class="ant-descriptions-label">请求路径</div><div class="ant-descriptions-value">/api/data-query/vehicle/export</div></div>' +
      '<div class="ant-descriptions-row"><div class="ant-descriptions-label">方法名称</div><div class="ant-descriptions-value">com.mars.analysis.query.VehicleQueryController.export()</div></div>' +
      '<div class="ant-descriptions-row"><div class="ant-descriptions-label">耗时</div><div class="ant-descriptions-value">139ms</div><div class="ant-descriptions-label">操作状态</div><div class="ant-descriptions-value"><span class="ant-tag ant-tag-success">成功</span></div></div>' +
      '<div class="ant-descriptions-row"><div class="ant-descriptions-label">操作时间</div><div class="ant-descriptions-value">2026-04-30 14:32:18</div></div>' +
    '</div>' +
    '<h4 class="text-sm font-semibold text-[#000000d9] mb-3 mt-4 pb-2 border-b border-[#f0f0f0]">请求参数</h4>' +
    '<div class="p-3 bg-[#fafafa] rounded text-xs text-[#00000073] break-all">{"pageNum":1,"pageSize":100,"sortField":"createTime","sortOrder":"DESC"}</div>' +
    '<h4 class="text-sm font-semibold text-[#000000d9] mb-3 mt-4 pb-2 border-b border-[#f0f0f0]">返回结果</h4>' +
    '<div class="p-3 bg-[#fafafa] rounded text-xs text-[#00000073] break-all">{"code":200,"message":"操作成功","data":{"total":100,"list":[...],"filename":"用户数据导出_20260430.xlsx"}}</div>',
    {wide:true,footer:'<button class="ant-btn" onclick="closeModal()">关闭</button>'});
}
function openDeleteModal(){
  openModal('确认删除日志记录',
    '<div class="text-sm text-[#000000d9]">确认删除该条日志记录吗？删除后将无法恢复，如需保留日志记录请选择导出后再删除。</div>',
    {footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-danger" onclick="closeModal()">确认删除</button>'});
}
function openClearModal(){
  openModal('清空日志',
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>清空日期范围</div><div class="ant-form-control"><label class="inline-flex items-center gap-2"><input type="radio" name="clearRange" checked> 全部日志</label><label class="inline-flex items-center gap-2 ml-4"><input type="radio" name="clearRange"> 指定日期之前的日志</label></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>输入管理员密码确认</div><div class="ant-form-control"><input class="ant-input" type="password" placeholder="请输入当前登录管理员密码以确认清空操作"></div></div>' +
    '<div class="p-3 bg-[#fff2f0] border border-[#ffccc7] rounded text-sm text-[#ff4d4f]"><strong>警告提示</strong>清空日志为不可逆操作，所有操作记录将被物理删除，且在系统审计中将无法追溯。请务必确认数据已导出备份。</div>',
    {width:600,footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-danger" onclick="closeModal()">确认清空</button>'});
}
function openExportModal(){
  var selectedCount = Object.keys(selectedLogIds).filter(function(id) { return selectedLogIds[id]; }).length;
  var selectedOption = '<label class="inline-flex items-center gap-2"><input type="radio" name="logExportRange" value="selected" ' + (selectedCount ? 'checked' : 'disabled') + '> 已选数据' + (selectedCount ? '（' + selectedCount + '条）' : '（未选择）') + '</label>';
  openModal('导出操作日志',
    '<div class="ant-form-item"><div class="ant-form-label">导出格式</div><div class="ant-form-control"><label class="inline-flex items-center gap-2"><input type="radio" name="logExportFormat" value="excel" checked> Excel</label><label class="inline-flex items-center gap-2 ml-4"><input type="radio" name="logExportFormat" value="csv"> CSV</label></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label">导出范围</div><div class="ant-form-control flex flex-wrap gap-x-4 gap-y-2">' + selectedOption + '<label class="inline-flex items-center gap-2"><input type="radio" name="logExportRange" value="page" ' + (selectedCount ? '' : 'checked') + '> 当前页数据</label><label class="inline-flex items-center gap-2"><input type="radio" name="logExportRange" value="all"> 全部数据</label></div></div>',
    {footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="startLogExport()">开始导出</button>'});
}
function startLogExport(){
  var format = document.querySelector('input[name="logExportFormat"]:checked');
  var range = document.querySelector('input[name="logExportRange"]:checked');
  var selectedCount = Object.keys(selectedLogIds).filter(function(id) { return selectedLogIds[id]; }).length;
  var cp = logPager ? logPager.getCurrentPage() : 1;
  var ps = logPager ? logPager.getPageSize() : 10;
  var count = range && range.value === 'selected' ? selectedCount : (range && range.value === 'all' ? logData.length : Math.min(ps, logData.length - (cp - 1) * ps));
  var formatLabel = format && format.value === 'csv' ? 'CSV' : 'Excel';
  closeModal();
  alert(formatLabel + ' 数据导出成功，共导出 ' + count + ' 条操作日志');
}
</script>
