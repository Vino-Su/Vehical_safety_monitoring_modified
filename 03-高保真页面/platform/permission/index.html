<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>权限资源管理 - 智能网联汽车安全监测平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#1677ff',hover:'#4096ff',disabled:'#85a5cc'}}}}}</script>
  <style>
    .res-card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
    .res-app{border:1px solid #f0f0f0;border-radius:6px;margin-bottom:12px}
    .res-app-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fafafa;border-radius:6px 6px 0 0;flex-wrap:wrap}
    .res-menus{padding:4px 12px 8px}
    .res-menu-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;flex-wrap:wrap}
    .res-menu-row:hover{background:#f5f5f5}
    .res-children{margin-left:26px;border-left:1px dashed #e5e5e5;padding-left:12px;display:flex;flex-direction:column;gap:2px}
    .res-child{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;flex-wrap:wrap}
    .res-child:hover{background:#f5f5f5}
    .res-type{font-size:12px;color:#00000073;border:1px solid #f0f0f0;border-radius:4px;padding:0 4px;line-height:18px;white-space:nowrap}
    .res-api{font-family:Consolas,Menlo,monospace;font-size:12px;color:#00000073}
    .res-name{color:#000000d9}
    .res-toggle{font-size:12px;color:#1677ff;cursor:pointer;background:none;border:none;padding:2px 4px;white-space:nowrap}
    .res-op{font-size:12px;padding:2px 4px}
    .res-disabled .res-name, .res-disabled .res-api{color:#00000040}
    .res-count{font-size:12px;color:#00000073}
  </style>
</head>
<body>
<div id="app" class="flex h-screen overflow-hidden">
  <aside id="sidebar"></aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header id="topnav"></header>
    <main class="flex-1 overflow-auto bg-[#f0f2f5] p-6">
      <div class="page-header">
        <h2>权限资源管理</h2>
        <div class="flex gap-2">
          <button class="ant-btn" onclick="openAppModal()">应用管理</button>
          <button class="ant-btn" onclick="openImportModal()">批量导入</button>
        </div>
      </div>
      <div class="filter-bar">
        <div class="filter-row">
          <div class="filter-item"><label>所属应用</label><select class="ant-input" id="fApp" style="width:170px" onchange="renderTree()"><option value="all">全部应用</option><option value="road">开放道路资源管理</option><option value="monitor">测试示范监管</option><option value="analysis">监测数据分析</option><option value="platform">平台管理</option></select></div>
          <div class="filter-item"><label>关键字</label><input class="ant-input" id="fName" placeholder="资源名称或标识/路径" style="width:180px"></div>
          <div class="filter-item"><label>状态</label><select class="ant-input" id="fStatus" style="width:110px" onchange="renderTree()"><option value="all">全部</option><option>已启用</option><option>已停用</option></select></div>
          <div class="flex gap-2 items-end"><button class="ant-btn ant-btn-primary" onclick="renderTree()">查询</button><button class="ant-btn" onclick="doReset()">重置</button></div>
          <div class="filter-item" style="margin-left:auto"><span class="res-count" id="resSummary"></span></div>
        </div>
      </div>
      <div class="res-card" id="permTree"></div>
    </main>
  </div>
</div>
<script>
const PAGE_ID='permission-manage';

// ========== 权限树数据（应用 → 菜单 → 按钮/接口） ==========
var permTree = [
  {appId:'road', app:'开放道路资源管理', status:'已启用', time:'2026-04-01 09:00', menus:[
    {id:1, name:'道路信息建档', type:'菜单', key:'road/catalog/filing.html', sort:1, status:'已启用', updateTime:'2026-04-12 09:30', children:[
      {id:2, name:'新增道路', type:'按钮', key:'road-filing-add', sort:1, status:'已启用', updateTime:'2026-04-12 09:35'},
      {id:3, name:'创建道路建档', type:'接口', key:'POST /api/road/filing/create', sort:2, status:'已启用', updateTime:'2026-04-12 09:36'}
    ]},
    {id:4, name:'道路资源动态管控', type:'菜单', key:'road/catalog/control.html', sort:2, status:'已启用', updateTime:'2026-04-20 14:15', children:[
      {id:5, name:'修改适用应用场景', type:'按钮', key:'road-control-scene-edit', sort:1, status:'已启用', updateTime:'2026-08-24 10:20'}
    ]},
    {id:6, name:'地图可视化展示', type:'菜单', key:'road/visualization/map.html', sort:3, status:'已启用', updateTime:'2026-08-25 09:10', children:[
      {id:7, name:'电子围栏筛选', type:'按钮', key:'road-map-fence-filter', sort:1, status:'已启用', updateTime:'2026-08-25 09:15'},
      {id:8, name:'获取地图图层', type:'接口', key:'GET /api/road/map/layers', sort:2, status:'已启用', updateTime:'2026-05-06 11:20'}
    ]},
    {id:9, name:'区域统计查询', type:'菜单', key:'road/statistics/index.html', sort:4, status:'已启用', updateTime:'2026-05-08 16:00', children:[
      {id:10, name:'导出统计数据', type:'按钮', key:'road-stats-export', sort:1, status:'已停用', updateTime:'2026-06-15 10:40'}
    ]}
  ]},
  {appId:'monitor', app:'测试示范监管', status:'已启用', time:'2026-04-01 09:05', menus:[
    {id:11, name:'企业信息登记', type:'菜单', key:'monitor/access-info/company.html', sort:1, status:'已启用', updateTime:'2026-04-02 10:20', children:[
      {id:12, name:'新增企业', type:'按钮', key:'company-add', sort:1, status:'已启用', updateTime:'2026-04-02 10:25'},
      {id:13, name:'保存企业信息', type:'接口', key:'POST /api/company/save', sort:2, status:'已启用', updateTime:'2026-04-02 10:26'}
    ]},
    {id:14, name:'道路测试准入申请', type:'菜单', key:'monitor/access-apply/road-test.html', sort:2, status:'已启用', updateTime:'2026-08-24 15:30', children:[
      {id:15, name:'提交申请', type:'按钮', key:'apply-road-test-submit', sort:1, status:'已启用', updateTime:'2026-04-05 09:00'}
    ]},
    {id:16, name:'审批管理', type:'菜单', key:'monitor/access-approve/approve.html', sort:3, status:'已启用', updateTime:'2026-08-24 11:45', children:[
      {id:17, name:'审批通过', type:'按钮', key:'approve-pass', sort:1, status:'已启用', updateTime:'2026-04-06 14:00'},
      {id:18, name:'审批退回', type:'按钮', key:'approve-reject', sort:2, status:'已启用', updateTime:'2026-04-06 14:01'},
      {id:19, name:'提交审批结果', type:'接口', key:'POST /api/approve/audit', sort:3, status:'已启用', updateTime:'2026-04-06 14:02'}
    ]},
    {id:20, name:'监控一张图', type:'菜单', key:'monitor/vehicle-monitor/map.html', sort:4, status:'已启用', updateTime:'2026-05-10 10:00', children:[
      {id:21, name:'轨迹回放', type:'按钮', key:'monitor-track-replay', sort:1, status:'已启用', updateTime:'2026-05-10 10:05'},
      {id:22, name:'获取实时监控数据', type:'接口', key:'GET /api/monitor/map/realtime', sort:2, status:'已启用', updateTime:'2026-05-10 10:06'}
    ]}
  ]},
  {appId:'analysis', app:'监测数据分析', status:'已启用', time:'2026-04-01 09:10', menus:[
    {id:23, name:'告警统计', type:'菜单', key:'data-analysis/analysis/alarm-stats.html', sort:1, status:'已启用', updateTime:'2026-04-18 09:00', children:[
      {id:24, name:'导出统计', type:'按钮', key:'analysis-alarm-export', sort:1, status:'已启用', updateTime:'2026-04-18 09:05'}
    ]}
  ]},
  {appId:'platform', app:'平台管理', status:'已启用', time:'2026-04-01 09:15', menus:[
    {id:25, name:'角色管理', type:'菜单', key:'platform/role/index.html', sort:3, status:'已启用', updateTime:'2026-08-25 10:00', children:[
      {id:26, name:'分配用户', type:'按钮', key:'role-assign-user', sort:1, status:'已启用', updateTime:'2026-08-25 10:01'},
      {id:27, name:'保存角色', type:'接口', key:'POST /api/role/save', sort:2, status:'已启用', updateTime:'2026-08-25 10:02'}
    ]},
    {id:28, name:'角色授权', type:'菜单', key:'platform/role/authorize.html', sort:4, status:'已启用', updateTime:'2026-08-25 10:10', children:[]}
  ]}
];

var nextId = 100;
var expandedApps = {};
var expandedMenus = {};

// ========== 查找 ==========
function findApp(appId) {
  for (var i = 0; i < permTree.length; i++) if (permTree[i].appId === appId) return permTree[i];
  return null;
}
function allNodes() {
  var list = [];
  permTree.forEach(function(a) {
    a.menus.forEach(function(m) {
      list.push(m);
      m.children.forEach(function(c) { list.push(c); });
    });
  });
  return list;
}
function findNode(id) {
  var nodes = allNodes();
  for (var i = 0; i < nodes.length; i++) if (nodes[i].id === id) return nodes[i];
  return null;
}
function findMenuOf(id) {
  for (var i = 0; i < permTree.length; i++) {
    var a = permTree[i];
    for (var j = 0; j < a.menus.length; j++) {
      if (a.menus[j].id === id) return {app:a, menu:a.menus[j], parent:null};
      for (var k = 0; k < a.menus[j].children.length; k++) {
        if (a.menus[j].children[k].id === id) return {app:a, menu:a.menus[j], parent:a.menus[j]};
      }
    }
  }
  return null;
}

// ========== 筛选与渲染 ==========
function nodeHit(n) {
  var kw = (document.getElementById('fName').value || '').trim();
  var st = document.getElementById('fStatus').value;
  var kwHit = !kw || n.name.indexOf(kw) !== -1 || n.key.indexOf(kw) !== -1;
  var stHit = st === 'all' || n.status === st;
  return kwHit && stHit;
}

function renderTree() {
  var fApp = document.getElementById('fApp').value;
  var box = document.getElementById('permTree');
  var totalMenus = 0, totalChildren = 0;
  var html = permTree.filter(function(a) { return fApp === 'all' || a.appId === fApp; }).map(function(a) {
    // 过滤菜单：自身命中（整菜单含全部子显示）或有子命中（显示命中子）
    var visibleMenus = a.menus.filter(function(m) {
      if (nodeHit(m)) return true;
      return m.children.some(function(c) { return nodeHit(c); });
    });
    totalMenus += visibleMenus.length;
    var appDisabled = a.status === '已停用';
    var appOpen = expandedApps[a.appId] !== false;
    var appStatusTag = '<span class="ant-tag ' + (appDisabled ? 'ant-tag-default' : 'ant-tag-success') + '">' + a.status + '</span>';
    var head = '<div class="res-app-head' + (appDisabled ? ' res-disabled' : '') + '">' +
      '<span style="font-weight:600" class="res-name">' + a.app + '</span>' +
      '<button class="res-toggle" onclick="toggleAppExpand(\'' + a.appId + '\')">' + (appOpen ? '收起 ▲' : '展开 ▼') + '</button>' +
      '<span class="res-type">appId: ' + a.appId + '</span>' + appStatusTag +
      '<span class="res-count">' + a.menus.length + ' 个菜单</span>' +
      '<span style="display:inline-flex;gap:4px;margin-left:4px">' +
        '<button class="ant-btn-link res-op" onclick="openAddMenuModal(\'' + a.appId + '\')">+ 新增菜单</button>' +
        '<button class="ant-btn-link res-op ' + (appDisabled ? '' : 'danger') + '" style="' + (appDisabled ? 'color:#52c41a' : '') + '" onclick="openAppToggleModal(\'' + a.appId + '\')">' + (appDisabled ? '启用' : '停用') + '</button>' +
      '</span>' +
      '</div>';
    if (!appOpen) return '<div class="res-app">' + head + '</div>';
    var menusHtml = visibleMenus.map(function(m) {
      totalChildren += m.children.length;
      var mDisabled = m.status === '已停用';
      var mOpen = expandedMenus[m.id] !== false;
      var row = '<div class="res-menu-row' + (mDisabled ? ' res-disabled' : '') + '">' +
        '<span class="res-name">' + m.name + '</span>' +
        '<button class="res-toggle" onclick="toggleMenuExpand(' + m.id + ')">' + (mOpen ? '收起 ▲' : '展开 ▼') + '</button>' +
        '<span class="res-type">菜单</span>' +
        '<span class="res-type" style="font-family:Consolas,Menlo,monospace">' + m.key + '</span>' +
        '<span class="ant-tag ' + (mDisabled ? 'ant-tag-default' : 'ant-tag-success') + '">' + m.status + '</span>' +
        '<span style="display:inline-flex;gap:4px;margin-left:4px">' +
          '<button class="ant-btn-link res-op" onclick="openAddChildModal(' + m.id + ')">+ 子资源</button>' +
          '<button class="ant-btn-link res-op" onclick="openEditModal(' + m.id + ')">编辑</button>' +
          '<button class="ant-btn-link res-op ' + (mDisabled ? '' : 'danger') + '" style="' + (mDisabled ? 'color:#52c41a' : '') + '" onclick="openToggleModal(' + m.id + ')">' + (mDisabled ? '启用' : '停用') + '</button>' +
        '</span>' +
        '</div>';
      if (!mOpen) return row;
      var childrenHtml = m.children.map(function(c) {
        var cDisabled = c.status === '已停用';
        var tag = c.type === '按钮'
          ? '<span class="res-type">按钮</span><span class="res-name">' + c.name + '</span>'
          : '<span class="res-type" style="color:#d46b08;border-color:#ffd591">接口</span><span class="res-api">' + c.key + '</span>';
        return '<div class="res-child' + (cDisabled ? ' res-disabled' : '') + '">' + tag +
          '<span class="res-type">' + (c.type === '按钮' ? c.key : c.name) + '</span>' +
          '<span class="ant-tag ' + (cDisabled ? 'ant-tag-default' : 'ant-tag-success') + '">' + c.status + '</span>' +
          '<span style="display:inline-flex;gap:4px;margin-left:4px">' +
            '<button class="ant-btn-link res-op" onclick="openEditModal(' + c.id + ')">编辑</button>' +
            '<button class="ant-btn-link res-op ' + (cDisabled ? '' : 'danger') + '" style="' + (cDisabled ? 'color:#52c41a' : '') + '" onclick="openToggleModal(' + c.id + ')">' + (cDisabled ? '启用' : '停用') + '</button>' +
          '</span></div>';
      }).join('') || '<div class="res-child" style="color:#00000040;font-size:12px">暂无按钮 / 接口，可点击「+ 子资源」新增</div>';
      return row + '<div class="res-children">' + childrenHtml + '</div>';
    }).join('');
    return '<div class="res-app">' + head + '<div class="res-menus">' + (menusHtml || '<div style="color:#00000040;font-size:12px;padding:8px">无匹配菜单</div>') + '</div></div>';
  }).join('');
  box.innerHTML = html || '<div style="text-align:center;color:#00000040;padding:32px 0">暂无数据</div>';
  var st = document.getElementById('fStatus').value;
  document.getElementById('resSummary').textContent = '当前展示：' + totalMenus + ' 个菜单 · ' + totalChildren + ' 个按钮/接口' + (st !== 'all' ? '（按状态筛选）' : '');
}

function toggleAppExpand(appId) { expandedApps[appId] = expandedApps[appId] === false ? true : false; renderTree(); }
function toggleMenuExpand(id) { expandedMenus[id] = expandedMenus[id] === false ? true : false; renderTree(); }

function doReset() {
  document.getElementById('fApp').value = 'all';
  document.getElementById('fName').value = '';
  document.getElementById('fStatus').value = 'all';
  renderTree();
}

// ========== 新增 / 编辑弹窗（层级由树上节点位置确定） ==========
function openAddMenuModal(appId) {
  var a = findApp(appId);
  openModal('新增菜单资源 - ' + a.app,
    '<div class="ant-form-item"><div class="ant-form-label">所属应用</div><div class="ant-form-control"><input class="ant-input" value="' + a.app + '（' + a.appId + '）" disabled style="background:#f5f5f5"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label">资源类型</div><div class="ant-form-control"><input class="ant-input" value="菜单" disabled style="background:#f5f5f5"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>资源名称</div><div class="ant-form-control"><input class="ant-input" id="mName" placeholder="请输入菜单名称"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>页面路由</div><div class="ant-form-control"><input class="ant-input" id="mKey" placeholder="如 road/catalog/filing.html"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label">排序号</div><div class="ant-form-control"><input class="ant-input" id="mSort" type="number" value="1" style="width:120px"></div></div>',
    {width:600,footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="submitAddMenu(\'' + appId + '\')">确定</button>'});
}

function submitAddMenu(appId) {
  var a = findApp(appId);
  var name = document.getElementById('mName').value.trim();
  var key = document.getElementById('mKey').value.trim();
  if (!name) { alert('请输入资源名称'); return; }
  if (!key) { alert('请输入页面路由'); return; }
  if (keyExists(key)) { alert('资源标识/路径已存在：' + key); return; }
  a.menus.push({id:nextId++, name:name, type:'菜单', key:key, sort:Number(document.getElementById('mSort').value) || 1, status:'已启用', updateTime:'2026-08-25 10:00', children:[]});
  closeModal();
  expandedApps[appId] = true;
  expandedMenus[nextId - 1] = true;
  renderTree();
}

function openAddChildModal(menuId) {
  var loc = findMenuOf(menuId);
  var m = loc.menu;
  openModal('新增子资源 - ' + m.name,
    '<div class="ant-form-item"><div class="ant-form-label">所属菜单</div><div class="ant-form-control"><input class="ant-input" value="' + m.name + '" disabled style="background:#f5f5f5"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>资源类型</div><div class="ant-form-control"><select class="ant-input" id="mType"><option>按钮</option><option>接口</option></select></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>资源名称</div><div class="ant-form-control"><input class="ant-input" id="mName" placeholder="按钮填操作名称，接口填功能名称"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>资源标识 / 路径</div><div class="ant-form-control"><input class="ant-input" id="mKey" placeholder="按钮填按钮标识，接口填 API 路径"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label">排序号</div><div class="ant-form-control"><input class="ant-input" id="mSort" type="number" value="1" style="width:120px"></div></div>',
    {width:600,footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="submitAddChild(' + menuId + ')">确定</button>'});
}

function submitAddChild(menuId) {
  var loc = findMenuOf(menuId);
  var type = document.getElementById('mType').value;
  var name = document.getElementById('mName').value.trim();
  var key = document.getElementById('mKey').value.trim();
  if (!name) { alert('请输入资源名称'); return; }
  if (!key) { alert('请输入资源标识/路径'); return; }
  if (keyExists(key)) { alert('资源标识/路径已存在：' + key); return; }
  loc.menu.children.push({id:nextId++, name:name, type:type, key:key, sort:Number(document.getElementById('mSort').value) || 1, status:'已启用', updateTime:'2026-08-25 10:00'});
  closeModal();
  expandedMenus[menuId] = true;
  renderTree();
}

function openEditModal(id) {
  var n = findNode(id);
  var isMenu = n.type === '菜单';
  openModal('编辑权限资源',
    '<div class="ant-form-item"><div class="ant-form-label">资源类型</div><div class="ant-form-control"><input class="ant-input" value="' + n.type + '" disabled style="background:#f5f5f5"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>资源名称</div><div class="ant-form-control"><input class="ant-input" id="mName" value="' + n.name + '"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>资源标识 / 路径</div><div class="ant-form-control"><input class="ant-input" id="mKey" value="' + n.key + '"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label">排序号</div><div class="ant-form-control"><input class="ant-input" id="mSort" type="number" value="' + n.sort + '" style="width:120px"></div></div>',
    {width:600,footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="submitEdit(' + id + ')">确定</button>'});
}

function submitEdit(id) {
  var n = findNode(id);
  var name = document.getElementById('mName').value.trim();
  var key = document.getElementById('mKey').value.trim();
  if (!name) { alert('请输入资源名称'); return; }
  if (!key) { alert('请输入资源标识/路径'); return; }
  if (keyExists(key, id)) { alert('资源标识/路径已存在：' + key); return; }
  n.name = name; n.key = key;
  n.sort = Number(document.getElementById('mSort').value) || 1;
  n.updateTime = '2026-08-25 10:00';
  closeModal();
  renderTree();
}

function keyExists(key, excludeId) {
  return allNodes().some(function(n) { return n.key === key && n.id !== excludeId; });
}

// ========== 停用 / 启用 ==========
function openToggleModal(id) {
  var n = findNode(id);
  if (n.status === '已启用') {
    openModal('确认停用资源',
      '<div class="text-sm text-[#000000d9] mb-3">确认停用「' + n.type + ' - ' + n.name + '」吗？</div>' +
      '<div class="p-3 bg-[#fff2f0] border border-[#ffccc7] rounded text-sm text-[#ff4d4f]">停用后该资源将从授权树隐藏，<b>所有角色对该资源的授权即时失效</b>；重新启用后不会自动恢复原授权，需重新配置。</div>',
      {footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-danger" onclick="toggleStatus(' + id + ')">确认停用</button>'});
  } else {
    openModal('确认启用资源',
      '<div class="text-sm text-[#000000d9]">确认启用「' + n.type + ' - ' + n.name + '」吗？启用后该资源重新出现在授权树，可供各角色勾选授权，原有授权不会自动恢复。</div>',
      {footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="toggleStatus(' + id + ')">确认启用</button>'});
  }
}

function toggleStatus(id) {
  var n = findNode(id);
  n.status = n.status === '已启用' ? '已停用' : '已启用';
  n.updateTime = '2026-08-25 10:00';
  closeModal();
  renderTree();
}

function openAppToggleModal(appId) {
  var a = findApp(appId);
  if (a.status === '已启用') {
    openModal('确认停用应用',
      '<div class="text-sm text-[#000000d9] mb-3">确认停用应用「' + a.app + '」吗？</div>' +
      '<div class="p-3 bg-[#fff2f0] border border-[#ffccc7] rounded text-sm text-[#ff4d4f]">停用后该应用下<b>全部权限资源同步失效</b>，各角色对其授权即时回收。</div>',
      {footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-danger" onclick="toggleAppStatus(\'' + appId + '\')">确认停用</button>'});
  } else {
    openModal('确认启用应用',
      '<div class="text-sm text-[#000000d9]">确认启用应用「' + a.app + '」吗？启用后其下资源恢复可授权状态，原有授权不会自动恢复。</div>',
      {footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="toggleAppStatus(\'' + appId + '\')">确认启用</button>'});
  }
}

function toggleAppStatus(appId) {
  var a = findApp(appId);
  a.status = a.status === '已启用' ? '已停用' : '已启用';
  closeModal();
  renderTree();
}

// ========== 应用管理弹窗 ==========
function openAppModal() {
  var rows = permTree.map(function(a) {
    var statusClass = a.status === '已启用' ? 'ant-tag-success' : 'ant-tag-default';
    var count = a.menus.reduce(function(sum, m) { return sum + 1 + m.children.length; }, 0);
    var toggle = a.status === '已启用'
      ? '<button class="ant-btn-link danger" onclick="toggleAppStatusFromModal(\'' + a.appId + '\')">停用</button>'
      : '<button class="ant-btn-link" style="color:#52c41a" onclick="toggleAppStatusFromModal(\'' + a.appId + '\')">启用</button>';
    return '<tr><td>' + a.app + '</td><td><span class="res-api">' + a.appId + '</span></td><td style="text-align:center"><span class="ant-tag ' + statusClass + '">' + a.status + '</span></td><td style="text-align:center">' + a.time + '</td><td style="text-align:right">' + count + '</td><td style="text-align:center">' + toggle + '</td></tr>';
  }).join('');
  openModal('应用管理',
    '<div style="text-align:right;margin-bottom:8px"><button class="ant-btn ant-btn-primary" onclick="openAppForm()">+ 新增应用</button></div>' +
    '<table class="ant-table"><thead><tr><th>应用名称</th><th>appId</th><th style="width:90px;text-align:center">状态</th><th style="width:160px;text-align:center">接入时间</th><th style="width:100px;text-align:right">资源数量</th><th style="width:80px;text-align:center">操作</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div style="color:#00000073;font-size:12px;margin-top:8px">权限资源由各业务应用上报至权限中心，此处可对接入应用统一维护；停用应用后其全部资源同步失效。</div>',
    {wide:true,footer:'<button class="ant-btn" onclick="closeModal()">关闭</button>'});
}

function toggleAppStatusFromModal(appId) {
  closeModal();
  openAppToggleModal(appId);
}

function openAppForm() {
  openModal('新增应用',
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>应用名称</div><div class="ant-form-control"><input class="ant-input" id="aName" placeholder="请输入接入业务系统名称"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>appId</div><div class="ant-form-control"><input class="ant-input" id="aId" placeholder="全局唯一，字母开头，如 supervisor"></div></div>',
    {width:600,footer:'<button class="ant-btn" onclick="openAppModal()">返回列表</button><button class="ant-btn ant-btn-primary" onclick="submitApp()">确定</button>'});
}

function submitApp() {
  var name = document.getElementById('aName').value.trim();
  var appId = document.getElementById('aId').value.trim();
  if (!name) { alert('请输入应用名称'); return; }
  if (!appId) { alert('请输入 appId'); return; }
  if (findApp(appId)) { alert('appId 已存在：' + appId); return; }
  permTree.push({appId:appId, app:name, status:'已启用', time:'2026-08-25 10:00', menus:[]});
  var opt = document.createElement('option');
  opt.value = appId; opt.textContent = name;
  document.getElementById('fApp').appendChild(opt);
  openAppModal();
}

// ========== 批量导入 ==========
function openImportModal() {
  openModal('批量导入权限资源',
    '<div class="text-sm text-[#000000d9] mb-3">请按以下步骤完成导入：</div>' +
    '<div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:16px">' +
      '<div style="flex:1;border:1px solid #f0f0f0;border-radius:6px;padding:12px"><div style="font-weight:600;margin-bottom:4px">1. 下载模板</div><div style="color:#00000073;font-size:12px">含所属应用、资源类型、名称、标识、父级、排序列</div></div>' +
      '<div style="flex:1;border:1px solid #f0f0f0;border-radius:6px;padding:12px"><div style="font-weight:600;margin-bottom:4px">2. 填写数据</div><div style="color:#00000073;font-size:12px">按模板列填写，资源标识需全局唯一</div></div>' +
      '<div style="flex:1;border:1px solid #f0f0f0;border-radius:6px;padding:12px"><div style="font-weight:600;margin-bottom:4px">3. 上传文件</div><div style="color:#00000073;font-size:12px">逐行校验，合法行生效、非法行拒绝</div></div>' +
    '</div>' +
    '<div class="ant-form-item"><div class="ant-form-label">选择文件</div><div class="ant-form-control"><input type="file" class="ant-input" style="padding:6px 12px"></div></div>' +
    '<div style="color:#00000073;font-size:12px">支持 .xlsx / .csv 文件，单次最多导入 500 条；部分行失败时仅拒绝该行，不影响其余行，并将逐行反馈行号与原因；导入成功后自动归入对应应用与菜单层级。</div>',
    {width:720,footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn" onclick="downloadTemplate()">下载模板</button><button class="ant-btn ant-btn-primary" onclick="submitImport()">开始导入</button>'});
}

function downloadTemplate() { alert('原型演示：模板下载为占位交互'); }

function submitImport() {
  closeModal();
  openModal('导入完成',
    '<div class="text-sm text-[#000000d9]">本次导入 12 条资源：成功 <b style="color:#52c41a">10</b> 条，失败 <b style="color:#ff4d4f">2</b> 条（第 4 行资源标识重复、第 7 行所属菜单为空），成功行已生效并自动挂载到权限树对应节点下。</div>',
    {footer:'<button class="ant-btn ant-btn-primary" onclick="closeModal();renderTree()">知道了</button>'});
}

// ========== 初始化 ==========
permTree.forEach(function(a) { expandedApps[a.appId] = true; a.menus.forEach(function(m) { expandedMenus[m.id] = true; }); });
renderTree();
</script>
<script src="../../common.js"></script>
</body>
</html>
