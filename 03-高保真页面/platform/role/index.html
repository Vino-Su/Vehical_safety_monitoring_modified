<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>角色管理 - 智能网联汽车安全监测平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#1677ff',hover:'#4096ff',disabled:'#85a5cc'}}}}}</script>
  <script src="../../components/pagination-component.js"></script>
</head>
<body>
<div id="app" class="flex h-screen overflow-hidden">
  <aside id="sidebar"></aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header id="topnav"></header>
    <main class="flex-1 overflow-auto bg-[#f0f2f5] p-6">
      <div class="page-header">
        <h2>角色管理</h2>
        <div class="flex gap-2">
          <button class="ant-btn ant-btn-primary" onclick="openRoleModal(null)">+ 新增角色</button>
        </div>
      </div>
      <div class="filter-bar">
        <div class="filter-row">
          <div class="filter-item"><label>角色名称</label><input class="ant-input" id="fName" placeholder="请输入角色名称" style="width:160px"></div>
          <div class="filter-item"><label>角色编码</label><input class="ant-input" id="fCode" placeholder="请输入角色编码" style="width:160px"></div>
          <div class="filter-item"><label>角色类型</label><select class="ant-input" id="fType" style="width:130px"><option value="all">全部</option><option>系统内置</option><option>自定义</option></select></div>
          <div class="flex gap-2 items-end"><button class="ant-btn ant-btn-primary" onclick="doQuery()">查询</button><button class="ant-btn" onclick="doReset()">重置</button></div>
        </div>
      </div>
      <div class="ant-table-wrapper">
        <div style="overflow-x:auto">
          <table class="ant-table">
            <thead>
              <tr>
                <th>角色名称</th>
                <th>角色编码</th>
                <th style="width:100px;text-align:center">角色类型</th>
                <th>描述</th>
                <th style="width:170px;text-align:center">创建时间</th>
                <th style="width:110px;text-align:right">关联用户数量</th>
                <th style="width:240px;text-align:center">操作</th>
              </tr>
            </thead>
            <tbody id="roleTableBody"></tbody>
          </table>
        </div>
        <div id="paginationBar"></div>
      </div>
    </main>
  </div>
</div>
<script>
const PAGE_ID='role-manage';

// 用户池：供分配用户弹窗使用（账号 → 姓名、所属组织）
var userPool = [
  {account:'admin', name:'系统管理员', org:'市智能网联汽车监测中心'},
  {account:'zhangsan', name:'张三', org:'A公司'},
  {account:'lisi', name:'李四', org:'第三方专业服务机构A'},
  {account:'wangwu', name:'王五', org:'市工作专班'},
  {account:'zhaoliu', name:'赵六', org:'市交通管理局'},
  {account:'chenqi', name:'陈七', org:'A公司'},
  {account:'liuba', name:'刘八', org:'B公司'},
  {account:'zhoujiu', name:'周九', org:'第三方专业服务机构B'},
  {account:'wushi', name:'吴十', org:'市工作专班'},
  {account:'sunyang', name:'孙阳', org:'C公司'},
  {account:'hepeng', name:'何鹏', org:'市交通管理局'},
  {account:'linfeng', name:'林凤', org:'A公司'},
  {account:'dingyi', name:'丁一', org:'D公司'},
  {account:'kaijie', name:'凯杰', org:'第三方专业服务机构A'}
];

var roleData = [
  {id:1, name:'超级管理员', code:'super_admin', type:'系统内置', desc:'拥有平台全部功能权限与全部数据权限，不可修改', createTime:'2026-04-01 09:00:00', users:['admin']},
  {id:2, name:'只读观察员', code:'readonly', type:'系统内置', desc:'只读查看各类业务数据，用于监管观察，不可修改', createTime:'2026-04-01 09:05:00', users:['wushi','dingyi']},
  {id:3, name:'企业用户', code:'enterprise', type:'自定义', desc:'企业端准入申请、信息登记与本企业事件处置', createTime:'2026-04-02 10:20:00', users:['zhangsan','chenqi','liuba','sunyang','linfeng']},
  {id:4, name:'第三方专业服务机构', code:'third-party', type:'自定义', desc:'材料初审、测试服务与专业审核', createTime:'2026-04-02 10:35:00', users:['lisi','zhoujiu','kaijie']},
  {id:5, name:'市工作专班', code:'workgroup', type:'自定义', desc:'准入审批、报告审议与综合监管', createTime:'2026-04-02 10:50:00', users:['wangwu','kaijie']},
  {id:6, name:'交通管理部门', code:'traffic', type:'自定义', desc:'交通违法、事故数据监管与审核', createTime:'2026-04-03 09:15:00', users:['zhaoliu','hepeng']},
  {id:7, name:'企业安全管理员', code:'enterprise_admin', type:'自定义', desc:'企业内安全管理与人员、车辆信息维护', createTime:'2026-05-12 11:30:00', users:['chenqi','sunyang','linfeng']},
  {id:8, name:'第三方审核专员', code:'third_auditor', type:'自定义', desc:'异常事件与事故材料审核', createTime:'2026-05-20 16:00:00', users:['zhoujiu']},
  {id:9, name:'数据分析专员', code:'data_analyst', type:'自定义', desc:'监测数据分析与报告导出', createTime:'2026-06-18 09:40:00', users:['linfeng','dingyi']},
  {id:10, name:'测试演示角色', code:'demo_role', type:'自定义', desc:'用于演示角色复制与删除流程', createTime:'2026-07-22 15:20:00', users:[]},
  {id:11, name:'访客角色（备用）', code:'public_backup', type:'自定义', desc:'备用访客角色，未绑定用户', createTime:'2026-08-10 10:10:00', users:[]}
];

var filtered = roleData.slice();
var rolePager;

function findRole(id) {
  for (var i = 0; i < roleData.length; i++) if (roleData[i].id === id) return roleData[i];
  return null;
}

function renderRoleTable() {
  var cp = rolePager ? rolePager.getCurrentPage() : 1;
  var ps = rolePager ? rolePager.getPageSize() : 10;
  var start = (cp - 1) * ps;
  var pageData = filtered.slice(start, start + ps);
  var tbody = document.getElementById('roleTableBody');
  tbody.innerHTML = pageData.map(function(item) {
    var isBuiltin = item.type === '系统内置';
    var typeClass = isBuiltin ? 'ant-tag-processing' : 'ant-tag-default';
    var actions;
    if (isBuiltin) {
      actions = '<button class="ant-btn-link" onclick="goAuthorize(' + item.id + ')">查看授权</button>';
    } else {
      actions = '<button class="ant-btn-link" onclick="goAuthorize(' + item.id + ')">授权</button>' +
        '<button class="ant-btn-link" onclick="openAssignModal(' + item.id + ')">分配用户</button>' +
        '<button class="ant-btn-link" onclick="openCopyModal(' + item.id + ')">复制</button>' +
        '<button class="ant-btn-link" onclick="openRoleModal(' + item.id + ')">编辑</button>' +
        '<button class="ant-btn-link danger" onclick="openDeleteModal(' + item.id + ')">删除</button>';
    }
    return '<tr>' +
      '<td>' + item.name + '</td>' +
      '<td>' + item.code + '</td>' +
      '<td style="text-align:center"><span class="ant-tag ' + typeClass + '">' + item.type + '</span></td>' +
      '<td><div class="truncate" style="max-width:260px" title="' + item.desc + '">' + item.desc + '</div></td>' +
      '<td style="text-align:center">' + item.createTime + '</td>' +
      '<td style="text-align:right"><button class="ant-btn-link" onclick="openAssignModal(' + item.id + ')">' + item.users.length + '</button></td>' +
      '<td style="text-align:center"><div class="flex gap-1 justify-center flex-wrap">' + actions + '</div></td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="7" style="text-align:center;color:#00000040;padding:32px 0">暂无数据</td></tr>';
  if (rolePager) rolePager.setTotal(filtered.length);
}

function doQuery() {
  var name = document.getElementById('fName').value.trim();
  var code = document.getElementById('fCode').value.trim();
  var type = document.getElementById('fType').value;
  filtered = roleData.filter(function(item) {
    if (name && item.name.indexOf(name) === -1) return false;
    if (code && item.code.indexOf(code) === -1) return false;
    if (type !== 'all' && item.type !== type) return false;
    return true;
  });
  if (rolePager) rolePager.reset();
  renderRoleTable();
}

function doReset() {
  document.getElementById('fName').value = '';
  document.getElementById('fCode').value = '';
  document.getElementById('fType').value = 'all';
  doQuery();
}

rolePager = new Pagination({
  container: 'paginationBar',
  pageSize: 10,
  pageSizeOptions: [10, 20, 50, 100],
  onPageChange: function() { renderRoleTable(); },
  onPageSizeChange: function() { renderRoleTable(); }
});
renderRoleTable();

function goAuthorize(id) {
  var role = findRole(id);
  if (role) window.location.href = 'authorize.html?rid=' + role.code;
}

function openRoleModal(id) {
  var role = id ? findRole(id) : null;
  var title = role ? '编辑角色' : '新增角色';
  var codeInput = role
    ? '<input class="ant-input" value="' + role.code + '" disabled style="background:#f5f5f5">'
    : '<input class="ant-input" id="mRoleCode" placeholder="字母开头，含字母/数字/下划线">';
  openModal(title,
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>角色名称</div><div class="ant-form-control"><input class="ant-input" id="mRoleName" value="' + (role ? role.name : '') + '" placeholder="请输入角色名称"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>角色编码</div><div class="ant-form-control">' + codeInput + '</div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label">描述</div><div class="ant-form-control"><textarea class="ant-input" id="mRoleDesc" rows="3" placeholder="请输入角色职责说明">' + (role ? role.desc : '') + '</textarea></div></div>',
    {width:600,footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="submitRole(' + (role ? role.id : 'null') + ')">确定</button>'});
}

function submitRole(id) {
  var name = document.getElementById('mRoleName').value.trim();
  if (!name) { alert('请输入角色名称'); return; }
  if (id === null || id === 'null') {
    var code = document.getElementById('mRoleCode').value.trim();
    if (!code) { alert('请输入角色编码'); return; }
    for (var i = 0; i < roleData.length; i++) {
      if (roleData[i].code === code) { alert('角色编码已存在：' + code); return; }
    }
    roleData.unshift({id:Date.now(), name:name, code:code, type:'自定义', desc:document.getElementById('mRoleDesc').value.trim() || '—', createTime:'2026-08-25 10:00:00', users:[]});
  } else {
    var role = findRole(Number(id));
    role.name = name;
    role.desc = document.getElementById('mRoleDesc').value.trim() || '—';
  }
  closeModal();
  doQuery();
}

function userByAccount(account) {
  for (var i = 0; i < userPool.length; i++) if (userPool[i].account === account) return userPool[i];
  return {account:account, name:account, org:'—'};
}

function openAssignModal(id) {
  var role = findRole(id);
  var boundHtml = role.users.length
    ? role.users.map(function(account) {
        var u = userByAccount(account);
        return '<tr><td>' + u.account + '</td><td>' + u.name + '</td><td>' + u.org + '</td><td style="text-align:center"><button class="ant-btn-link danger" onclick="removeRoleUser(' + id + ',\'' + account + '\')">移除</button></td></tr>';
      }).join('')
    : '<tr><td colspan="4" style="text-align:center;color:#00000040;padding:24px 0">暂无绑定用户</td></tr>';
  var candidates = userPool.filter(function(u) { return role.users.indexOf(u.account) === -1; });
  var candidateHtml = candidates.map(function(u) {
    return '<label class="flex items-center gap-2 py-1"><input type="checkbox" class="ant-checkbox assign-cb" value="' + u.account + '"><span>' + u.name + '（' + u.account + '）</span><span style="color:#00000073">' + u.org + '</span></label>';
  }).join('') || '<div style="color:#00000040">全部用户已绑定</div>';
  openModal('分配用户 - ' + role.name,
    '<div style="max-height:280px;overflow:auto;border:1px solid #f0f0f0;border-radius:6px;padding:8px 12px">' + candidateHtml + '</div>' +
    '<div style="text-align:right;margin-top:8px"><button class="ant-btn ant-btn-primary" onclick="addRoleUsers(' + id + ')">添加所选用户</button></div>' +
    '<h4 class="text-sm font-semibold text-[#000000d9] mb-2 mt-4 pb-2 border-b border-[#f0f0f0]">已绑定用户（' + role.users.length + '）</h4>' +
    '<table class="ant-table"><thead><tr><th>账号</th><th>姓名</th><th>所属组织</th><th style="width:80px;text-align:center">操作</th></tr></thead><tbody>' + boundHtml + '</tbody></table>',
    {wide:true,footer:'<button class="ant-btn" onclick="closeModal()">关闭</button>'});
}

function addRoleUsers(id) {
  var role = findRole(id);
  var boxes = document.querySelectorAll('.assign-cb');
  var added = 0;
  boxes.forEach(function(cb) {
    if (cb.checked && role.users.indexOf(cb.value) === -1) { role.users.push(cb.value); added++; }
  });
  if (!added) { alert('请先勾选要添加的用户'); return; }
  openAssignModal(id);
}

function removeRoleUser(id, account) {
  var role = findRole(id);
  role.users = role.users.filter(function(a) { return a !== account; });
  openAssignModal(id);
}

function openCopyModal(id) {
  var role = findRole(id);
  openModal('复制角色',
    '<div class="p-3 bg-[#f6ffed] border border-[#b7eb8f] rounded text-sm text-[#389e0d] mb-4">将基于「' + role.name + '」创建新角色，并自动继承其全部功能权限与数据权限配置。</div>' +
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>新角色名称</div><div class="ant-form-control"><input class="ant-input" id="mCopyName" placeholder="请输入新角色名称"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label"><span class="required">*</span>新角色编码</div><div class="ant-form-control"><input class="ant-input" id="mCopyCode" placeholder="全局唯一，字母开头"></div></div>' +
    '<div class="ant-form-item"><div class="ant-form-label">描述</div><div class="ant-form-control"><input class="ant-input" id="mCopyDesc" value="复制自 ' + role.name + '"></div></div>',
    {width:600,footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="submitCopy(' + id + ')">确认复制</button>'});
}

function submitCopy(id) {
  var role = findRole(id);
  var name = document.getElementById('mCopyName').value.trim();
  var code = document.getElementById('mCopyCode').value.trim();
  if (!name) { alert('请输入新角色名称'); return; }
  if (!code) { alert('请输入新角色编码'); return; }
  for (var i = 0; i < roleData.length; i++) {
    if (roleData[i].code === code) { alert('角色编码已存在：' + code); return; }
  }
  roleData.unshift({id:Date.now(), name:name, code:code, type:'自定义', desc:document.getElementById('mCopyDesc').value.trim() || '复制自 ' + role.name, createTime:'2026-08-25 10:00:00', users:[]});
  closeModal();
  doQuery();
  openModal('复制成功', '<div class="text-sm text-[#000000d9]">角色「' + name + '」已创建，并继承「' + role.name + '」的全部功能权限与数据权限配置，绑定用户不复制。</div>',
    {footer:'<button class="ant-btn ant-btn-primary" onclick="closeModal()">知道了</button>'});
}

function openDeleteModal(id) {
  var role = findRole(id);
  if (role.users.length > 0) {
    openModal('无法删除角色',
      '<div class="p-3 bg-[#fff2f0] border border-[#ffccc7] rounded text-sm text-[#ff4d4f]">角色「' + role.name + '」当前仍绑定 ' + role.users.length + ' 个账号，请先在用户管理或分配用户中解除全部绑定后再删除。</div>',
      {width:520,footer:'<button class="ant-btn" onclick="closeModal()">知道了</button>'});
    return;
  }
  openModal('确认删除角色',
    '<div class="text-sm text-[#000000d9]">确认删除角色「' + role.name + '」吗？删除后其全部功能权限与数据权限配置将一并清除，且无法恢复。</div>',
    {footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-danger" onclick="confirmDelete(' + id + ')">确认删除</button>'});
}

function confirmDelete(id) {
  var role = findRole(id);
  roleData = roleData.filter(function(r) { return r.id !== id; });
  closeModal();
  doQuery();
}
</script>
<script src="../../common.js"></script>
</body>
</html>
