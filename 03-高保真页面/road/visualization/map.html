<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地图可视化展示 - 智能网联汽车安全监测平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#1677ff',hover:'#4096ff',disabled:'#85a5cc'}}}}}</script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    .map-area{flex:1;position:relative;min-width:0;overflow:hidden}
    .map-area #map{width:100%;height:100%;z-index:1}
    .map-area #map .leaflet-control-zoom{display:none}
    .layer-tabs{position:absolute;top:16px;left:16px;display:flex;background:#fff;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,0.08);padding:4px;gap:2px;z-index:1000}
    .layer-tab{padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:#666;transition:all .2s;white-space:nowrap;border:1px solid transparent;user-select:none}
    .layer-tab:hover{color:#1677ff;background:#f0f5ff}
    .layer-tab.active{color:#fff;background:#1677ff;border-color:#1677ff;box-shadow:0 2px 6px rgba(22,119,255,.3)}
    .layer-tab.fence-toggle{border-color:#d9d9d9;color:#666;background:#fff;margin-left:4px}
    .layer-tab.fence-toggle.active{color:#1677ff;background:#f0f5ff;border-color:#91caff;box-shadow:none}
    .layer-divider{width:1px;background:#e8e8e8;margin:4px 2px}
    .map-tools{position:absolute;top:64px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:1000}
    .map-tool{width:36px;height:36px;padding:0;border:1px solid #d9d9d9;border-radius:6px;background:#fff;color:#666;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:all .2s}
    .map-tool:hover{border-color:#1677ff;color:#1677ff}
    .map-tool.active{color:#1677ff;border-color:#91caff;background:#f0f5ff}
    .map-tool svg{width:18px;height:18px}
    .search-box{position:absolute;top:16px;right:16px;z-index:1000;display:flex;gap:0;background:#fff;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,0.08);overflow:hidden}
    .search-box input{width:220px;padding:9px 14px;border:none;outline:none;font-size:13px;color:#1f1f1f}
    .search-box input::placeholder{color:#bfbfbf}
    .search-box button{padding:9px 16px;border:none;background:#1677ff;color:#fff;cursor:pointer;font-size:13px;transition:all .2s;white-space:nowrap}
    .search-box button:hover{background:#4096ff}
    .search-results{position:absolute;top:100%;right:0;width:280px;background:#fff;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,0.08);margin-top:4px;display:none;z-index:1001;max-height:200px;overflow-y:auto}
    .search-results.show{display:block}
    .search-result-item{padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #f5f5f5;transition:all .2s}
    .search-result-item:hover{background:#f0f5ff}
    .search-result-item .name{font-weight:500}
    .search-result-item .detail{font-size:11px;color:#999;margin-top:2px}
    .map-legend{position:absolute;bottom:20px;left:16px;background:rgba(255,255,255,.96);border-radius:8px;padding:12px 16px;box-shadow:0 6px 16px rgba(0,0,0,0.08);font-size:11px;display:flex;flex-direction:column;gap:5px;z-index:1000;backdrop-filter:blur(6px)}
    .map-legend .legend-title{font-weight:600;font-size:12px;margin-bottom:2px;color:#1f1f1f}
    .map-legend .legend-item{display:flex;align-items:center;gap:8px}
    .map-legend .legend-color{width:24px;height:4px;border-radius:2px;flex-shrink:0}
    .map-legend .legend-label{color:#666}
    .map-tooltip{position:absolute;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.15);padding:16px 20px;font-size:13px;z-index:2000;pointer-events:none;opacity:0;transition:opacity .18s;min-width:260px;border:1px solid #eee}
    .map-tooltip.visible{opacity:1;pointer-events:auto}
    .map-tooltip .tt-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #f5f5f5}
    .map-tooltip .tt-name{font-weight:600;font-size:15px}
    .map-tooltip .tt-status{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:500}
    .tt-status.open{background:#f6ffed;color:#52c41a}
    .tt-status.suspended{background:#fff7e6;color:#fa8c16}
    .tt-status.closed{background:#fff2f0;color:#ff4d4f}
    .tt-status.pending{background:#e6f4ff;color:#1677ff}
    .map-tooltip .tt-row{display:flex;justify-content:space-between;padding:3px 0;color:#666;font-size:12px}
    .map-tooltip .tt-row span:last-child{color:#1f1f1f;font-weight:500}
    .map-tooltip .tt-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
    .map-tooltip .tt-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:#f0f5ff;color:#1677ff}
    .map-tooltip .tt-close{position:absolute;top:8px;right:10px;cursor:pointer;width:20px;height:20px;border-radius:50%;border:none;background:#f5f5f5;font-size:12px;display:flex;align-items:center;justify-content:center;pointer-events:auto;color:#999}
    .map-tooltip .tt-close:hover{background:#e8e8e8;color:#333}
    .empty-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.95);padding:20px 28px;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,0.08);text-align:center;z-index:1000;display:none;font-size:14px;color:#666}
    .empty-hint.show{display:block}
    .empty-hint .icon{font-size:36px;margin-bottom:8px}
    .side-panel{width:340px;background:#fff;display:flex;flex-direction:column;box-shadow:-2px 0 8px rgba(0,0,0,.06);z-index:5;overflow:hidden;flex-shrink:0}
    .side-panel .panel-header{padding:16px 20px;border-bottom:1px solid #e8e8e8;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
    .side-panel .panel-header .count-badge{background:#f0f5ff;color:#1677ff;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:500}
    .resource-tabs{display:flex;padding:0 16px;border-bottom:1px solid #f0f0f0;background:#fff;flex-shrink:0}
    .resource-tab{flex:1;border:0;background:transparent;color:#666;padding:11px 8px 10px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
    .resource-tab:hover{color:#1677ff}
    .resource-tab.active{color:#1677ff;font-weight:600;border-bottom-color:#1677ff}
    .side-panel .filter-section{padding:14px 20px;border-bottom:1px solid #f5f5f5;flex-shrink:0}
    .side-panel .filter-section .filter-label{font-size:12px;font-weight:600;color:#666;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
    .side-panel .filter-select{width:100%;padding:7px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:12px;outline:none;margin-bottom:8px;color:#333;background:#fff;cursor:pointer}
    .side-panel .filter-select:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
    .multi-select{position:relative;width:100%;margin-bottom:8px}
    .ms-trigger{width:100%;padding:7px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:12px;color:#333;background:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all .2s;box-sizing:border-box}
    .ms-trigger:hover{border-color:#1677ff}
    .ms-trigger.open{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
    .ms-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ms-arrow{color:#bfbfbf;font-size:10px;margin-left:6px;transition:transform .2s}
    .ms-trigger.open .ms-arrow{transform:rotate(180deg)}
    .ms-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #d9d9d9;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.08);z-index:100;display:none;max-height:220px;overflow-y:auto;padding:4px 0}
    .ms-dropdown.show{display:block}
    .ms-dropdown::-webkit-scrollbar{width:4px}
    .ms-dropdown::-webkit-scrollbar-thumb{background:#d9d9d9;border-radius:2px}
    .ms-option{display:flex;align-items:center;padding:7px 12px;font-size:12px;color:#333;cursor:pointer;transition:background .15s;gap:8px;user-select:none}
    .ms-option:hover{background:#f0f5ff}
    .ms-option input{margin:0;cursor:pointer;accent-color:#1677ff;width:14px;height:14px;flex-shrink:0}
    .ms-option.all-option{border-bottom:1px solid #f0f0f0;margin-bottom:2px}
    .side-panel .btn-row{display:flex;gap:8px;margin-top:4px}
    .side-panel .btn-reset{flex:1;padding:7px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;cursor:pointer;font-size:12px;transition:all .2s;color:#666}
    .side-panel .btn-reset:hover{border-color:#1677ff;color:#1677ff}
    .side-panel .road-list{flex:1;overflow-y:auto;padding:0}
    .side-panel .road-list::-webkit-scrollbar{width:4px}
    .side-panel .road-list::-webkit-scrollbar-thumb{background:#d9d9d9;border-radius:2px}
    .filter-toggle{font-size:12px;color:#1677ff;cursor:pointer;margin-left:auto;user-select:none;padding:4px 8px;border-radius:4px;transition:all .2s;white-space:nowrap}
    .filter-toggle:hover{background:#f0f5ff}
    .filter-collapse{flex-shrink:0}
    .road-item{display:flex;align-items:flex-start;padding:12px 16px;border-bottom:1px solid #fafafa;cursor:pointer;transition:all .2s;gap:10px}
    .road-item:hover{background:#fafafa}
    .road-item.selected{background:#e6f4ff;border-left:3px solid #1677ff}
    .road-item .road-color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
    .road-item .road-info{flex:1;min-width:0}
    .road-item .road-name{font-weight:500;font-size:13px}
    .road-item .road-meta{font-size:11px;line-height:18px;color:#8c8c8c;margin-top:3px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
    .road-item .road-tag{font-size:10px;padding:3px 8px;border-radius:10px;flex-shrink:0;margin-top:1px}
    .tag-open{background:#f6ffed;color:#52c41a}
    .tag-suspended{background:#fff7e6;color:#fa8c16}
    .tag-closed{background:#fff2f0;color:#ff4d4f}
    .fence-item{display:flex;align-items:flex-start;padding:12px 16px;border-bottom:1px solid #fafafa;cursor:pointer;transition:all .2s;gap:10px}
    .fence-item:hover{background:#fafafa}
    .fence-item.selected{background:#e6f4ff;border-left:3px solid #1677ff;padding-left:13px}
    .fence-item .fence-color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
    .fence-item .fence-info{flex:1;min-width:0}
    .fence-item .fence-name{font-weight:500;font-size:13px;line-height:18px}
    .fence-item .fence-meta{font-size:11px;color:#999;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fence-item .fence-tag{font-size:10px;padding:2px 8px;border-radius:10px;flex-shrink:0}
    .tag-pending{background:#e6f4ff;color:#1677ff}
    .fence-filter-row{display:flex;gap:8px}
    .fence-filter-row .filter-select{margin-bottom:0}
  </style>
</head>
<body>
<div id="app" class="flex h-screen overflow-hidden">
  <aside id="sidebar"></aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header id="topnav"></header>
    <main class="flex-1 overflow-hidden bg-[#f0f2f5] flex">
      <div class="map-area" id="mapArea">
        <div id="map"></div>

        <!-- 主题图层切换 -->
        <div class="layer-tabs" id="layerTabs">
          <div class="layer-tab active" data-layer="base">🏠 基础信息</div>
          <div class="layer-tab" data-layer="complexity">📊 复杂度</div>
          <div class="layer-tab" data-layer="risk">⚠️ 风险评估</div>
          <div class="layer-tab" data-layer="scene">🎯 场景适配</div>
          <div class="layer-tab" data-layer="level">🔓 建议开放等级</div>
        </div>
        <div class="map-tools" aria-label="地图工具栏">
          <button class="map-tool active" id="fenceToggle" type="button" title="显示/隐藏电子围栏" aria-label="显示/隐藏电子围栏" onclick="toggleFenceVisibility(event)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6.5 12 3l8 3.5v11L12 21l-8-3.5z"/><path d="M4 6.5 12 10l8-3.5M12 10v11"/><path d="m7 8 2-1m6 2 2-1"/></svg>
          </button>
        </div>

        <!-- 搜索框 -->
        <div class="search-box">
          <input type="text" placeholder="搜索道路名称 / 编号..." id="searchInput" oninput="handleSearchInput(this.value)" onfocus="handleSearchInput(this.value)">
          <button>搜索</button>
          <div class="search-results" id="searchResults"></div>
        </div>

        <!-- 图例 -->
        <div class="map-legend" id="mapLegend">
          <div class="legend-title" id="legendTitle">基础信息</div>
          <div id="legendContent">
            <div class="legend-item"><span class="legend-color" style="background:#52c41a;"></span><span class="legend-label">开放道路</span></div>
            <div class="legend-item"><span class="legend-color" style="background:#fa8c16;"></span><span class="legend-label">暂停道路</span></div>
            <div class="legend-item"><span class="legend-color" style="background:#ff4d4f;"></span><span class="legend-label">关闭道路</span></div>
          </div>
        </div>

        <!-- 信息提示框 -->
        <div class="map-tooltip" id="mapTooltip">
          <button class="tt-close" onclick="closeTooltip()">✕</button>
          <div id="tooltipContent"></div>
        </div>

        <!-- 空状态提示 -->
        <div class="empty-hint" id="emptyHint">
          <div class="icon">📍</div>
          <div class="hint-text">当前筛选条件下无匹配道路</div>
          <div class="hint-sub">请调整筛选条件或切换主题图层</div>
        </div>
      </div>

      <!-- 右侧筛选面板 -->
      <div class="side-panel" id="sidePanel">
        <div class="panel-header">
          <span id="resourceTitle">道路列表</span><span class="count-badge" id="resourceCount">共 12 条</span>
          <span class="filter-toggle" id="filterToggle" onclick="toggleFilters()">展开筛选 ▾</span>
        </div>

        <div class="resource-tabs" role="tablist" aria-label="地图资源类型">
          <button class="resource-tab active" id="roadTab" role="tab" aria-selected="true" onclick="switchResourceTab('road')">道路 <span id="roadTabCount">12</span></button>
          <button class="resource-tab" id="fenceTab" role="tab" aria-selected="false" onclick="switchResourceTab('fence')">电子围栏 <span id="fenceTabCount">5</span></button>
        </div>

        <!-- 筛选项：行政区域（始终显示） -->
        <div class="filter-section" id="districtFilterSection">
          <div class="filter-label">行政区域</div>
          <select class="filter-select" id="filterDistrict" onchange="applyFilters()">
            <option value="all">全部区域</option>
            <option value="樊城区">樊城区</option>
            <option value="高新区">高新区</option>
            <option value="襄城区">襄城区</option>
            <option value="东津新区">东津新区</option>
          </select>
        </div>

        <!-- 可收起筛选组 -->
        <div class="filter-collapse" id="filterCollapse" style="display:none">
          <div id="roadFilterFields">
          <div class="filter-section">
            <div class="filter-label">适用应用场景</div>
            <div class="multi-select" data-filter="bizType">
              <div class="ms-trigger" onclick="toggleMultiSelect(this)">
                <span class="ms-text">全部</span><span class="ms-arrow">▾</span>
              </div>
              <div class="ms-dropdown">
                <label class="ms-option all-option"><input type="checkbox" value="all" checked onchange="onMultiSelectChange(this)"> 全部</label>
                <label class="ms-option"><input type="checkbox" value="无人物流" onchange="onMultiSelectChange(this)"> 无人物流</label>
                <label class="ms-option"><input type="checkbox" value="无人环卫" onchange="onMultiSelectChange(this)"> 无人环卫</label>
                <label class="ms-option"><input type="checkbox" value="无人公交" onchange="onMultiSelectChange(this)"> 无人公交</label>
                <label class="ms-option"><input type="checkbox" value="无人出行" onchange="onMultiSelectChange(this)"> 无人出行</label>
              </div>
            </div>
          </div>

          <div class="filter-section">
            <div class="filter-label">基础设施覆盖</div>
            <div class="multi-select" data-filter="facility">
              <div class="ms-trigger" onclick="toggleMultiSelect(this)">
                <span class="ms-text">全部</span><span class="ms-arrow">▾</span>
              </div>
              <div class="ms-dropdown">
                <label class="ms-option all-option"><input type="checkbox" value="all" checked onchange="onMultiSelectChange(this)"> 全部</label>
                <label class="ms-option"><input type="checkbox" value="RSU" onchange="onMultiSelectChange(this)"> RSU</label>
                <label class="ms-option"><input type="checkbox" value="激光雷达" onchange="onMultiSelectChange(this)"> 激光雷达</label>
                <label class="ms-option"><input type="checkbox" value="摄像头" onchange="onMultiSelectChange(this)"> 摄像头</label>
              </div>
            </div>
          </div>

          <div class="filter-section">
            <div class="filter-label">开放状态</div>
            <div class="multi-select" data-filter="status">
              <div class="ms-trigger" onclick="toggleMultiSelect(this)">
                <span class="ms-text">全部</span><span class="ms-arrow">▾</span>
              </div>
              <div class="ms-dropdown">
                <label class="ms-option all-option"><input type="checkbox" value="all" checked onchange="onMultiSelectChange(this)"> 全部</label>
                <label class="ms-option"><input type="checkbox" value="开放" onchange="onMultiSelectChange(this)"> 开放</label>
                <label class="ms-option"><input type="checkbox" value="暂停" onchange="onMultiSelectChange(this)"> 暂停</label>
                <label class="ms-option"><input type="checkbox" value="关闭" onchange="onMultiSelectChange(this)"> 关闭</label>
              </div>
            </div>
          </div>

          <div class="filter-section">
            <div class="filter-label">道路类型</div>
            <div class="multi-select" data-filter="roadType">
              <div class="ms-trigger" onclick="toggleMultiSelect(this)">
                <span class="ms-text">全部</span><span class="ms-arrow">▾</span>
              </div>
              <div class="ms-dropdown">
                <label class="ms-option all-option"><input type="checkbox" value="all" checked onchange="onMultiSelectChange(this)"> 全部</label>
                <label class="ms-option"><input type="checkbox" value="主干道" onchange="onMultiSelectChange(this)"> 主干道</label>
                <label class="ms-option"><input type="checkbox" value="次干道" onchange="onMultiSelectChange(this)"> 次干道</label>
                <label class="ms-option"><input type="checkbox" value="支路" onchange="onMultiSelectChange(this)"> 支路</label>
                <label class="ms-option"><input type="checkbox" value="快速路" onchange="onMultiSelectChange(this)"> 快速路</label>
              </div>
            </div>
          </div>

          <div class="filter-section">
            <div class="filter-label">自动驾驶等级</div>
            <div class="multi-select" data-filter="adLevel">
              <div class="ms-trigger" onclick="toggleMultiSelect(this)">
                <span class="ms-text">全部</span><span class="ms-arrow">▾</span>
              </div>
              <div class="ms-dropdown">
                <label class="ms-option all-option"><input type="checkbox" value="all" checked onchange="onMultiSelectChange(this)"> 全部</label>
                <label class="ms-option"><input type="checkbox" value="L2" onchange="onMultiSelectChange(this)"> L2</label>
                <label class="ms-option"><input type="checkbox" value="L3" onchange="onMultiSelectChange(this)"> L3</label>
                <label class="ms-option"><input type="checkbox" value="L4" onchange="onMultiSelectChange(this)"> L4</label>
              </div>
            </div>
          </div>

          <div class="filter-section">
            <div class="btn-row">
              <button class="btn-reset" onclick="resetAllFilters()">重置筛选</button>
            </div>
          </div>
          </div>
          <div id="fenceFilterFields" style="display:none">
            <div class="filter-section">
              <div class="filter-label">围栏状态</div>
              <select class="filter-select" id="filterFenceStatus" onchange="applyFenceFilters()">
                <option value="all">全部状态</option>
                <option value="开放">开放</option>
                <option value="暂停">暂停</option>
                <option value="关闭">关闭</option>
                <option value="待配置矢量">待配置矢量</option>
              </select>
            </div>
            <div class="filter-section">
              <div class="filter-label">围栏类型</div>
              <select class="filter-select" id="filterFenceType" onchange="applyFenceFilters()">
                <option value="all">全部类型</option>
                <option value="允许通行区域">允许通行区域</option>
                <option value="禁止通行区域">禁止通行区域</option>
              </select>
            </div>
            <div class="filter-section">
              <div class="btn-row">
                <button class="btn-reset" onclick="resetFenceFilters()">重置筛选</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 道路/围栏列表 -->
        <div class="road-list" id="roadList"></div>
      </div>
    </main>
  </div>
</div>
<script>
const PAGE_ID='road-map';

function getLayerColor(road) {
    switch (activeLayer) {
        case 'base':
            return road.status === '开放' ? '#52c41a' : road.status === '暂停' ? '#fa8c16' : '#ff4d4f';
        case 'complexity':
            if (road.complexity >= 80) return '#ff4d4f';
            if (road.complexity >= 50) return '#fa8c16';
            return '#52c41a';
        case 'risk':
            if (road.risk >= 70) return '#ff4d4f';
            if (road.risk >= 35) return '#fa8c16';
            return '#52c41a';
        case 'scene':
            if (road.sceneFit === '载人') return '#1677ff';
            if (road.sceneFit === '载货') return '#722ed1';
            if (road.sceneFit === '环卫') return '#52c41a';
            if (road.sceneFit === '物流') return '#fa8c16';
            return '#666';
        case 'level':
            if (road.openLevel === '完全开放') return '#52c41a';
            if (road.openLevel === '条件开放') return '#fa8c16';
            if (road.openLevel === '限制开放') return '#ff7a45';
            if (road.openLevel === '禁止开放') return '#ff4d4f';
            return '#999';
        default:
            return '#52c41a';
    }
}

function buildRoadPolylines() {
    const filtered = getFilteredRoads();
    roadLayers = {};
    roadLayerGroup.clearLayers();

    if (filtered.length === 0) {
        emptyHint.classList.add('show');
        return;
    }
    emptyHint.classList.remove('show');

    filtered.forEach(road => {
        const color = getLayerColor(road);
        const latlngs = road.points.map(p => [p.lat, p.lng]);
        const isSelected = road.id === selectedRoadId;

        const polyline = L.polyline(latlngs, {
            color: color,
            weight: isSelected ? 7 : 4,
            opacity: 0.85,
            smoothFactor: 1
        }).addTo(roadLayerGroup);

        polyline.on('click', function(e) {
            selectRoad(road.id);
            L.DomEvent.stopPropagation(e);
        });

        polyline.on('mouseover', function() {
            if (selectedRoadId !== road.id) {
                this.setStyle({ weight: 6, opacity: 1 });
                this.getElement().style.cursor = 'pointer';
            }
        });

        polyline.on('mouseout', function() {
            if (selectedRoadId !== road.id) {
                this.setStyle({ weight: 4, opacity: 0.85 });
            }
        });

        roadLayers[road.id] = polyline;

        // 端点标记
        road.points.forEach(p => {
            L.circleMarker([p.lat, p.lng], {
                radius: 4,
                color: color,
                fillColor: color,
                fillOpacity: 1,
                weight: 1,
                interactive: false
            }).addTo(roadLayerGroup);
        });

        // 道路名称标签
        const midLat = (road.points[0].lat + road.points[1].lat) / 2;
        const midLng = (road.points[0].lng + road.points[1].lng) / 2;
        L.marker([midLat, midLng], {
            icon: L.divIcon({
                className: 'road-label',
                html: `<span style="font-size:12px;font-weight:500;color:#1f1f1f;text-shadow:0 0 4px #fff,0 0 4px #fff;white-space:nowrap;pointer-events:none">${road.name}</span>`,
                iconSize: [0, 0],
                iconAnchor: [0, 0]
            }),
            interactive: false
        }).addTo(roadLayerGroup);
    });

    // 选中道路高亮发光效果
    if (selectedRoadId && roadLayers[selectedRoadId]) {
        const road = roadData.find(r => r.id === selectedRoadId);
        const latlngs = road.points.map(p => [p.lat, p.lng]);
        selectedLayer = L.polyline(latlngs, {
            color: 'rgba(22,119,255,0.25)',
            weight: 16,
            smoothFactor: 1,
            interactive: false
        }).addTo(roadLayerGroup);

        // 确保选中的线在最上层
        roadLayers[selectedRoadId].setStyle({ weight: 7, opacity: 1 });
        roadLayers[selectedRoadId].bringToFront();
    }

    // 设施图标（基础信息图层）
    if (activeLayer === 'base') {
        facilityMarkers.forEach(m => map.removeLayer(m));
        facilityMarkers = [];
        filtered.forEach(road => {
            if (road.facilities.length > 0) {
                const midLat = (road.points[0].lat + road.points[1].lat) / 2;
                const midLng = (road.points[0].lng + road.points[1].lng) / 2;
                const icons = [];
                if (road.facilities.includes('RSU')) icons.push('📡');
                if (road.facilities.includes('激光雷达')) icons.push('🔴');
                if (road.facilities.includes('摄像头')) icons.push('📷');
                icons.forEach((icon, i) => {
                    const marker = L.marker([midLat + i * 0.002, midLng + 0.003], {
                        icon: L.divIcon({
                            className: 'facility-icon',
                            html: `<span style="font-size:14px;pointer-events:none">${icon}</span>`,
                            iconSize: [0, 0],
                            iconAnchor: [0, 0]
                        }),
                        interactive: false
                    }).addTo(map);
                    facilityMarkers.push(marker);
                });
            }
        });
    } else {
        facilityMarkers.forEach(m => map.removeLayer(m));
        facilityMarkers = [];
    }
}

function getFenceColor(fence) {
    if (fence.status === '开放') return '#52c41a';
    if (fence.status === '暂停') return '#faad14';
    if (fence.status === '关闭') return '#ff4d4f';
    return '#1677ff';
}

function getFenceDash(fence) {
    if (fence.status === '暂停') return '8 4';
    if (fence.status === '关闭') return '4 4';
    if (fence.status === '待配置矢量') return '2 4';
    return null;
}

function getFilteredFences() {
    return fenceData.filter(f => {
        if (fenceFilters.status !== 'all' && f.status !== fenceFilters.status) return false;
        if (fenceFilters.fenceType !== 'all' && f.fenceType !== fenceFilters.fenceType) return false;
        return true;
    });
}

function buildFencePolygons() {
    fenceLayers = {};
    fenceLayerGroup.clearLayers();
    if (!fenceVisible) return;
    getFilteredFences().filter(f => f.points && f.points.length >= 3).forEach(fence => {
        const color = getFenceColor(fence);
        const polygon = L.polygon(fence.points.map(p => [p.lat, p.lng]), {
            color: color,
            weight: fence.fenceType === '禁止通行区域' ? 3 : 2,
            dashArray: getFenceDash(fence),
            fillColor: color,
            fillOpacity: fence.fenceType === '禁止通行区域' ? 0.2 : 0.12,
            interactive: true
        }).addTo(fenceLayerGroup);
        polygon.on('click', function(e) {
            selectFence(fence.id);
            L.DomEvent.stopPropagation(e);
        });
        polygon.on('mouseover', function() {
            if (selectedFenceId !== fence.id) this.setStyle({ weight: 3, fillOpacity: 0.2 });
        });
        polygon.on('mouseout', function() {
            if (selectedFenceId !== fence.id) this.setStyle({ weight: fence.fenceType === '禁止通行区域' ? 3 : 2, fillOpacity: fence.fenceType === '禁止通行区域' ? 0.2 : 0.12 });
        });
        fenceLayers[fence.id] = polygon;
        const center = polygon.getBounds().getCenter();
        L.marker(center, {
            icon: L.divIcon({
                className: 'fence-label',
                html: `<span style="font-size:11px;font-weight:500;color:${color};text-shadow:0 0 4px #fff,0 0 4px #fff;white-space:nowrap;pointer-events:none">${fence.name}</span>`,
                iconSize: [0, 0], iconAnchor: [0, 0]
            }),
            interactive: false
        }).addTo(fenceLayerGroup);
    });
    if (selectedFenceId && fenceLayers[selectedFenceId]) {
        fenceLayers[selectedFenceId].setStyle({ weight: 4, fillOpacity: 0.25 });
        fenceLayers[selectedFenceId].bringToFront();
    }
}

function selectFence(id) {
    const fence = fenceData.find(f => f.id === id);
    if (!fence) return;
    selectedFenceId = id;
    if (fence.points.length >= 3) {
        const bounds = L.latLngBounds(fence.points.map(p => [p.lat, p.lng]));
        map.fitBounds(bounds, { padding: [60, 60], maxZoom: 14, animate: true });
        showFenceTooltip(fence);
    } else {
        closeTooltip();
         tooltipContent.innerHTML = buildFenceTooltipContent(fence);
        mapTooltip.classList.add('visible');
        mapTooltip.style.left = '24px';
        mapTooltip.style.top = '110px';
    }
    buildFencePolygons();
    renderResourceList();
}

function showFenceTooltip(fence) {
    tooltipContent.innerHTML = buildFenceTooltipContent(fence);
    mapTooltip.classList.add('visible');
    const center = L.latLngBounds(fence.points.map(p => [p.lat, p.lng])).getCenter();
    const point = map.latLngToContainerPoint(center);
    mapTooltip.style.left = Math.min(point.x + 20, mapArea.clientWidth - 300) + 'px';
    mapTooltip.style.top = Math.max(10, point.y - 120) + 'px';
}

function buildFenceTooltipContent(fence) {
    const statusClass = fence.status === '开放' ? 'open' : fence.status === '暂停' ? 'suspended' : fence.status === '关闭' ? 'closed' : 'pending';
    const speedText = fence.fenceType === '允许通行区域' && fence.speedLimitEnabled && fence.speedLimit ? `限速 ${fence.speedLimit} km/h` : '不限速';
    const rules = (fence.ruleConfig || []).slice();
    if (fence.fenceType === '允许通行区域' && fence.supportApply) rules.push('支持申请主体申请该区域');
    return `<div class="tt-header"><span class="tt-name">${fence.name}</span><span class="tt-status ${statusClass}">${fence.status}</span></div><div class="tt-row"><span>围栏类型</span><span>${fence.fenceType}</span></div><div class="tt-row"><span>限速配置</span><span>${speedText}</span></div><div class="tt-row"><span>规则配置</span><span>${rules.length ? rules.join('、') : '—'}</span></div>`;
}

// ==================== 筛选逻辑 ====================
function getFilteredRoads() {
    return roadData.filter(r => {
        if (filters.district !== 'all' && r.district !== filters.district) return false;
        if (!filters.bizType.includes('all') && !filters.bizType.some(v => r.applicationScenes.includes(v))) return false;
        if (!filters.facility.includes('all') && !filters.facility.some(v => r.facilities.includes(v))) return false;
        if (!filters.status.includes('all') && !filters.status.includes(r.status)) return false;
        if (!filters.roadType.includes('all') && !filters.roadType.includes(r.level)) return false;
        if (!filters.adLevel.includes('all') && !filters.adLevel.some(v => r.adLevels.includes(v))) return false;
        return true;
    });
}

                <div class="legend-item"><span class="legend-color" style="background:#52c41a;"></span><span class="legend-label">低复杂度</span></div>
                <div class="legend-item"><span class="legend-color" style="background:#fa8c16;"></span><span class="legend-label">中复杂度</span></div>
                <div class="legend-item"><span class="legend-color" style="background:#ff4d4f;"></span><span class="legend-label">高复杂度</span></div>`;
            break;
        case 'risk':
            legendTitle.textContent = '风险评估';
            roadLegend = `
                <div class="legend-item"><span class="legend-color" style="background:#52c41a;"></span><span class="legend-label">低风险</span></div>
                <div class="legend-item"><span class="legend-color" style="background:#fa8c16;"></span><span class="legend-label">中风险</span></div>
                <div class="legend-item"><span class="legend-color" style="background:#ff4d4f;"></span><span class="legend-label">高风险</span></div>`;
            break;
        case 'scene':
            legendTitle.textContent = '场景适配';
            roadLegend = `
                <div class="legend-item"><span class="legend-color" style="background:#1677ff;"></span><span class="legend-label">载人</span></div>
                <div class="legend-item"><span class="legend-color" style="background:#722ed1;"></span><span class="legend-label">载货</span></div>
                <div class="legend-item"><span class="legend-color" style="background:#52c41a;"></span><span class="legend-label">环卫</span></div>
                <div class="legend-item"><span class="legend-color" style="background:#fa8c16;"></span><span class="legend-label">物流</span></div>`;
            break;
        case 'level':
            legendTitle.textContent = '建议开放等级';
            roadLegend = `
                <div class="legend-item"><span class="legend-color" style="background:#52c41a;"></span><span class="legend-label">完全开放</span></div>
                <div class="legend-item"><span class="legend-color" style="background:#fa8c16;"></span><span class="legend-label">条件开放</span></div>
                <div class="legend-item"><span class="legend-color" style="background:#ff7a45;"></span><span class="legend-label">限制开放</span></div>
                <div class="legend-item"><span class="legend-color" style="background:#ff4d4f;"></span><span class="legend-label">禁止开放</span></div>`;
            break;
    }
    legendContent.innerHTML = roadLegend + (fenceVisible ? `<div class="legend-title" style="margin-top:8px;padding-top:8px;border-top:1px solid #f0f0f0">电子围栏</div><div class="legend-item"><span class="legend-color" style="background:#52c41a"></span><span class="legend-label">开放围栏</span></div><div class="legend-item"><span class="legend-color" style="background:#faad14;border-top:2px dashed #faad14"></span><span class="legend-label">暂停围栏</span></div><div class="legend-item"><span class="legend-color" style="background:#ff4d4f;border-top:2px dashed #ff4d4f"></span><span class="legend-label">关闭围栏</span></div>` : '');
}

// ==================== 道路列表渲染 ====================
function renderRoadList() {
    const filtered = getFilteredRoads();
    resourceCount.textContent = `共 ${filtered.length} 条`;
    roadTabCount.textContent = filtered.length;
    let html = '';
    if (filtered.length === 0) {
        html = '<div style="text-align:center;padding:30px;color:#999;">暂无匹配道路</div>';
    }
    filtered.forEach(r => {
        const isSelected = r.id === selectedRoadId;
        const color = getLayerColor(r);
        let statusTag = '';
        if (r.status === '开放') statusTag = '<span class="road-tag tag-open">开放</span>';
        else if (r.status === '暂停') statusTag = '<span class="road-tag tag-suspended">暂停</span>';
        else statusTag = '<span class="road-tag tag-closed">关闭</span>';
        html += `
        <div class="road-item${isSelected ? ' selected' : ''}" onclick="selectRoad('${r.id}')">
            <span class="road-color-dot" style="background:${color};"></span>
            <div class="road-info">
                <div class="road-name">${r.name}</div>
                <div class="road-meta">${r.district} - ${r.applicationScenes.join(' / ')} - ${r.businessTypes.join(' / ')}</div>
            </div>
            ${statusTag}
        </div>`;
    });
    roadList.innerHTML = html;
}

function renderFenceList() {
    const filtered = getFilteredFences();
    resourceTitle.textContent = '电子围栏列表';
    resourceCount.textContent = `共 ${filtered.length} 条`;
    fenceTabCount.textContent = filtered.length;
    let html = '';
    if (filtered.length === 0) html = '<div style="text-align:center;padding:30px;color:#999;">暂无匹配电子围栏</div>';
    filtered.forEach(f => {
        const color = getFenceColor(f);
        const tagClass = f.status === '开放' ? 'tag-open' : f.status === '暂停' ? 'tag-suspended' : f.status === '关闭' ? 'tag-closed' : 'tag-pending';
        html += `<div class="fence-item${f.id === selectedFenceId ? ' selected' : ''}" onclick="selectFence('${f.id}')"><span class="fence-color-dot" style="background:${color}"></span><div class="fence-info"><div class="fence-name">${f.name}</div><div class="fence-meta">${f.fenceType}</div></div><span class="fence-tag ${tagClass}">${f.status}</span></div>`;
    });
    roadList.innerHTML = html;
}

function renderResourceList() {
    if (activeResourceTab === 'fence') renderFenceList();
    else {
        resourceTitle.textContent = '道路列表';
        renderRoadList();
    }
}

// ==================== 道路选中与提示 ====================
function selectRoad(id) {
    if (activeResourceTab !== 'road') switchResourceTab('road');
    selectedRoadId = id;
    selectedFenceId = null;
    const road = roadData.find(r => r.id === id);
    if (road) {
        const midLat = (road.points[0].lat + road.points[1].lat) / 2;
        const midLng = (road.points[0].lng + road.points[1].lng) / 2;
        map.setView([midLat, midLng], map.getZoom(), { animate: true });
        showTooltip(road);
    }
    buildRoadPolylines();
    renderResourceList();
}

function showTooltip(road) {
    const color = getLayerColor(road);
    let statusClass = road.status === '开放' ? 'open' : road.status === '暂停' ? 'suspended' : 'closed';
    tooltipContent.innerHTML = `
        <div class="tt-header">
            <span class="tt-name">${road.name}</span>
            <span class="tt-status ${statusClass}">${road.status}</span>
        </div>
        <div class="tt-row"><span>道路编号</span><span>${road.id}</span></div>
        <div class="tt-row"><span>所属区域</span><span>${road.district}</span></div>
        <div class="tt-row"><span>道路等级</span><span>${road.level}</span></div>
        <div class="tt-row"><span>车道数</span><span>${road.lanes} 车道</span></div>
        <div class="tt-row"><span>路段长度</span><span>${road.length} 米</span></div>
        <div class="tt-row"><span>开放时间</span><span>${road.openHours}</span></div>
        <div class="tt-row"><span>适用自动驾驶等级</span><span>${road.adLevels.join(' / ')}</span></div>
        <div class="tt-row"><span>适用应用场景</span><span>${road.applicationScenes.join(' / ')}</span></div>
        <div class="tt-row"><span>适用业务类型</span><span>${road.businessTypes.join(' / ') || '—'}</span></div>
        ${activeLayer==='complexity' ? `<div class="tt-row"><span>复杂度得分</span><span style="color:${color}">${road.complexity}</span></div>` : ''}
        ${activeLayer==='risk' ? `<div class="tt-row"><span>风险得分</span><span style="color:${color}">${road.risk}</span></div>` : ''}
        ${activeLayer==='scene' ? `<div class="tt-row"><span>场景适配</span><span style="color:${color}">${road.sceneFit}</span></div>` : ''}
        ${activeLayer==='level' ? `<div class="tt-row"><span>建议开放等级</span><span style="color:${color}">${road.openLevel}</span></div>` : ''}
        ${road.facilities.length > 0 ? `<div class="tt-tags" aria-label="感知设备类型">
            ${road.facilities.map(f=>`<span class="tt-tag" style="background:#fff7e6;color:#fa8c16;">${f}</span>`).join('')}
        </div>` : ''}
    `;
    mapTooltip.classList.add('visible');

    const midLat = (road.points[0].lat + road.points[1].lat) / 2;
    const midLng = (road.points[0].lng + road.points[1].lng) / 2;
    const point = map.latLngToContainerPoint([midLat, midLng]);
    const tipX = Math.min(point.x + 20, mapArea.clientWidth - 300);
    const tipY = Math.max(10, point.y - 120);
    mapTooltip.style.left = tipX + 'px';
    mapTooltip.style.top = tipY + 'px';
}

function closeTooltip() {
    mapTooltip.classList.remove('visible');
    selectedRoadId = null;
    selectedFenceId = null;
    buildRoadPolylines();
    buildFencePolygons();
    renderResourceList();
}

function switchResourceTab(tab) {
    activeResourceTab = tab;
    selectedRoadId = null;
    selectedFenceId = null;
    mapTooltip.classList.remove('visible');
    document.getElementById('roadTab').classList.toggle('active', tab === 'road');
    document.getElementById('fenceTab').classList.toggle('active', tab === 'fence');
    document.getElementById('roadTab').setAttribute('aria-selected', tab === 'road');
    document.getElementById('fenceTab').setAttribute('aria-selected', tab === 'fence');
    document.getElementById('districtFilterSection').style.display = tab === 'road' ? 'block' : 'none';
    document.getElementById('roadFilterFields').style.display = tab === 'road' ? 'block' : 'none';
    document.getElementById('fenceFilterFields').style.display = tab === 'fence' ? 'block' : 'none';
    document.getElementById('filterToggle').textContent = '展开筛选 ▾';
    document.getElementById('filterCollapse').style.display = 'none';
    searchInput.placeholder = tab === 'road' ? '搜索道路名称 / 编号...' : '搜索围栏名称 / 编号...';
    getLayerLegend();
    buildRoadPolylines();
    buildFencePolygons();
    renderResourceList();
}

function toggleFenceVisibility(e) {
    if (e) e.stopPropagation();
    fenceVisible = !fenceVisible;
    document.getElementById('fenceToggle').classList.toggle('active', fenceVisible);
    buildFencePolygons();
    getLayerLegend();
}

function applyFenceFilters() {
    fenceFilters.status = document.getElementById('filterFenceStatus').value;
    fenceFilters.fenceType = document.getElementById('filterFenceType').value;
    selectedFenceId = null;
    mapTooltip.classList.remove('visible');
    buildFencePolygons();
    renderResourceList();
}

function resetFenceFilters() {
    fenceFilters = { status:'all', fenceType:'all' };
    document.getElementById('filterFenceStatus').value = 'all';
    document.getElementById('filterFenceType').value = 'all';
    selectedFenceId = null;
    mapTooltip.classList.remove('visible');
    buildFencePolygons();
    renderResourceList();
}

// ==================== 筛选交互（下拉多选） ====================
function toggleMultiSelect(trigger) {
    const ms = trigger.parentElement;
    const dropdown = ms.querySelector('.ms-dropdown');
    const isOpen = dropdown.classList.contains('show');
    document.querySelectorAll('.ms-dropdown.show').forEach(d => {
        d.classList.remove('show');
        d.parentElement.querySelector('.ms-trigger').classList.remove('open');
    });
    if (!isOpen) {
        dropdown.classList.add('show');
        trigger.classList.add('open');
    }
}

function onMultiSelectChange(checkbox) {
    const ms = checkbox.closest('.multi-select');
    const filterType = ms.dataset.filter;
    const allCheckbox = ms.querySelector('input[value="all"]');
    const value = checkbox.value;
    const arr = filters[filterType];

    if (value === 'all') {
        if (checkbox.checked) {
            ms.querySelectorAll('input:not([value="all"])').forEach(c => c.checked = false);
            filters[filterType] = ['all'];
        } else {
            checkbox.checked = true;
            return;
        }
    } else {
        if (checkbox.checked) {
            const allIdx = arr.indexOf('all');
            if (allIdx >= 0) { arr.splice(allIdx, 1); allCheckbox.checked = false; }
            if (!arr.includes(value)) arr.push(value);
        } else {
            const idx = arr.indexOf(value);
            if (idx >= 0) arr.splice(idx, 1);
            if (arr.length === 0) { arr.push('all'); allCheckbox.checked = true; }
        }
    }
    updateMsTriggerText(ms);
    applyFilters();
}

function updateMsTriggerText(ms) {
    const arr = filters[ms.dataset.filter];
    ms.querySelector('.ms-text').textContent = arr.includes('all') ? '全部' : arr.join('、');
}

function applyFilters() {
    filters.district = document.getElementById('filterDistrict').value;
    selectedRoadId = null;
    selectedFenceId = null;
    mapTooltip.classList.remove('visible');
    buildRoadPolylines();
    buildFencePolygons();
    renderResourceList();
}

function resetAllFilters() {
    filters = { district: 'all', bizType: ['all'], facility: ['all'], status: ['all'], roadType: ['all'], adLevel: ['all'] };
    document.getElementById('filterDistrict').value = 'all';
    document.querySelectorAll('.multi-select').forEach(ms => {
        ms.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
        const allCb = ms.querySelector('input[value="all"]');
        if (allCb) allCb.checked = true;
        ms.querySelector('.ms-text').textContent = '全部';
    });
    selectedRoadId = null;
    selectedFenceId = null;
    mapTooltip.classList.remove('visible');
    searchInput.value = '';
    searchResults.classList.remove('show');
    buildRoadPolylines();
    buildFencePolygons();
    renderResourceList();
}

function toggleFilters() {
    var collapse = document.getElementById('filterCollapse');
    var toggle = document.getElementById('filterToggle');
    var isHidden = collapse.style.display === 'none';
    if (isHidden) {
        collapse.style.display = 'block';
        toggle.textContent = '收起筛选 ▴';
    } else {
        collapse.style.display = 'none';
        toggle.textContent = '展开筛选 ▾';
    }
}

// ==================== 搜索 ====================
function handleSearchInput(val) {
    if (!val || val.trim() === '') {
        searchResults.classList.remove('show');
        return;
    }
    const q = val.toLowerCase().trim();
    const matched = activeResourceTab === 'road' ? roadData.filter(r => r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q)) : fenceData.filter(f => f.name.toLowerCase().includes(q) || f.id.toLowerCase().includes(q));
    if (matched.length > 0) {
        let html = '';
        matched.forEach(r => {
            const isFence = activeResourceTab === 'fence';
            html += `<div class="search-result-item" onclick="${isFence ? `searchSelectFence('${r.id}')` : `searchSelectRoad('${r.id}')`}"><div class="name">${r.name}</div><div class="detail">${r.id} · ${r.district} · ${isFence ? r.fenceType : r.level}</div></div>`;
        });
        searchResults.innerHTML = html;
        searchResults.classList.add('show');
    } else {
        searchResults.innerHTML =
            `<div style="padding:10px 14px;font-size:12px;color:#999;">未找到匹配${activeResourceTab === 'fence' ? '电子围栏' : '道路'}</div>`;
        searchResults.classList.add('show');
    }
}

function searchSelectRoad(id) {
    searchResults.classList.remove('show');
    searchInput.value = roadData.find(r => r.id === id)?.name || '';
    selectRoad(id);
}

function searchSelectFence(id) {
    searchResults.classList.remove('show');
    searchInput.value = fenceData.find(f => f.id === id)?.name || '';
    selectFence(id);
}

// ==================== 图层切换 ====================
document.getElementById('layerTabs').addEventListener('click', (e) => {
    if (e.target.classList.contains('layer-tab')) {
        document.querySelectorAll('.layer-tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        activeLayer = e.target.dataset.layer;
        selectedRoadId = null;
        mapTooltip.classList.remove('visible');
        getLayerLegend();
        buildRoadPolylines();
        buildFencePolygons();
        renderResourceList();
    }
});

// ==================== 地图空白区域点击取消选中 ====================
map.on('click', function() {
    closeTooltip();
});

// ==================== 外部点击关闭搜索与下拉 ====================
document.addEventListener('click', (e) => {
    if (!searchResults.contains(e.target) && e.target !== searchInput) {
        searchResults.classList.remove('show');
    }
    if (!e.target.closest('.multi-select')) {
        document.querySelectorAll('.ms-dropdown.show').forEach(d => {
            d.classList.remove('show');
            d.parentElement.querySelector('.ms-trigger').classList.remove('open');
        });
    }
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTooltip(); });

// ==================== 窗口resize ====================
window.addEventListener('resize', function() {
    map.invalidateSize();
});

// ==================== 初始化 ====================
function init() {
    getLayerLegend();
    buildRoadPolylines();
    buildFencePolygons();
    roadTabCount.textContent = roadData.length;
    fenceTabCount.textContent = fenceData.length;
    renderResourceList();
}

init();

console.log('🗺️ 道路与电子围栏资源可视化已就绪 | Leaflet + OpenStreetMap | 道路: ' + roadData.length + ' 条 | 围栏: ' + fenceData.length + ' 条');
</script>
<script src="../../common.js"></script>
</body>
</html>
