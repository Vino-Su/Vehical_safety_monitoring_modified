var RTE_TPL='<div class="rte-toolbar"><button type="button" onclick="rteExec(\'bold\')" title="加粗"><b>B</b></button><button type="button" onclick="rteExec(\'italic\')" title="斜体"><i>I</i></button><button type="button" onclick="rteExec(\'underline\')" title="下划线"><u>U</u></button><span class="rte-sep"></span><button type="button" onclick="rteExec(\'formatBlock\',\'h3\')" title="标题">H</button><button type="button" onclick="rteExec(\'formatBlock\',\'p\')" title="正文">P</button><span class="rte-sep"></span><button type="button" onclick="rteExec(\'insertUnorderedList\')" title="无序列表">•</button><button type="button" onclick="rteExec(\'insertOrderedList\')" title="有序列表">1.</button></div><div class="rte-editor" contenteditable="true" data-placeholder="请输入正文内容..."></div>';
function rteExec(cmd,val){
  document.execCommand(cmd,false,val||null);
  var sel=window.getSelection();
  if(sel.rangeCount>0){
    var ed=sel.anchorNode;while(ed&&!ed.classList.contains('rte-editor'))ed=ed.parentNode;
    if(ed)ed.focus();
  }
}
const PAGE_ID='notice';
function switchTab(el,tabId){
  document.querySelectorAll('.ant-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  ['tab-all','tab-draft','tab-pending','tab-returned','tab-published','tab-removed'].forEach(function(id){
    document.getElementById(id).style.display=id===tabId?'':'none';
  });
  currentTab=tabId.replace('tab-','');
  if(pagers[currentTab])pagers[currentTab].reset();
  renderTable(currentTab);
}

var pagers={};var currentTab='all';
function typeTag(d){return '<span class="ant-tag '+d.typeCls+'">'+d.typeLabel+'</span>';}
function statusTag(d){return '<span class="ant-tag '+d.statusCls+'">'+d.statusLabel+'</span>';}
function buildOps(d){
  if(d.status==='draft')return '<button class="ant-btn-link" onclick="openNoticeModal()">编辑</button><button class="ant-btn-link danger" onclick="confirmDelete(\''+d.id+'\')">删除</button>';
  if(d.status==='pending')return '<button class="ant-btn-link" onclick="openDetailModal(\''+d.id+'\')">查看</button><button class="ant-btn-link" onclick="openReviewModal(\''+d.id+'\')">审核</button><button class="ant-btn-link danger" onclick="confirmWithdraw(\''+d.id+'\')">撤回</button>';
  if(d.status==='returned')return '<button class="ant-btn-link" onclick="openDetailModal(\''+d.id+'\')">查看</button><button class="ant-btn-link" onclick="openNoticeModal()">编辑</button><button class="ant-btn-link danger" onclick="confirmDelete(\''+d.id+'\')">删除</button>';
  if(d.status==='removed')return '<button class="ant-btn-link" onclick="openDetailModal(\''+d.id+'\')">查看</button>';
  return '<button class="ant-btn-link" onclick="openDetailModal(\''+d.id+'\')">查看</button><button class="ant-btn-link" style="color:#faad14" onclick="openNoticeModal()">编辑</button><button class="ant-btn-link danger" onclick="confirmRemove(\''+d.id+'\')">下架</button>';
}
function buildRow(d,tabKey){
  var ops=buildOps(d);
  return '<tr><td>'+d.id+'</td><td>'+d.summary+'</td><td>'+typeTag(d)+'</td><td>'+d.org+'</td><td>'+d.creator+'</td><td>'+d.audience+'</td><td>'+statusTag(d)+'</td><td>'+d.time+'</td><td class="flex gap-1">'+ops+'</td></tr>';
}
function getCurrentUser(){
  var m=window.location.search.match(/[?&]role=([a-z]+)/);
  var role=(m&&m[1])||localStorage.getItem('platform_role')||'admin';
  return {admin:'管理员',enterprise:'A公司',public:'公众访客'}[role]||'管理员';
}
function renderTable(tabKey){
  var cfg=tabConfig[tabKey];var data=noticeData.filter(cfg.filter);var pager=pagers[tabKey];
  var cp=pager?pager.getCurrentPage():1;var ps=pager?pager.getPageSize():10;
  var start=(cp-1)*ps;var pd=data.slice(start,start+ps);var h='';
  pd.forEach(function(d){h+=buildRow(d,tabKey);});
  if(h==='')h='<tr><td colspan="'+cfg.cols+'" style="text-align:center;color:#00000073;padding:24px">暂无数据</td></tr>';
  document.getElementById(cfg.tbody).innerHTML=h;
  if(pager)pager.setTotal(data.length);
}
function openDetailModal(id){
  var d=noticeData.find(function(x){return x.id===id;});if(!d)return;
  var html='<div class="ant-descriptions"><div class="ant-descriptions-row"><div class="ant-descriptions-label">通知公告编号</div><div class="ant-descriptions-value">'+d.id+'</div><div class="ant-descriptions-label">信息类型</div><div class="ant-descriptions-value">'+typeTag(d)+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">标题</div><div class="ant-descriptions-value" style="flex:1">'+d.summary+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">发布机构</div><div class="ant-descriptions-value">'+d.org+'</div><div class="ant-descriptions-label">创建人</div><div class="ant-descriptions-value">'+d.creator+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">目标受众</div><div class="ant-descriptions-value">'+d.audience+'</div><div class="ant-descriptions-label">发布状态</div><div class="ant-descriptions-value">'+statusTag(d)+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">最后修改时间</div><div class="ant-descriptions-value">'+d.time+'</div></div></div><h4 class="text-sm font-semibold text-[#000000d9] mb-2 mt-4 pb-2 border-b border-[#f0f0f0]">正文内容</h4><div class="p-3 bg-[#fafafa] rounded text-sm leading-relaxed">此处展示「'+d.typeLabel+'」的正文详细内容，支持富文本格式（加粗、斜体、列表、标题等）。</div>'+buildTimeline(d);
  var reviewBtn=d.status==='pending'?'<button class="ant-btn ant-btn-primary" onclick="openReviewModal(\''+d.id+'\')">审核</button>':'';
  openModal('信息详情 - '+id,html,{wide:true,footer:'<button class="ant-btn" onclick="closeModal()">关闭</button>'+reviewBtn});
}
function escapeHtml(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function statusLabelTag(label){var cls={草稿:'ant-tag-default',草稿箱:'ant-tag-default',待审核:'ant-tag-processing',已退回:'ant-tag-error',已发布:'ant-tag-success',已下架:'ant-tag-default'}[label]||'ant-tag-default';return '<span class="ant-tag '+cls+'">'+label+'</span>';}
function buildTimeline(d){var history=(noticeHistory[d.id]||[]).slice().reverse();var html='<h4 class="text-sm font-semibold text-[#000000d9] mb-2 mt-4 pb-2 border-b border-[#f0f0f0]">发布流程时间线</h4><div class="notice-timeline">';history.forEach(function(item){html+='<div class="notice-timeline-item"><span class="notice-timeline-dot"></span><div class="flex items-center gap-2 leading-5"><span class="text-sm font-medium text-[#000000d9]">'+item.action+'</span>'+statusLabelTag(item.status)+'</div><div class="text-xs text-[#00000073] mt-1">'+item.operator+'　'+item.time+'</div><div class="text-sm text-[#000000a6] mt-1">审核意见：'+escapeHtml(item.opinion||'—').replace(/\n/g,'<br>')+'</div></div>';});return html+'</div>';}
function formatNow(){var now=new Date();var pad=function(v){return v<10?'0'+v:v;};return now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());}
function appendHistory(d,action,opinion){if(!noticeHistory[d.id])noticeHistory[d.id]=[];noticeHistory[d.id].push({operator:getCurrentUser(),time:formatNow(),action:action,opinion:opinion||'—',status:d.statusLabel});d.time=formatNow();}
function openReviewModal(id){var d=noticeData.find(function(x){return x.id===id;});if(!d)return;var html='<div class="ant-descriptions"><div class="ant-descriptions-row"><div class="ant-descriptions-label">通知公告编号</div><div class="ant-descriptions-value">'+d.id+'</div><div class="ant-descriptions-label">信息类型</div><div class="ant-descriptions-value">'+typeTag(d)+'</div></div><div class="ant-descriptions-row"><div class="ant-descriptions-label">标题</div><div class="ant-descriptions-value" style="flex:1">'+d.summary+'</div></div></div><div class="ant-form-item mt-5"><div class="ant-form-label"><span class="required">*</span>审核结论</div><div class="ant-form-control"><label class="mr-6"><input type="radio" name="auditResult" value="approved" onchange="toggleAuditOpinionRequired()"> 通过</label><label><input type="radio" name="auditResult" value="returned" onchange="toggleAuditOpinionRequired()"> 退回</label></div></div><div class="ant-form-item"><div class="ant-form-label"><span id="auditOpinionRequired" style="display:none" class="required">*</span>审核意见</div><div class="ant-form-control"><textarea id="auditOpinion" class="ant-input" rows="4" maxlength="500" placeholder="请输入审核意见"></textarea><div id="auditOpinionError" class="text-xs text-[#ff4d4f] mt-1" style="display:none">退回时请填写审核意见</div></div></div>';openModal('信息审核 - '+id,html,{wide:true,footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="submitReview(\''+id+'\')">确认审核</button>'});}
function toggleAuditOpinionRequired(){var returned=document.querySelector('input[name="auditResult"]:checked')&&document.querySelector('input[name="auditResult"]:checked').value==='returned';document.getElementById('auditOpinionRequired').style.display=returned?'':'none';if(!returned)document.getElementById('auditOpinionError').style.display='none';}
function submitReview(id){var selected=document.querySelector('input[name="auditResult"]:checked');var opinion=document.getElementById('auditOpinion').value.trim();var error=document.getElementById('auditOpinionError');if(!selected){error.textContent='请选择审核结论';error.style.display='';return;}if(selected.value==='returned'&&!opinion){error.textContent='退回时请填写审核意见';error.style.display='';return;}var d=noticeData.find(function(x){return x.id===id;});if(!d)return;d.status=selected.value==='approved'?'published':'returned';d.statusLabel=selected.value==='approved'?'已发布':'已退回';d.statusCls=selected.value==='approved'?'ant-tag-success':'ant-tag-error';appendHistory(d,selected.value==='approved'?'审核通过并发布':'审核退回',opinion);closeModal();renderTable(currentTab);showNoticeToast(selected.value==='approved'?'审核通过，信息已发布':'审核已退回');}
function confirmWithdraw(id){openModal('撤回确认','<p class="text-sm text-[#000000d9]">确认撤回该审核申请吗？撤回后信息将返回草稿箱，可重新编辑后再次提交审核。</p>',{footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="doWithdraw(\''+id+'\')">确认撤回</button>'});}
function doWithdraw(id){var i=noticeData.findIndex(function(x){return x.id===id;});if(i>-1){noticeData[i].status='draft';noticeData[i].statusLabel='草稿箱';noticeData[i].statusCls='ant-tag-default';appendHistory(noticeData[i],'撤回审核申请','—');}closeModal();renderTable(currentTab);showNoticeToast('已撤回至草稿箱');}
function confirmRemove(id){openModal('下架确认','<p class="text-sm text-[#000000d9]">确认下架该已发布信息吗？下架后该信息不再对外展示，并进入已下架列表。</p>',{footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="doRemove(\''+id+'\')">确认下架</button>'});}
function doRemove(id){var i=noticeData.findIndex(function(x){return x.id===id;});if(i>-1){noticeData[i].status='removed';noticeData[i].statusLabel='已下架';noticeData[i].statusCls='ant-tag-default';appendHistory(noticeData[i],'下架信息','—');}closeModal();renderTable(currentTab);showNoticeToast('信息已下架');}
function confirmDelete(id){openModal('删除确认','<p class="text-sm text-[#000000d9]">确认删除该信息吗？删除后不可恢复。</p>',{footer:'<button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="doDelete(\''+id+'\')" style="background:#ff4d4f;border-color:#ff4d4f">确认删除</button>'});}
function doDelete(id){noticeData=noticeData.filter(function(x){return x.id!==id;});closeModal();renderTable(currentTab);showNoticeToast('已删除');}
function showNoticeToast(msg){var t=document.createElement('div');t.style.cssText='position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:10000;background:#52c41a;color:#fff;padding:10px 24px;border-radius:6px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15)';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(function(){t.remove();},300);},1500);}
document.addEventListener('DOMContentLoaded',function(){['all','draft','pending','returned','published','removed'].forEach(function(tabKey){var cfg=tabConfig[tabKey];pagers[tabKey]=new Pagination({container:cfg.bar,pageSize:10,pageSizeOptions:[10,20,50,100],onPageChange:function(){renderTable(currentTab);},onPageSizeChange:function(){if(pagers[currentTab])pagers[currentTab].reset();renderTable(currentTab);}});});switchTab(document.querySelector('.ant-tab'),'tab-all');});

function toggleInfoFields(type){
  document.getElementById('fields-announce').style.display=type==='announce'?'':'none';
  document.getElementById('fields-guide').style.display=type==='guide'?'':'none';
  document.getElementById('fields-report').style.display=type==='report'?'':'none';
}
