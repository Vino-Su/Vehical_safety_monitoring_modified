tyle>

        <div class="filter-item"><label>有效期</label><div class="ant-select" id="fValid" onclick="toggleDropdown('validDropdown')">全部<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></div><div class="dropdown-panel" id="validDropdown" style="display:none;position:absolute;z-index:1000;background:#fff;border:1px solid #d9d9d9;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.08);padding:4px 0;min-width:120px"><div style="padding:5px 12px;cursor:pointer;font-size:13px" onclick="selectValid('all','全部')">全部</div><div style="padding:5px 12px;cursor:pointer;font-size:13px" onclick="selectValid('valid','有效')">有效</div><div style="padding:5px 12px;cursor:pointer;font-size:13px" onclick="selectValid('expired','已过期')">已过期</div><div style="padding:5px 12px;cursor:pointer;font-size:13px" onclick="selectValid('not_started','未生效')">未生效</div></div></div>
        <div class="flex gap-2 items-end"><button class="ant-btn ant-btn-primary" onclick="renderTable()">查询</button><button class="ant-btn" onclick="resetFilter()">重置</button></div>
      </div></div>
      <div class="ant-table-wrapper">
        <div style="overflow-x:auto"><table class="ant-table"><thead><tr><th class="col-code">申请编号</th><th>申请类型</th><th>商业化试点类型</th><th class="col-code">原申请编号</th><th class="col-num">运营车辆数</th><th>申请状态</th><th class="col-code">有效期起止</th><th class="col-code">申请时间</th><th class="col-action">操作</th></tr></thead><tbody id="mainTbody"></tbody></table></div>

<script>
const PAGE_ID='demo-operate';
var pager;
var statusMap={draft:{label:'草稿',cls:'ant-tag-default'},pending_review:{label:'待初审',cls:'ant-tag-processing'},pending_committee:{label:'待专班审核',cls:'ant-tag-processing'},pending_expert:{label:'待专家评审',cls:'ant-tag-processing'},pending_meeting:{label:'待专题会审议',cls:'ant-tag-processing'},pending_committee_confirm:{label:'待专班审核确认',cls:'ant-tag-processing'},rejected:{label:'已退回',cls:'ant-tag-error'},withdrawn:{label:'已撤回',cls:'ant-tag-default'},pending_plate:{label:'待上传牌照',cls:'ant-tag-warning'},active:{label:'已生效',cls:'ant-tag-success'},expired:{label:'已过期',cls:'ant-tag-default'},changed:{label:'已变更',cls:'ant-tag-blue'},terminated:{label:'已终止',cls:'ant-tag-error'}};
var typeMap={initial:{label:'初次申请'},renewal:{label:'延期申请'},change:{label:'变更申请'},add_vehicle:{label:'新增相同配置车辆'}};
var operateTypeMap={passenger:{label:'载人商业化试点'},cargo:{label:'载物商业化试点'},special:{label:'特种作业商业化试点'}};
var appData=[
  {id:'DO202604001',type:'initial',operateType:'passenger',company:'A公司',origId:'-',vehicleCount:2,roadCount:3,status:'pending_review',time:'2026-04-10 09:12:33',validFrom:'2026-04-15',validTo:'2026-10-15'},
  {id:'DO202604002',type:'renewal',operateType:'cargo',company:'B公司',origId:'DO202603001',vehicleCount:1,roadCount:2,status:'active',time:'2026-04-05 10:25:18',validFrom:'2026-05-01',validTo:'2026-10-05'},
  {id:'DO202604003',type:'change',operateType:'passenger',company:'D公司',origId:'DO202603002',vehicleCount:1,roadCount:1,status:'rejected',time:'2026-04-08 14:08:42',validFrom:'-',validTo:'-'},
  {id:'DO202604004',type:'add_vehicle',operateType:'cargo',company:'A公司',origId:'DO202604001',vehicleCount:1,roadCount:2,status:'active',time:'2026-04-12 11:36:55',validFrom:'2026-04-20',validTo:'2026-10-20'},
  {id:'DO202604005',type:'initial',operateType:'passenger',company:'D公司',origId:'-',vehicleCount:1,roadCount:1,status:'pending_expert',time:'2026-04-24 16:42:11',validFrom:'-',validTo:'-'},
  {id:'DO202604006',type:'initial',operateType:'special',company:'上海E公司',origId:'-',vehicleCount:1,roadCount:2,status:'pending_plate',time:'2026-04-25 09:55:24',validFrom:'2026-05-01',validTo:'2026-11-01'},
  {id:'DO202604007',type:'initial',operateType:'passenger',company:'G公司',origId:'-',vehicleCount:1,roadCount:2,status:'active',time:'2026-04-28 13:18:07',validFrom:'2026-05-01',validTo:'2026-11-01'},
  {id:'DO202603001',type:'initial',operateType:'cargo',company:'B公司',origId:'-',vehicleCount:1,roadCount:2,status:'expired',time:'2026-03-01 08:30:12',validFrom:'2026-03-15',validTo:'2026-04-30'},
  {id:'DO202603002',type:'initial',operateType:'passenger',company:'D公司',origId:'-',vehicleCount:1,roadCount:1,status:'active',time:'2026-03-10 15:21:48',validFrom:'2026-03-20',validTo:'2026-09-20'},
  {id:'DO202605001',type:'initial',operateType:'passenger',company:'J公司',origId:'-',vehicleCount:1,roadCount:1,status:'pending_committee',time:'2026-05-01 10:42:36',validFrom:'-',validTo:'-'},
  {id:'DO202605002',type:'initial',operateType:'cargo',company:'S公司',origId:'-',vehicleCount:1,roadCount:1,status:'draft',time:'2026-05-08 11:14:27',validFrom:'-',validTo:'-'},
  {id:'DO202604008',type:'initial',operateType:'special',company:'J公司',origId:'-',vehicleCount:1,roadCount:1,status:'terminated',time:'2026-04-19 12:48:15',validFrom:'2026-05-01',validTo:'2026-11-01'},
  {id:'DO202605003',type:'initial',operateType:'passenger',company:'T品牌',origId:'-',vehicleCount:1,roadCount:2,status:'active',time:'2025-11-20 10:20:00',validFrom:'2025-12-01',validTo:'2026-06-30'},
  {id:'DO202605004',type:'initial',operateType:'passenger',company:'M公司',origId:'-',vehicleCount:1,roadCount:1,status:'changed',time:'2026-03-10 16:12:44',validFrom:'2026-03-20',validTo:'2026-07-15'},
  {id:'DO202605005',type:'change',operateType:'passenger',company:'M公司',origId:'DO202605004',vehicleCount:1,roadCount:2,status:'active',time:'2026-05-12 09:48:31',validFrom:'2026-05-20',validTo:'2026-11-20'}
];
function getOps(d){var ops=['<button class="ant-btn-link" onclick="openDetail(\''+d.id+'\')">查看</button>'];if(d.status==='draft')ops.push('<button class="ant-btn-link">编辑</button>','<button class="ant-btn-link">提交</button>');if(d.status==='rejected')ops.push('<button class="ant-btn-link">重新提交</button>');if(d.status==='pending_review'||d.status==='pending_expert'||d.status==='pending_committee_confirm')ops.push('<button class="ant-btn-link">撤回</button>');if(d.status==='active'){ops.push('<button class="ant-btn-link" onclick="openReportSubmitPage(\''+d.id+'\')">报告提交</button>');var hasPendingDerive=appData.some(function(a){return a.origId===d.id&&['draft','pending_review','pending_committee','pending_committee_confirm','pending_expert','pending_meeting','pending_plate'].indexOf(a.status)>-1;});var dAttr=hasPendingDerive?' disabled style="color:#00000040;cursor:not-allowed" title="存在进行中的派生申请，延期/变更/新增车辆三类互斥（见PRD 4.14）"':'';var cRenew=hasPendingDerive?'':('onclick="openRenewalPage(\''+d.id+'\')"');var cChange=hasPendingDerive?'':('onclick="openChangePage(\''+d.id+'\')"');var cAddV=hasPendingDerive?'':('onclick="openAddVehiclePage(\''+d.id+'\')"');var vt=new Date(d.validTo);var nm=new Date();var tm=new Date(nm.getTime()+60*24*60*60*1000);if(vt<=tm)ops.push('<button class="ant-btn-link" '+cRenew+dAttr+'>延期</button>');ops.push('<button class="ant-btn-link" '+cChange+dAttr+'>变更</button>','<button class="ant-btn-link" '+cAddV+dAttr+'>新增相同配置车辆</button>');}return ops.join(' ');}

function toggleMultiSelect(id){var panel=document.getElementById(id+'Panel');panel.classList.toggle('show');}
function getMultiSelectValues(id){var cbs=document.querySelectorAll('#'+id+'Panel input[type=checkbox]');var vals=[];cbs.forEach(function(cb){if(cb.checked)vals.push(cb.value);});return vals;}
function updateMultiSelectLabel(id){var vals=getMultiSelectValues(id);var label=document.getElementById(id+'Label');label.textContent=vals.length===0?'全部':vals.length+'项已选';label.style.color=vals.length===0?'#00000073':'#1677ff';}
var currentValidFilter='all';
function toggleDropdown(id){var el=document.getElementById(id);el.style.display=el.style.display==='none'?'block':'none';}
function selectValid(val,label){currentValidFilter=val;var sel=document.getElementById('fValid');sel.innerHTML=label+'<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>';document.getElementById('validDropdown').style.display='none';}
document.addEventListener('click',function(e){document.querySelectorAll('.multi-select').forEach(function(ms){if(!ms.contains(e.target)){ms.querySelector('.multi-select-panel').classList.remove('show');}});if(!e.target.closest('#fValid')&&!e.target.closest('#validDropdown')){var vd=document.getElementById('validDropdown');if(vd)vd.style.display='none';}});
document.addEventListener('change',function(e){if(e.target.closest('.multi-select-panel')){var panel=e.target.closest('.multi-select-panel');var ms=panel.closest('.multi-select');updateMultiSelectLabel(ms.id);}});

function renderTable(){var data=[].concat(appData);var statusVals=getMultiSelectValues('msStatus');if(statusVals.length>0)data=data.filter(function(d){return statusVals.indexOf(d.status)>-1;});if(currentValidFilter==='valid'){data=data.filter(function(d){return d.validFrom!=='-'&&d.validTo!=='-'&&new Date(d.validTo)>=new Date()&&new Date(d.validFrom)<=new Date();});}else if(currentValidFilter==='expired'){data=data.filter(function(d){return d.validTo!=='-'&&new Date(d.validTo)<new Date();});}else if(currentValidFilter==='not_started'){data=data.filter(function(d){return d.validFrom!=='-'&&new Date(d.validFrom)>new Date();});}var total=data.length;var cp=pager?pager.getCurrentPage():1;var ps=pager?pager.getPageSize():10;var start=(cp-1)*ps;var pd=data.slice(start,start+ps);var h='';pd.forEach(function(d){var st=statusMap[d.status]||statusMap.draft;var ty=typeMap[d.type]||typeMap.initial;var ot=operateTypeMap[d.operateType]||{label:'-'};var vr=d.validFrom!=='-'?d.validFrom+' 至 '+d.validTo:'-';h+='<tr><td class="col-code">'+d.id+'</td><td><span class="ant-tag ant-tag-default">'+ty.label+'</span></td><td><span class="ant-tag ant-tag-processing">'+ot.label+'</span></td><td class="col-code">'+(d.origId!=='-'?'<button class="ant-btn-link" onclick="openDetail(\''+d.origId+'\')">'+d.origId+'</button>':'-')+'</td><td class="col-num">'+d.vehicleCount+'</td><td><span class="ant-tag '+st.cls+'">'+st.label+'</span></td><td class="col-code text-xs">'+vr+'</td><td class="col-code">'+d.time+'</td><td class="col-action flex gap-1 flex-wrap">'+getOps(d)+'</td></tr>';});document.getElementById('mainTbody').innerHTML=h;if(pager)pager.setTotal(total);}

function renderFLH(logs){var h='<div class="space-y-3">';logs.forEach(function(l,i){var hn=i<logs.length-1;var bs=hn?'border-left:2px solid '+l.color+';margin-left:5px;padding-left:12px':'margin-left:17px;padding-left:0';h+='<div class="relative pb-3" style="'+bs+'"><div class="absolute w-3 h-3 rounded-full flex items-center justify-center text-[8px] text-white font-bold mt-1" style="left:-7px;top:0;background:'+l.color+'">'+l.dot+'</div><div class="min-w-0"><div class="flex items-center justify-between mb-2"><span class="text-sm font-medium text-[#000000d9]">'+l.title+'</span><span class="ant-tag '+l.tagCls+' text-[10px]">'+l.status+'</span></div><div class="text-xs text-[#00000073] space-y-1"><div><span class="text-[#00000040]">处理人：</span>'+l.handler+'</div><div><span class="text-[#00000040]">处理时间：</span>'+l.time+'</div>';if(l.opinion)h+='<div class="whitespace-pre-line mt-1.5 p-2 bg-[#fafafa] rounded"><span class="text-[#00000040]">处理意见：</span>'+l.opinion+'</div>';h+='</div></div></div>';});return h+'</div>';}

function getRelatedVersions(id){var current=appData.find(function(a){return a.id===id;});if(!current)return [];var result=[];var parentId=current.origId&&current.origId!=='-'?current.origId:null;if(parentId){var parent=appData.find(function(a){return a.id===parentId;});if(parent){result.push({id:parent.id,time:parent.time,typeLabel:typeMap[parent.type]?typeMap[parent.type].label:parent.type,company:parent.company,status:parent.status,statusLabel:statusMap[parent.status]?statusMap[parent.status].label:parent.status,validFrom:parent.validFrom,validTo:parent.validTo,relation:'parent'});}}result.push({id:current.id,time:current.time,typeLabel:typeMap[current.type]?typeMap[current.type].label:current.type,company:current.company,status:current.status,statusLabel:statusMap[current.status]?statusMap[current.status].label:current.status,validFrom:current.validFrom,validTo:current.validTo,relation:current.type==='renewal'?'renewal':current.type==='change'?'change':current.type==='add_vehicle'?'add_vehicle':'current',parentId:parentId});var children=appData.filter(function(a){return a.origId===id;});children.forEach(function(c){result.push({id:c.id,time:c.time,typeLabel:typeMap[c.type]?typeMap[c.type].label:c.type,company:c.company,status:c.status,statusLabel:statusMap[c.status]?statusMap[c.status].label:c.status,validFrom:c.validFrom,validTo:c.validTo,relation:c.type==='renewal'?'renewal':c.type==='change'?'change':'add_vehicle',parentId:id});});return result;}

function operateEscape(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function operateInfo(original){return '<span class="material-info"><button type="button" class="material-info-btn" aria-label="查看材料原文" onclick="return toggleOperateInfo(event,this)">i</button><span class="material-tooltip">'+operateEscape(original)+'</span></span>';}
function toggleOperateInfo(event,button){event.preventDefault();event.stopPropagation();var wrap=button.parentNode;var wasOpen=wrap.classList.contains('open');var all=document.querySelectorAll('.material-info.open');for(var i=0;i<all.length;i++)all[i].classList.remove('open');if(!wasOpen)wrap.classList.add('open');return false;}
document.addEventListener('click',function(event){if(!event.target.closest('.material-info')){var all=document.querySelectorAll('.material-info.open');for(var i=0;i<all.length;i++)all[i].classList.remove('open');}});

function operateFileInputId(scope,key){return 'operate-file-'+scope+'-'+key;}
function operateUpload(scope,key){var input=document.getElementById(operateFileInputId(scope,key));if(input)input.click();}
function operateFileChanged(scope,key,input){if(!input.files||!input.files.length)return;var row=input.closest('.attachment-row');if(!row)return;row.dataset.uploaded='1';row.dataset.fileName=input.files[0].name;var actions=row.querySelector('.attachment-file-actions');actions.innerHTML='<input id="'+operateFileInputId(scope,key)+'" type="file" class="hidden" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" onchange="operateFileChanged(\''+scope+'\',\''+key+'\',this)"><span class="text-[#52c41a]">✓</span><span class="text-sm text-[#1677ff]">'+operateEscape(input.files[0].name)+'</span><button type="button" class="ant-btn-link ant-btn-sm" onclick="operateAttachmentAction(\''+scope+'\',\''+key+'\',\'preview\')">预览</button><button type="button" class="ant-btn-link ant-btn-sm" onclick="operateAttachmentAction(\''+scope+'\',\''+key+'\',\'download\')">下载</button><button type="button" class="ant-btn-link ant-btn-sm" onclick="operateUpload(\''+scope+'\',\''+key+'\')">替换</button>';}
function operateAttachmentAction(scope,key,action){var row=document.querySelector('.attachment-row[data-scope="'+scope+'"][data-key="'+key+'"]');var name=row&&row.dataset.fileName?row.dataset.fileName:'已关联原申请附件';showToast((action==='preview'?'已打开预览：':'已开始下载：')+name);}
function toggleOperatePersonArchive(scope){var panel=document.getElementById('operate-person-archive-'+scope);if(!panel)return false;var list=[];for(var i=0;i<selectedPersons.length;i++)list.push(personData[selectedPersons[i]]);if(!list.length)panel.innerHTML='<span class="text-xs text-[#8c8c8c]">请先在“商业化试点驾驶人（安全员）”中选择人员。</span>';else{var html='<div class="text-xs text-[#595959]" style="width:100%;padding:8px;background:#fafafa;border:1px solid #f0f0f0;border-radius:4px">';for(var j=0;j<list.length;j++)html+='<div>'+operateEscape(list[j].name)+'　'+operateEscape(list[j].unit)+'　'+operateEscape(list[j].idNo)+'</div>';panel.innerHTML=html;}panel.style.display=panel.style.display==='none'?'block':'none';return false;}
function operateRow(item,scope){var requirement=(item.required?'<span class="required">*</span>':'')+'<span class="attachment-no">'+operateEscape(item.label)+'：</span>'+operateEscape(item.name)+operateInfo(item.original);var note=item.note?'<div class="attachment-note">'+operateEscape(item.note)+'</div>':'';var input='<input id="'+operateFileInputId(scope,item.key)+'" type="file" class="hidden" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" onchange="operateFileChanged(\''+scope+'\',\''+item.key+'\',this)">';var action='';if(item.source==='company'){action='<span class="text-[#52c41a]">✓</span><span class="text-sm text-[#1677ff]">主体营业执照.pdf</span><span class="text-xs text-[#00000073]">自动关联企业档案</span><button type="button" class="ant-btn-link ant-btn-sm" onclick="operateAttachmentAction(\''+scope+'\',\''+item.key+'\',\'preview\')">预览</button><button type="button" class="ant-btn-link ant-btn-sm" onclick="operateAttachmentAction(\''+scope+'\',\''+item.key+'\',\'download\')">下载</button>';}
else if(item.source==='person'){action='<span class="text-[#52c41a]">✓</span><button type="button" class="ant-btn-link ant-btn-sm" onclick="return toggleOperatePersonArchive(\''+scope+'\')">查看已选人员档案</button><span class="text-xs text-[#00000073]">选择人员后自动关联</span><div id="operate-person-archive-'+scope+'" style="display:none;width:100%"></div>';}
else if(item.source==='detail-person'){action='<span class="text-[#52c41a]">✓</span><button type="button" class="ant-btn-link ant-btn-sm" onclick="showToast(\'已打开关联的驾驶人（安全员）档案\')">查看已选人员档案</button><span class="text-xs text-[#00000073]">已关联驾驶人（安全员）档案</span>';}
else if(item.source==='linked'){action='<span class="text-[#52c41a]">✓</span><span class="text-sm text-[#1677ff]">已关联原申请附件</span><button type="button" class="ant-btn-link ant-btn-sm" onclick="operateAttachmentAction(\''+scope+'\',\''+item.key+'\',\'preview\')">预览</button><button type="button" class="ant-btn-link ant-btn-sm" onclick="operateAttachmentAction(\''+scope+'\',\''+item.key+'\',\'download\')">下载</button>';}
else if(item.source==='uploaded'){action='<span class="text-[#52c41a]">✓</span><span class="text-sm text-[#1677ff]">'+operateEscape(item.file||item.name+'.pdf')+'</span><button type="button" class="ant-btn-link ant-btn-sm" onclick="operateAttachmentAction(\''+scope+'\',\''+item.key+'\',\'preview\')">预览</button><button type="button" class="ant-btn-link ant-btn-sm" onclick="operateAttachmentAction(\''+scope+'\',\''+item.key+'\',\'download\')">下载</button>';}
else{action=input+'<button type="button" class="ant-btn ant-btn-sm" onclick="operateUpload(\''+scope+'\',\''+item.key+'\')">上传文件</button><span class="text-xs '+(item.required?'text-[#ff4d4f]':'text-[#00000073]')+'">'+(item.required?'未上传文件':'选填')+'</span>';}
return '<div class="attachment-row" data-scope="'+scope+'" data-key="'+item.key+'" data-required="'+(item.required?'1':'0')+'" data-uploaded="'+(item.source?'1':'0')+'"><div class="attachment-name">'+requirement+'</div>'+note+'<div class="attachment-file-actions">'+action+'</div></div>';}
function operateGroup(title,items,scope){var rows='';for(var i=0;i<items.length;i++)rows+=operateRow(items[i],scope);return '<section class="attachment-group"><div class="attachment-group-title">'+operateEscape(title)+'</div>'+rows+'</section>';}
function linkedOperateItems(items,prefix){var linked=[];for(var i=0;i<items.length;i++){var copy={};for(var k in items[i])copy[k]=items[i][k];copy.key=prefix+'-'+copy.key;copy.source='linked';copy.required=false;linked.push(copy);}return linked;}
function initialOperateAttachmentHtml(scope){return operateGroup('附件1、附件9、附件10：申请文件',operateInitialFiles,scope)+operateGroup('附件11：申请材料',operateAppendix11,scope)+operateGroup('商业化试点安全保障方案',[operateSafetyPlan],scope);}
function operateAttachmentValidation(scope){var missing=[];var rows=document.querySelectorAll('.attachment-row[data-scope="'+scope+'"][data-required="1"]');for(var i=0;i<rows.length;i++){if(rows[i].dataset.uploaded!=='1'&&!rows[i].querySelector('.attachment-linked')&&!rows[i].querySelector('[id^="operate-person-archive"]'))missing.push(rows[i].querySelector('.attachment-name').innerText.replace(/\s+/g,' ').trim());}return missing;}

function getEarliestOperateInsuranceExpiry(){
  var earliest='';
  for(var i=0;i<selectedVehicles.length;i++){
    var vehicle=vehicleData[selectedVehicles[i]];
    if(vehicle&&vehicle.insuranceExpiry&&(!earliest||vehicle.insuranceExpiry<earliest))earliest=vehicle.insuranceExpiry;
  }
  return earliest;
}
function updateOperatePeriodHint(){
  var hint=document.getElementById('operateInsuranceHint');
  var start=document.getElementById('operateApplyStart');
  var end=document.getElementById('operateApplyEnd');
  if(!hint||!start||!end)return;
  var expiry=getEarliestOperateInsuranceExpiry();
  if(!expiry){hint.textContent='选择车辆后，系统将按所选车辆中最早的保险有效期校验申请时间段。';hint.className='text-xs text-[#00000073] mt-1';return;}

  hint.className='text-xs mt-1 '+(end.value&&end.value>expiry?'text-[#ff4d4f]':'text-[#00000073]');
}

  if(!target)return;
  target.innerHTML='<div class="p-3 border border-[#ffccc7] bg-[#fff2f0] rounded text-xs text-[#ff4d4f]">请补充：'+errors.map(operateEscape).join('；')+'</div>';
  target.scrollIntoView({behavior:'smooth',block:'center'});
}
function submitInitialOperateApplication(){
  var errors=operateAttachmentValidation('initial');
  var subject=document.getElementById('operateSubject');
  var manager=document.getElementById('operateProjectManager');
  var contact=document.getElementById('operateContact');
  var start=document.getElementById('operateApplyStart');
  var end=document.getElementById('operateApplyEnd');
  if(!subject||!subject.value)errors.unshift('请选择申请主体');
  if(!manager||!manager.value.trim())errors.unshift('请输入项目负责人姓名');
  if(!contact||!contact.value.trim())errors.unshift('请输入联系方式');
  if(!selectedRoads.length)errors.push('请选择商业化试点路段');
  if(!selectedVehicles.length)errors.push('请选择商业化试点车辆');
  if(!selectedPersons.length)errors.push('请选择商业化试点驾驶人（安全员）');
  if(!start||!start.value||!end||!end.value){errors.push('请选择商业化试点时间段');}
  else{
    var startDate=new Date(start.value+'T00:00:00');
    var endDate=new Date(end.value+'T00:00:00');
    var today=new Date();today.setHours(0,0,0,0);
    var sixMonthLimit=new Date(startDate);sixMonthLimit.setMonth(sixMonthLimit.getMonth()+6);
    if(startDate<today)errors.push('商业化试点开始日期不得早于当前日期');
    else if(endDate<startDate)errors.push('结束日期不得早于开始日期');
    else if(endDate>sixMonthLimit)errors.push('商业化试点时长原则上不超过6个月');
    var expiry=getEarliestOperateInsuranceExpiry();
    if(expiry&&end.value>expiry)errors.push('商业化试点结束日期不得超过所选车辆保险凭证有效期');
  }
  if(selectedVehicles.length>5)errors.push('首次开展商业化试点车辆不超过5辆');
  if(errors.length){showOperateInitialValidation(errors);return;}
  closeModal();
  showToast('商业化试点申请已提交');
  renderTable();
}

人（安全员）</div><div class="ant-form-control"><button type="button" class="ant-btn ant-btn-sm ant-btn-primary" onclick="openPersonSelectModal()">+ 添加人员</button><div style="overflow-x:auto;margin-top:8px"><table class="ant-table" style="width:100%;font-size:13px"><thead><tr><th>序号</th><th>姓名</th><th>性别</th><th>年龄</th><th>工作单位</th><th>证件类型</th><th>证件号码</th><th>操作</th></tr></thead><tbody id="personTableBody"><tr><td colspan="8" style="text-align:center;color:#00000073;padding:24px">暂未选择商业化试点驾驶人（安全员）</td></tr></tbody></table></div></div></div><h4 class="text-sm font-semibold text-[#000000d9] mb-3 mt-4 pb-2 border-b border-[#f0f0f0]">申请附件</h4>'+initialOperateAttachmentHtml('initial');

// 自测用：URL hash 自动触发目标弹窗
// #detail = 查看详情弹窗；#apply = 新增申请弹窗；#apply-attachments = 新增申请附件区；#fullscreen = 查看详情 + 真实点击全屏按钮
(function(){
  var h=location.hash;
  if(!h) return;
  if(h==='#detail') setTimeout(function(){ openDetail('DO202604001'); },400);
  else if(h==='#apply') setTimeout(function(){ openApplyModal(); },400);
  else if(h==='#apply-attachments') setTimeout(function(){openApplyModal();setTimeout(function(){var body=document.querySelector('#modal-mask .ant-modal-body');var groups=body&&body.querySelectorAll('.attachment-group');if(body&&groups&&groups[1])body.scrollTop=groups[1].offsetTop-12;},140);},400);
  else if(h==='#fullscreen'){
    setTimeout(function(){ openDetail('DO202604001'); },400);
    setTimeout(function(){
      var btn = document.getElementById('ant-modal-fs-btn');
      if(btn) btn.click();
    }, 800);
  }
})();
