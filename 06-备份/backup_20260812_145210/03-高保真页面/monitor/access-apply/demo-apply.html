<script>

  {id:'DA202603002',type:'initial',demoType:'passenger',company:'D公司',origId:'-',vehicleCount:1,roadCount:1,status:'active',time:'2026-03-10 15:21:48',validFrom:'2026-03-20',validTo:'2026-09-20'},

  {id:'DA202604008',type:'initial',demoType:'special',company:'J公司',origId:'-',vehicleCount:1,roadCount:1,status:'terminated',time:'2026-04-19 12:48:15',validFrom:'2026-05-01',validTo:'2026-11-01'},
  {id:'DA202605003',type:'initial',demoType:'passenger',company:'T品牌',origId:'-',vehicleCount:1,roadCount:2,status:'active',time:'2025-11-20 10:20:00',validFrom:'2025-12-01',validTo:'2026-06-30'},

function getOps(d){var ops=['<button class="ant-btn-link" onclick="openDetail(\''+d.id+'\')">查看</button>'];if(d.status==='draft')ops.push('<button class="ant-btn-link">编辑</button>','<button class="ant-btn-link">提交</button>');if(d.status==='rejected')ops.push('<button class="ant-btn-link">重新提交</button>');if(d.status==='pending_review'||d.status==='pending_expert'||d.status==='pending_committee_confirm')ops.push('<button class="ant-btn-link">撤回</button>');if(d.status==='active'){ops.push('<button class="ant-btn-link" onclick="openReportSubmitPage(\''+d.id+'\')">报告提交</button>');var hasPendingDerive=appData.some(function(a){return a.origId===d.id&&['draft','pending_review','pending_committee','pending_committee_confirm','pending_expert','pending_meeting','pending_plate'].indexOf(a.status)>-1;});var dAttr=hasPendingDerive?' disabled style="color:#00000040;cursor:not-allowed" title="存在进行中的派生申请，延期/变更/新增车辆三类互斥（见PRD 4.14）"':'';var cRenew=hasPendingDerive?'':('onclick="openRenewalPage(\''+d.id+'\')"');var cChange=hasPendingDerive?'':('onclick="openChangePage(\''+d.id+'\')"');var cAddV=hasPendingDerive?'':('onclick="openAddVehiclePage(\''+d.id+'\')"');var vt=new Date(d.validTo);var nm=new Date();var tm=new Date(nm.getTime()+60*24*60*60*1000);if(vt<=tm)ops.push('<button class="ant-btn-link" '+cRenew+dAttr+'>延期</button>');ops.push('<button class="ant-btn-link" '+cChange+dAttr+'>变更</button>','<button class="ant-btn-link" '+cAddV+dAttr+'>新增相同配置车辆</button>');}return ops.join('');}

function toggleMultiSelect(id){var panel=document.getElementById(id+'Panel');panel.classList.toggle('show');}
function getMultiSelectValues(id){var cbs=document.querySelectorAll('#'+id+'Panel input[type=checkbox]');var vals=[];cbs.forEach(function(cb){if(cb.checked)vals.push(cb.value);});return vals;}
function updateMultiSelectLabel(id){var vals=getMultiSelectValues(id);var label=document.getElementById(id+'Label');label.textContent=vals.length===0?'全部':vals.length+'项已选';label.style.color=vals.length===0?'#00000073':'#1677ff';}
var currentValidFilter='all';
function toggleDropdown(id){var el=document.getElementById(id);el.style.display=el.style.display==='none'?'block':'none';}
function selectValid(val,label){currentValidFilter=val;var sel=document.getElementById('fValid');sel.innerHTML=label+'<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>';document.getElementById('validDropdown').style.display='none';}
document.addEventListener('click',function(e){document.querySelectorAll('.multi-select').forEach(function(ms){if(!ms.contains(e.target)){ms.querySelector('.multi-select-panel').classList.remove('show');}});if(!e.target.closest('#fValid')&&!e.target.closest('#validDropdown')){var vd=document.getElementById('validDropdown');if(vd)vd.style.display='none';}});
document.addEventListener('change',function(e){if(e.target.closest('.multi-select-panel')){var panel=e.target.closest('.multi-select-panel');var ms=panel.closest('.multi-select');updateMultiSelectLabel(ms.id);}});

function renderTable(){var data=[].concat(appData);var statusVals=getMultiSelectValues('msStatus');if(statusVals.length>0)data=data.filter(function(d){return statusVals.indexOf(d.status)>-1;});if(currentValidFilter==='valid'){data=data.filter(function(d){return d.validFrom!=='-'&&d.validTo!=='-'&&new Date(d.validTo)>=new Date()&&new Date(d.validFrom)<=new Date();});}else if(currentValidFilter==='expired'){data=data.filter(function(d){return d.validTo!=='-'&&new Date(d.validTo)<new Date();});}else if(currentValidFilter==='not_started'){data=data.filter(function(d){return d.validFrom!=='-'&&new Date(d.validFrom)>new Date();});}var total=data.length;var cp=pager?pager.getCurrentPage():1;var ps=pager?pager.getPageSize():10;var start=(cp-1)*ps;var pd=data.slice(start,start+ps);var h='';pd.forEach(function(d){var st=statusMap[d.status]||statusMap.draft;var ty=typeMap[d.type]||typeMap.initial;var dt=demoTypeMap[d.demoType]||{label:'-'};var vr=d.validFrom!=='-'?d.validFrom+' 至 '+d.validTo:'-';h+='<tr><td class="col-code">'+d.id+'</td><td><span class="ant-tag ant-tag-default">'+ty.label+'</span></td><td><span class="ant-tag ant-tag-processing">'+dt.label+'</span></td><td class="col-code">'+(d.origId!=='-'?'<button class="ant-btn-link" onclick="openDetail(\''+d.origId+'\')">'+d.origId+'</button>':'-')+'</td><td class="col-num">'+d.vehicleCount+'</td><td><span class="ant-tag '+st.cls+'">'+st.label+'</span></td><td class="text-xs col-code">'+vr+'</td><td class="col-code">'+d.time+'</td><td class="flex gap-1 flex-wrap col-action">'+getOps(d)+'</td></tr>';});document.getElementById('mainTbody').innerHTML=h;if(pager)pager.setTotal(total);}
function resetFilter(){document.getElementById('fAppId').value='';document.getElementById('fCompany').value='';document.querySelectorAll('#msStatusPanel input[type=checkbox]').forEach(function(cb){cb.checked=false;});updateMultiSelectLabel('msStatus');currentValidFilter='all';var sel=document.getElementById('fValid');sel.innerHTML='全部<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>';if(pager)pager.reset();renderTable();}

function renderFLH(logs){var h='<div class="space-y-3">';logs.forEach(function(l,i){var hn=i<logs.length-1;var bs=hn?'border-left:2px solid '+l.color+';margin-left:5px;padding-left:12px':'margin-left:17px;padding-left:0';h+='<div class="relative pb-3" style="'+bs+'"><div class="absolute w-3 h-3 rounded-full flex items-center justify-center text-[8px] text-white font-bold mt-1" style="left:-7px;top:0;background:'+l.color+'">'+l.dot+'</div><div class="min-w-0"><div class="flex items-center justify-between mb-2"><span class="text-sm font-medium text-[#000000d9]">'+l.title+'</span><span class="ant-tag '+l.tagCls+' text-[10px]">'+l.status+'</span></div><div class="text-xs text-[#00000073] space-y-1"><div><span class="text-[#00000040]">处理人：</span>'+l.handler+'</div><div><span class="text-[#00000040]">处理时间：</span>'+l.time+'</div>';if(l.opinion)h+='<div class="whitespace-pre-line mt-1.5 p-2 bg-[#fafafa] rounded"><span class="text-[#00000040]">处理意见：</span>'+l.opinion+'</div>';h+='</div></div></div>';});return h+'</div>';}

function getRelatedVersions(id){var current=appData.find(function(a){return a.id===id;});if(!current)return [];var result=[];var parentId=current.origId&&current.origId!=='-'?current.origId:null;if(parentId){var parent=appData.find(function(a){return a.id===parentId;});if(parent){result.push({id:parent.id,time:parent.time,typeLabel:typeMap[parent.type]?typeMap[parent.type].label:parent.type,company:parent.company,status:parent.status,statusLabel:statusMap[parent.status]?statusMap[parent.status].label:parent.status,validFrom:parent.validFrom,validTo:parent.validTo,relation:'parent'});}}result.push({id:current.id,time:current.time,typeLabel:typeMap[current.type]?typeMap[current.type].label:current.type,company:current.company,status:current.status,statusLabel:statusMap[current.status]?statusMap[current.status].label:current.status,validFrom:current.validFrom,validTo:current.validTo,relation:current.type==='renewal'?'renewal':current.type==='change'?'change':current.type==='add_vehicle'?'add_vehicle':'current',parentId:parentId});var children=appData.filter(function(a){return a.origId===id;});children.forEach(function(c){result.push({id:c.id,time:c.time,typeLabel:typeMap[c.type]?typeMap[c.type].label:c.type,company:c.company,status:c.status,statusLabel:statusMap[c.status]?statusMap[c.status].label:c.status,validFrom:c.validFrom,validTo:c.validTo,relation:c.type==='renewal'?'renewal':c.type==='change'?'change':'add_vehicle',parentId:id});});return result;}
function openVersionModal(id){var related=getRelatedVersions(id);var h='<div class="text-[11px] text-[#00000073] mb-3 leading-relaxed">派生申请关系：<span class="text-[#722ed1]">↑延期=时间接力</span>　<span class="text-[#eb2f96]">⇒变更=替换覆盖（原申请转"已变更"）</span>　<span class="text-[#13c2c2]">＋新增车辆=附属追加并入</span></div><div class="space-y-0">';related.forEach(function(r){var isCurrent=r.id===id;var nodeClass='version-node';var dotColor='#1677ff';if(r.status==='active'){dotColor='#52c41a';}else if(r.status==='terminated'){dotColor='#ff4d4f';}else if(r.status==='expired'){dotColor='#fa8c16';}else if(r.status==='changed'){dotColor='#1677ff';nodeClass+=' changed';}if(r.relation==='add_vehicle'){nodeClass+=' add-vehicle';dotColor='#13c2c2';}var deriveLabel='';if(r.relation==='renewal')deriveLabel='<div class="text-[10px] text-[#722ed1] mt-0.5 font-medium">↑ 延期自 '+r.parentId+'（时间接力）</div>';else if(r.relation==='change')deriveLabel='<div class="text-[10px] text-[#eb2f96] mt-0.5 font-medium">⇒ 变更自 '+r.parentId+'（替换覆盖，原申请转"已变更"）</div>';else if(r.relation==='add_vehicle')deriveLabel='<div class="text-[10px] text-[#13c2c2] mt-0.5 font-medium">＋ 新增车辆自 '+r.parentId+'（附属追加并入）</div>';h+='<div class="'+nodeClass+(isCurrent?' current':'')+'"><div class="flex items-center justify-between"><span class="text-xs font-medium text-[#000000d9]">'+r.id+'</span><span class="text-[10px] text-[#00000073]">'+r.time+'</span></div><div class="text-xs text-[#00000073] mt-1">'+r.typeLabel+' · '+r.company+'</div>'+deriveLabel+'<div class="text-xs mt-1"><span class="ant-tag text-[10px]" style="background:'+dotColor+'15;color:'+dotColor+';border-color:'+dotColor+'40">'+r.statusLabel+'</span></div>'+(r.validFrom!=='-'?'<div class="text-[10px] text-[#00000040] mt-1">'+r.validFrom+' 至 '+r.validTo+'</div>':'')+(isCurrent?'<div class="text-[10px] text-[#1677ff] mt-1 font-medium">← 当前查看</div>':'')+'</div>';});h+='</div>';openModal('版本演进 - '+id,h,{width:600,footer:'<button class="ant-btn" onclick="closeModal()">关闭</button>'});}

var legacyDemoSubmitForm=submitDemoForm;
submitDemoForm=function(scope,materials,successText,options){if(scope!=='add')return legacyDemoSubmitForm(scope,materials,successText,options);var errors=validateDemoFiles(scope,materials);var mode=document.querySelector('input[name="demoAddMode"]:checked');var auto=mode&&mode.value==='auto';if(auto)errors=errors.concat(validateDemoFiles(scope,autoDemoSupplementMaterials));if(!selectedVehicles.length)errors.push('请选择新增车辆');var reason=document.getElementById('demoAddReason');if(!reason||!reason.value.trim())errors.push('请输入新增车辆必要性说明');var hours=parseFloat((document.getElementById('demo-add-hours')||{}).value);var kilometers=parseFloat((document.getElementById('demo-add-km')||{}).value);var requiredKilometers=auto?2000:1000;if(!(hours>=480))errors.push('前置测试时长不少于480小时');if(!(kilometers>=requiredKilometers))errors.push('前置测试里程不少于'+requiredKilometers+'公里');if(!(document.getElementById('demo-add-no-violation')||{}).checked)errors.push('请确认测试期间无交通违法行为');if(!(document.getElementById('demo-add-no-accident')||{}).checked)errors.push('请确认未发生有责交通事故');if(errors.length){showDemoValidation(scope,errors);return;}closeModal();showToast(successText);};

submitDemoForm=function(scope,materials,successText,options){if(scope!=='initial'&&scope!=='add')return demoSubmitWithManualPrecondition(scope,materials,successText,options);var errors=validateDemoFiles(scope,materials);if(scope==='initial'){if(!selectedRoads.length)errors.push('请选择示范应用路段');if(!selectedVehicles.length)errors.push('请选择示范应用车辆');if(!selectedPersons.length)errors.push('请选择示范应用测试人员');var subject=document.getElementById('demoApplySubject');var start=document.getElementById('demoApplyStart');var end=document.getElementById('demoApplyEnd');if(!subject||!subject.value)errors.push('请选择申请主体');if(!start||!start.value||!end||!end.value)errors.push('请选择示范应用时间段');else if(new Date(end.value)<new Date(start.value))errors.push('结束日期不得早于开始日期');else if((new Date(end.value)-new Date(start.value))>366*24*60*60*1000)errors.push('示范应用时长原则上不超过12个月');var initialMode=document.querySelector('input[name="demoMode"]:checked');if(initialMode&&initialMode.value==='auto')errors=errors.concat(validateDemoFiles(scope,autoDemoSupplementMaterials));}else{var addMode=document.querySelector('input[name="demoAddMode"]:checked');if(addMode&&addMode.value==='auto')errors=errors.concat(validateDemoFiles(scope,autoDemoSupplementMaterials));if(!selectedVehicles.length)errors.push('请选择新增车辆');var reason=document.getElementById('demoAddReason');if(!reason||!reason.value.trim())errors.push('请输入新增车辆必要性说明');}if(errors.length){showDemoValidation(scope,errors);return;}closeModal();showToast(successText);if(scope==='initial')renderTable();};

function demoDetailJs(value){return String(value||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

function demoDetailGroup(title,items,prefix){return '<section class="attachment-group"><div class="attachment-group-title">'+title+'</div>'+items.map(function(item){return demoDetailItem(item,prefix);}).join('')+'</section>';}
function demoDetailBaseGroups(d){var html=demoDetailGroup('附件1、附件6、附件7：申请文件',demoApplicationFiles,'file')+demoDetailGroup('附件8：申请材料',demoApplicationMaterials,'material');if(String(d.modeType||'').indexOf('auto')>-1)html+=demoDetailGroup('自动驾驶示范应用补充材料',autoDemoSupplementMaterials,'auto');return html;}
function demoDetailCurrentItems(d){var declaration={id:'附件7',name:'最新示范应用安全性自我声明',file:'最新示范应用安全性自我声明.pdf',full:'示范应用申请主体提交的最新安全性自我声明。'};if(d.type==='renewal')return [declaration,{id:1,name:'延期申请书',file:'示范应用延期申请书.pdf'},{id:2,name:'前期总结评估报告',file:'示范应用前期总结评估报告.pdf'},{id:3,name:'延期必要性说明',file:'示范应用延期必要性说明.pdf'}];if(d.type==='change')return [declaration,{id:1,name:'变更理由及必要性说明',file:'示范应用变更说明材料.pdf'},{id:2,name:'相应证明材料',file:'示范应用变更证明材料.pdf'}];return [declaration,{id:1,name:'新增车辆数量及必要性说明',file:'新增车辆数量及必要性说明.pdf'},{id:2,name:'新增车辆前置测试证明',file:'新增车辆前置测试证明.pdf'}];}
function demoDetailAttachments(d){if(d.type==='initial')return demoDetailBaseGroups(d);var title=d.type==='renewal'?'延期申请本次材料':d.type==='change'?'变更申请本次材料':'新增车辆本次材料';return demoDetailGroup(title,demoDetailCurrentItems(d),'current')+'<details class="orig-mats"><summary class="text-xs text-[#00000073] hover:text-[#1677ff] flex items-center gap-1 select-none"><span class="text-[#1677ff]">关联原申请附件</span><span class="text-[#00000040] ml-1">- 点击展开查看</span></summary><div class="mt-2">'+demoDetailBaseGroups(d)+'</div></details>';}
function openDemoDetailFile(file){openModal('附件预览','<div class="py-8 text-center text-sm text-[#00000073]"><div class="text-[#000000d9] mb-1">'+escapeDemoHtml(file)+'</div><div>此处展示附件预览内容</div></div>',{footer:'<button class="ant-btn" onclick="closeModal()">关闭</button><button class="ant-btn ant-btn-primary" onclick="downloadDemoDetailFile(\''+demoDetailJs(file)+'\')">下载</button>'});}
function downloadDemoDetailFile(file){showToastMsg('已开始下载：'+file);}
var legacyDemoOpenDetail=openDetail;
openDetail=function(id){legacyDemoOpenDetail(id);var d=getDetailData(id);var body=document.querySelector('#modal-mask .ant-modal-body');if(!d||!body)return;var headings=body.querySelectorAll('h4');for(var i=0;i<headings.length;i++){var heading=headings[i];if(heading.textContent.trim()==='申请材料'||heading.textContent.trim()==='新增车辆申请材料'){heading.textContent='申请附件';var oldContent=heading.nextElementSibling;if(oldContent)oldContent.outerHTML='<div class="detail-attachment-panel">'+demoDetailAttachments(d)+'</div>';break;}}};
if(location.hash==='#detail-attachments')setTimeout(function(){openDetail('DA202604001');setTimeout(function(){var body=document.querySelector('#modal-mask .ant-modal-body');var heading=body&&Array.prototype.slice.call(body.querySelectorAll('h4')).find(function(item){return item.textContent.trim()==='申请附件';});if(body&&heading)body.scrollTop=Math.max(0,heading.offsetTop-120);},160);},400);
</script>
<script src="../../common.js"></script>
<script src="../../components/person-detail-modal.js"></script>
</body>
