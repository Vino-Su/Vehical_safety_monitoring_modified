  {id:'DA202603002',type:'initial',demoType:'passenger',company:'D公司',origId:'-',vehicleCount:1,roadCount:1,status:'active',time:'2026-03-10 15:21:48',validFrom:'2026-03-20',validTo:'2026-09-20'},

  {id:'DA202604008',type:'initial',demoType:'special',company:'J公司',origId:'-',vehicleCount:1,roadCount:1,status:'terminated',time:'2026-04-19 12:48:15',validFrom:'2026-05-01',validTo:'2026-11-01'},
  {id:'DA202605003',type:'initial',demoType:'passenger',company:'T品牌',origId:'-',vehicleCount:1,roadCount:2,status:'active',time:'2025-11-20 10:20:00',validFrom:'2025-12-01',validTo:'2026-06-30'},

function getOps(d){var ops=['<button class="ant-btn-link" onclick="openDetail(\''+d.id+'\')">查看</button>'];if(d.status==='draft')ops.push('<button class="ant-btn-link">编辑</button>','<button class="ant-btn-link">提交</button>');if(d.status==='rejected')ops.push('<button class="ant-btn-link">重新提交</button>');if(d.status==='pending_review'||d.status==='pending_expert'||d.status==='pending_committee_confirm')ops.push('<button class="ant-btn-link">撤回</button>');if(d.status==='active'){ops.push('<button class="ant-btn-link" onclick="openReportSubmitPage(\''+d.id+'\')">报告提交</button>');var hasPendingDerive=appData.some(function(a){return a.origId===d.id&&['draft','pending_review','pending_committee','pending_committee_confirm','pending_expert','pending_meeting','pending_plate'].indexOf(a.status)>-1;});var dAttr=hasPendingDerive?' disabled style="color:#00000040;cursor:not-allowed" title="存在进行中的派生申请，延期/变更/新增车辆三类互斥（见PRD 4.14）"':'';var cRenew=hasPendingDerive?'':('onclick="openRenewalPage(\''+d.id+'\')"');var cChange=hasPendingDerive?'':('onclick="openChangePage(\''+d.id+'\')"');var cAddV=hasPendingDerive?'':('onclick="openAddVehiclePage(\''+d.id+'\')"');var vt=new Date(d.validTo);var nm=new Date();var tm=new Date(nm.getTime()+90*24*60*60*1000);if(vt<=tm)ops.push('<button class="ant-btn-link" '+cRenew+dAttr+'>延期</button>');ops.push('<button class="ant-btn-link" '+cChange+dAttr+'>变更</button>','<button class="ant-btn-link" '+cAddV+dAttr+'>新增相同配置车辆</button>');}return ops.join('');}

function toggleMultiSelect(id){var panel=document.getElementById(id+'Panel');panel.classList.toggle('show');}
function getMultiSelectValues(id){var cbs=document.querySelectorAll('#'+id+'Panel input[type=checkbox]');var vals=[];cbs.forEach(function(cb){if(cb.checked)vals.push(cb.value);});return vals;}
function updateMultiSelectLabel(id){var vals=getMultiSelectValues(id);var label=document.getElementById(id+'Label');label.textContent=vals.length===0?'全部':vals.length+'项已选';label.style.color=vals.length===0?'#00000073':'#1677ff';}
var currentValidFilter='all';
function toggleDropdown(id){var el=document.getElementById(id);el.style.display=el.style.display==='none'?'block':'none';}
function selectValid(val,label){currentValidFilter=val;var sel=document.getElementById('fValid');sel.innerHTML=label+'<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>';document.getElementById('validDropdown').style.display='none';}
document.addEventListener('click',function(e){document.querySelectorAll('.multi-select').forEach(function(ms){if(!ms.contains(e.target)){ms.querySelector('.multi-select-panel').classList.remove('show');}});if(!e.target.closest('#fValid')&&!e.target.closest('#validDropdown')){var vd=document.getElementById('validDropdown');if(vd)vd.style.display='none';}});
document.addEventListener('change',function(e){if(e.target.closest('.multi-select-panel')){var panel=e.target.closest('.multi-select-panel');var ms=panel.closest('.multi-select');updateMultiSelectLabel(ms.id);}});

function renderTable(){var data=[].concat(appData);var statusVals=getMultiSelectValues('msStatus');if(statusVals.length>0)data=data.filter(function(d){return statusVals.indexOf(d.status)>-1;});if(currentValidFilter==='valid'){data=data.filter(function(d){return d.validFrom!=='-'&&d.validTo!=='-'&&new Date(d.validTo)>=new Date()&&new Date(d.validFrom)<=new Date();});}else if(currentValidFilter==='expired'){data=data.filter(function(d){return d.validTo!=='-'&&new Date(d.validTo)<new Date();});}else if(currentValidFilter==='not_started'){data=data.filter(function(d){return d.validFrom!=='-'&&new Date(d.validFrom)>new Date();});}var total=data.length;var cp=pager?pager.getCurrentPage():1;var ps=pager?pager.getPageSize():10;var start=(cp-1)*ps;var pd=data.slice(start,start+ps);var h='';pd.forEach(function(d){var st=statusMap[d.status]||statusMap.draft;var ty=typeMap[d.type]||typeMap.initial;var dt=demoTypeMap[d.demoType]||{label:'-'};var vr=d.validFrom!=='-'?d.validFrom+' 至 '+d.validTo:'-';h+='<tr><td class="col-code">'+d.id+'</td><td><span class="ant-tag ant-tag-default">'+ty.label+'</span></td><td><span class="ant-tag ant-tag-processing">'+dt.label+'</span></td><td class="col-code">'+(d.origId!=='-'?'<button class="ant-btn-link" onclick="openDetail(\''+d.origId+'\')">'+d.origId+'</button>':'-')+'</td><td class="col-num">'+d.vehicleCount+'</td><td><span class="ant-tag '+st.cls+'">'+st.label+'</span></td><td class="text-xs col-code">'+vr+'</td><td class="col-code">'+d.time+'</td><td class="flex gap-1 flex-wrap col-action">'+getOps(d)+'</td></tr>';});document.getElementById('mainTbody').innerHTML=h;if(pager)pager.setTotal(total);}
function resetFilter(){document.getElementById('fAppId').value='';document.getElementById('fCompany').value='';document.querySelectorAll('#msStatusPanel input[type=checkbox]').forEach(function(cb){cb.checked=false;});updateMultiSelectLabel('msStatus');currentValidFilter='all';var sel=document.getElementById('fValid');sel.innerHTML='全部<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>';if(pager)pager.reset();renderTable();}

function updateFlowPreview(){var el=document.getElementById('flowPreview');if(!el)return;var steps=['提交申请','第三方初审','市工作专班审核','专家评审','专班专题会议审议','上传临时牌照'];var h='<div class="text-xs text-[#00000073] mb-2">申请流程预览</div><div class="flex items-center gap-0 text-xs flex-wrap">';steps.forEach(function(s,i){h+='<div class="flex items-center"><div class="w-5 h-5 rounded-full text-white flex items-center justify-center text-[10px]" style="background:#1677ff">'+(i+1)+'</div><span class="ml-1 whitespace-nowrap">'+s+'</span></div>';if(i<steps.length-1)h+='<div class="w-3 h-0.5 mx-1" style="background:#d9d9d9"></div>';});h+='</div>';el.innerHTML=h;}

function toggleDemoMode(val){var el=document.getElementById('autoDemoPrecondition');if(el)el.style.display=val==='auto'?'block':'none';}

function saveDraft(){var newId='DA'+new Date().getFullYear()+String(new Date().getMonth()+1).padStart(2,'0')+String(appData.length+1).padStart(3,'0');var dtEl=document.querySelector('input[name="demoType"]:checked');var demoType=dtEl?dtEl.value:'passenger';appData.unshift({id:newId,type:'initial',demoType:demoType,company:'A公司',origId:'-',vehicleCount:selectedVehicles.length,roadCount:selectedRoads.length,status:'draft',time:new Date().toISOString().split('T')[0],validFrom:'-',validTo:'-'});closeModal();renderTable();showToast('草稿已保存，申请编号：'+newId);}

<script>
function veEsc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function veRelation(a){return a.type==='renewal'?'延期':a.type==='change'?'变更':a.type==='add_vehicle'?'新增车辆':'初次申请';}
function veState(a){if(a.status==='active')return 'active';if(a.status==='terminated')return 'terminated';if(a.status==='changed')return 'changed';if(a.status&&a.status.indexOf('pending_')===0)return 'processing';if(a.status==='expired'||a.status==='withdrawn'||a.status==='rejected')return 'ended';return 'neutral';}
function veDate(a){return String(a.time||'').replace('T',' ');}
function veFamily(id){var current=appData.find(function(a){return a.id===id;});if(!current)return {current:null,main:[],attached:[]};var byId={};appData.forEach(function(a){byId[a.id]=a;});var root=current,guard=0;while(root.origId&&root.origId!=='-'&&byId[root.origId]&&guard++<appData.length){root=byId[root.origId];}var all=[],seen={};function walk(a){if(!a||seen[a.id])return;seen[a.id]=true;all.push(a);appData.filter(function(c){return c.origId===a.id;}).sort(function(x,y){return veDate(x).localeCompare(veDate(y));}).forEach(walk);}walk(root);return {current:current,main:all.filter(function(a){return a.type!=='add_vehicle';}).sort(function(x,y){return veDate(x).localeCompare(veDate(y));}),attached:all.filter(function(a){return a.type==='add_vehicle';}).sort(function(x,y){return veDate(x).localeCompare(veDate(y));}),byId:byId};}
function veNode(a,current,child){var state=veState(a),cls=child?'ve-child':'ve-main-node';if(state!=='neutral')cls+=' '+state;if(a.id===current.id)cls+=' current';var relation=veRelation(a),parent=a.origId&&a.origId!=='-'?a.origId:'';var relationText=parent?(relation==='新增车辆'?'新增车辆自 ':relation+'自 ')+veEsc(parent):'';var date=a.validFrom&&a.validFrom!=='-'?veEsc(a.validFrom)+' 至 '+veEsc(a.validTo):'';return '<div class="'+cls+'"><div class="ve-node-head"><button type="button" class="ant-btn-link ve-node-id" onclick="openDetail(\''+veEsc(a.id)+'\')">'+veEsc(a.id)+'</button><span class="ve-node-time">'+veEsc(veDate(a))+'</span></div><div class="ve-node-meta">'+veEsc(relation)+' · '+veEsc(a.company||'-')+' <span class="ant-tag '+(statusMap[a.status]?statusMap[a.status].cls:'ant-tag-default')+' text-[10px]">'+veEsc(statusMap[a.status]?statusMap[a.status].label:a.status||'-')+'</span></div>'+(relationText?'<div class="ve-node-relation">'+relationText+'</div>':'')+(date?'<div class="ve-node-date">有效期 '+date+'</div>':'')+(a.id===current.id?'<div class="ve-node-relation"><b>当前查看</b></div>':'')+'</div>';}
function getRelatedVersions(id){var f=veFamily(id),r=[];f.main.concat(f.attached).forEach(function(a){r.push({id:a.id,time:veDate(a),typeLabel:typeMap[a.type]?typeMap[a.type].label:a.type,company:a.company,status:a.status,statusLabel:statusMap[a.status]?statusMap[a.status].label:a.status,validFrom:a.validFrom,validTo:a.validTo,relation:veRelation(a),parentId:a.origId});});return r;}
function openVersionModal(id){var f=veFamily(id);if(!f.current)return;var h='<div class="ve-summary"><strong>申请活动版本演进</strong><div>展示当前申请所属的全部关联申请，主链按申请时间排序；新增车辆作为附属申请展示，不进入资格主链。</div><div class="ve-legend"><span><i class="ve-key active"></i>已生效</span><span><i class="ve-key processing"></i>审批中</span><span><i class="ve-key ended"></i>已结束</span><span><i class="ve-key terminated"></i>已终止</span></div></div><div class="ve-family">';if(!f.main.length){h+='<div class="ve-empty">暂无关联申请</div>';}else{f.main.forEach(function(a){h+=veNode(a,f.current,false);var children=f.attached.filter(function(c){return c.origId===a.id;});if(children.length){h+='<div class="ve-children">';children.forEach(function(c){h+=veNode(c,f.current,true);});h+='</div>';}});}h+='</div>';openModal('版本演进 - '+veEsc(id),h,{width:600,footer:'<button class="ant-btn" onclick="closeModal()">关闭</button>'});}
</script>

<script>
/* 示范应用变更申请仅配置业务字段，弹窗、附件与详情由共享框架渲染。 */
(function(){
  function demoAccessText(list, formatter){
    return (list || []).map(formatter).filter(Boolean).join('、') || '暂未设置';
  }
  function demoAccessRecord(id){
    var raw=(appData || []).find(function(item){return item.id===id;}) || {};
    var detail=getDetailData(id) || raw;
    if(!detail || !detail.id)return null;
    var record=Object.assign({},detail,raw);
    record.originalApplicationId=raw.type==='change'&&raw.origId&&raw.origId!=='-'?raw.origId:raw.id;
    record.demoType=record.demoType || raw.demoType || 'passenger';
    record.demoTypeLabel=record.demoTypeLabel || ((demoTypeMap[record.demoType]||{}).label) || '-';
    record.applicationTime=(record.validFrom&&record.validFrom!=='-'?record.validFrom:'')+' 至 '+(record.validTo&&record.validTo!=='-'?record.validTo:'');
    record.roadNames=demoAccessText(record.roads,function(road){return road.name;});
    record.vehicleNames=demoAccessText(record.vehicles,function(vehicle){return [vehicle.brand,vehicle.model].filter(Boolean).join(' ');});
    record.personNames=demoAccessText(record.persons,function(person){return person.name;});
    record.transferRoads=record.transferRoads || '暂未设置';
    record.project=record.project || 'L3级城市道路载人示范应用项目';
    record.originalAttachments=record.originalAttachments || ['示范应用安全性自我声明_'+record.originalApplicationId+'.pdf','示范应用原申请材料_'+record.originalApplicationId+'.pdf'];
    record.originalAttachmentGroups=[
      {title:'附件1、附件6、附件7：申请文件',items:demoApplicationFiles},
      {title:'附件8：申请材料',items:demoApplicationMaterials}
    ];
    if(String(record.modeType||'').indexOf('auto')>-1)record.originalAttachmentGroups.push({title:'自动驾驶示范应用补充材料',items:autoDemoSupplementMaterials});
    if(record.type==='change'){
      record.changeReason=record.changeReason || '根据示范应用运营计划调整情况，申请变更相关内容。';
      record.attachments=Object.assign({
        latestDeclaration:'最新示范应用安全性自我声明.pdf',
        reasonNecessity:'示范应用变更理由及必要性说明.pdf',
        supportingMaterials:'示范应用变更证明材料.pdf'
      },record.attachments || {});
      var retainedSnapshots=function(list){return (list||[]).map(function(item){return Object.assign({},item,{changeStatus:'retained'});});};
      record.changeFields=record.changeFields || {
        demoType:{label:'示范应用类型',oldValue:record.demoTypeLabel,newValue:record.demoTypeLabel},
        vehicles:{label:'示范应用车辆',oldValue:record.vehicleNames,newValue:record.vehicleNames,items:retainedSnapshots(record.vehicles)},
        persons:{label:'示范应用驾驶员（安全员）',oldValue:record.personNames,newValue:record.personNames,items:retainedSnapshots(record.persons)},
        demoTime:{label:'示范应用时间',oldValue:record.applicationTime,newValue:record.applicationTime},

    getOriginalAttachmentGroups:function(record){var source=record.sourceRecord||record;var groups=[{title:'附件1、附件6、附件7：申请文件',items:demoApplicationFiles},{title:'附件8：申请材料',items:demoApplicationMaterials}];if(String(source.modeType||'').indexOf('auto')>-1)groups.push({title:'自动驾驶示范应用补充材料',items:autoDemoSupplementMaterials});return groups;},
    getVersions:demoAccessVersions,openVersionDetail:function(id){openDetail(id);},
    onSubmitRenewal:function(payload,record,source){var newId='DA202608'+String((appData||[]).length+1).padStart(3,'0');appData.unshift({id:newId,type:'renewal',demoType:source.demoType,company:source.company,origId:source.id,vehicleCount:source.vehicleCount||(source.vehicles||[]).length,roadCount:source.roadCount||(source.roads||[]).length,status:'pending_review',time:'2026-08-14 11:15:00',validFrom:payload.validFrom,validTo:payload.validTo,renewalReason:payload.renewalReason,attachments:payload.attachments});renderTable();showToast('示范应用延期申请已提交，等待第三方初审');return true;}
  };
  var demoOpenDetailBeforeRenewalFramework=openDetail;
  openDetail=function(id){var raw=(appData||[]).find(function(item){return item.id===id;});if(raw&&raw.type==='renewal'){AccessApplyFramework.openRenewalDetail(demoRenewalConfig,id);return;}return demoOpenDetailBeforeRenewalFramework(id);};
  openRenewalPage=function(id){AccessApplyFramework.openRenewal(demoRenewalConfig,id);};
